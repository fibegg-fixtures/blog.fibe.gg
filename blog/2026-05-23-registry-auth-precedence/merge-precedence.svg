<svg viewBox="0 0 720 372" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="How Marquee DockerHub credentials and Playspec credentials merge into one config.json, with Playspec winning per registry">
  <defs>
    <marker id="mp-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#757d5e"/>
    </marker>
  </defs>

  <text x="360" y="26" text-anchor="middle" fill="#f3f0e0" font-size="17" font-weight="700" font-family="IBM Plex Sans, sans-serif">Building the auth config: merge, not a strict tree</text>

  <!-- Left input: Marquee -->
  <rect x="24" y="58" width="270" height="120" rx="8" fill="#20251a" stroke="#545c42"/>
  <text x="159" y="82" text-anchor="middle" fill="#eec854" font-size="14" font-weight="700" font-family="IBM Plex Sans, sans-serif">Marquee DockerHub auth</text>
  <text x="159" y="104" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">DockerHub login from the host</text>
  <rect x="44" y="118" width="230" height="44" rx="5" fill="#252a1e" stroke="#434a35"/>
  <text x="159" y="138" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="JetBrains Mono, monospace">index.docker.io &#8594; user:token</text>
  <text x="159" y="154" text-anchor="middle" fill="#a19f89" font-size="10" font-family="IBM Plex Sans, sans-serif">base layer (lower priority)</text>

  <!-- Right input: Playspec -->
  <rect x="426" y="58" width="270" height="120" rx="8" fill="#20251a" stroke="#545c42"/>
  <text x="561" y="82" text-anchor="middle" fill="#92df62" font-size="14" font-weight="700" font-family="IBM Plex Sans, sans-serif">Playspec auth</text>
  <text x="561" y="104" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">explicit + inferred creds</text>
  <rect x="446" y="118" width="230" height="44" rx="5" fill="#252a1e" stroke="#434a35"/>
  <text x="561" y="137" text-anchor="middle" fill="#c7c4ae" font-size="10.5" font-family="JetBrains Mono, monospace">explicit creds + inferred GHCR</text>
  <text x="561" y="153" text-anchor="middle" fill="#92df62" font-size="10" font-family="IBM Plex Sans, sans-serif">wins per registry (overrides)</text>

  <!-- merge node -->
  <line x1="159" y1="178" x2="330" y2="220" stroke="#757d5e" stroke-width="1.5" marker-end="url(#mp-arrow)"/>
  <line x1="561" y1="178" x2="390" y2="220" stroke="#757d5e" stroke-width="1.5" marker-end="url(#mp-arrow)"/>
  <rect x="276" y="222" width="168" height="52" rx="8" fill="#20251a" stroke="#79d44e"/>
  <text x="360" y="244" text-anchor="middle" fill="#abe87f" font-size="13" font-weight="700" font-family="IBM Plex Sans, sans-serif">merge per registry</text>
  <text x="360" y="263" text-anchor="middle" fill="#a19f89" font-size="10.5" font-family="IBM Plex Sans, sans-serif">same registry key &#8594; Playspec value</text>

  <!-- output -->
  <line x1="360" y1="274" x2="360" y2="304" stroke="#757d5e" stroke-width="1.5" marker-end="url(#mp-arrow)"/>
  <rect x="170" y="306" width="380" height="52" rx="8" fill="#252a1e" stroke="#56d8c0"/>
  <text x="360" y="328" text-anchor="middle" fill="#56d8c0" font-size="13" font-weight="700" font-family="JetBrains Mono, monospace">{ "auths": { ... } }</text>
  <text x="360" y="347" text-anchor="middle" fill="#a19f89" font-size="10.5" font-family="IBM Plex Sans, sans-serif">written to a per-project config.json over SSH</text>
</svg>
