<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Generation drift guard: incoming generation compared against current">
  <defs>
    <marker id="dg-arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#757d5e"/>
    </marker>
    <marker id="dg-arrow-green" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5cb43a"/>
    </marker>
    <marker id="dg-arrow-ember" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#f08760"/>
    </marker>
  </defs>

  <text x="360" y="26" text-anchor="middle" fill="#f3f0e0" font-size="16" font-weight="700" font-family="IBM Plex Sans, sans-serif">The drift guard &#183; is this callback stale?</text>

  <!-- incoming webhook -->
  <rect x="30" y="60" width="200" height="70" rx="8" fill="#252a1e" stroke="#56d8c0" stroke-width="1.5"/>
  <text x="130" y="86" text-anchor="middle" fill="#56d8c0" font-size="13" font-weight="700" font-family="IBM Plex Sans, sans-serif">incoming webhook</text>
  <text x="130" y="108" text-anchor="middle" fill="#c7c4ae" font-size="12" font-family="JetBrains Mono, monospace">generation = N</text>

  <!-- current row -->
  <rect x="30" y="170" width="200" height="70" rx="8" fill="#20251a" stroke="#434a35" stroke-width="1.5"/>
  <text x="130" y="196" text-anchor="middle" fill="#c7c4ae" font-size="13" font-weight="700" font-family="IBM Plex Sans, sans-serif">marquee row</text>
  <text x="130" y="218" text-anchor="middle" fill="#f5da79" font-size="12" font-family="JetBrains Mono, monospace">generation counter</text>

  <!-- decision -->
  <polygon points="400,150 470,195 400,240 330,195" fill="#252a1e" stroke="#eec854" stroke-width="1.5"/>
  <text x="400" y="190" text-anchor="middle" fill="#f5da79" font-size="11.5" font-family="JetBrains Mono, monospace">N &gt; 0 and</text>
  <text x="400" y="206" text-anchor="middle" fill="#f5da79" font-size="11.5" font-family="JetBrains Mono, monospace">N != current?</text>

  <line x1="230" y1="95" x2="360" y2="170" stroke="#757d5e" stroke-width="1.8" marker-end="url(#dg-arrow)"/>
  <line x1="230" y1="205" x2="328" y2="197" stroke="#757d5e" stroke-width="1.8" marker-end="url(#dg-arrow)"/>

  <!-- reject -->
  <rect x="520" y="80" width="180" height="64" rx="8" fill="#252a1e" stroke="#f08760" stroke-width="1.5"/>
  <text x="610" y="106" text-anchor="middle" fill="#f08760" font-size="13" font-weight="700" font-family="IBM Plex Sans, sans-serif">stale &#8594; reject</text>
  <text x="610" y="126" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">log, return success</text>

  <!-- apply -->
  <rect x="520" y="240" width="180" height="64" rx="8" fill="#252a1e" stroke="#5cb43a" stroke-width="1.5"/>
  <text x="610" y="266" text-anchor="middle" fill="#92df62" font-size="13" font-weight="700" font-family="IBM Plex Sans, sans-serif">current &#8594; apply</text>
  <text x="610" y="286" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">run the verb handler</text>

  <line x1="430" y1="170" x2="518" y2="120" stroke="#f08760" stroke-width="1.8" marker-end="url(#dg-arrow-ember)"/>
  <text x="486" y="150" text-anchor="middle" fill="#f08760" font-size="11" font-weight="700" font-family="JetBrains Mono, monospace">yes</text>

  <line x1="430" y1="220" x2="518" y2="268" stroke="#5cb43a" stroke-width="1.8" marker-end="url(#dg-arrow-green)"/>
  <text x="486" y="258" text-anchor="middle" fill="#92df62" font-size="11" font-weight="700" font-family="JetBrains Mono, monospace">no</text>

  <!-- footnote -->
  <rect x="30" y="320" width="670" height="44" rx="8" fill="#20251a" stroke="#434a35"/>
  <text x="46" y="339" fill="#c7c4ae" font-size="11.5" font-family="IBM Plex Sans, sans-serif">Note: a rejection returns success, not an error &#8212; a slow old workflow is allowed to give up</text>
  <text x="46" y="356" fill="#c7c4ae" font-size="11.5" font-family="IBM Plex Sans, sans-serif">quietly. Every deploy and fix-redeploy bumps the generation counter before dispatch.</text>
</svg>
