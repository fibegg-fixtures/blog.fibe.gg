<svg viewBox="0 0 740 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Marquee unavailable quiesces chats and keeps volumes; Marquee destroyed removes playgrounds">
  <defs>
    <marker id="dd-green" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#79d44e"/>
    </marker>
    <marker id="dd-ember" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#f08760"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="740" height="400" fill="#20251a"/>

  <!-- LEFT: unavailable -->
  <rect x="20" y="20" width="340" height="360" rx="8" fill="#252a1e" stroke="#434a35"/>
  <text x="190" y="50" text-anchor="middle" fill="#92df62" font-size="15" font-weight="700" font-family="IBM Plex Sans, sans-serif">Marquee becomes UNAVAILABLE</text>
  <text x="190" y="70" text-anchor="middle" fill="#a19f89" font-size="11" font-family="JetBrains Mono, monospace">disable / non-operational update</text>

  <rect x="60" y="92" width="260" height="44" rx="6" fill="#20251a" stroke="#545c42"/>
  <text x="190" y="120" text-anchor="middle" fill="#f3f0e0" font-size="12" font-family="IBM Plex Sans, sans-serif">quiesce live chats before the save</text>

  <line x1="190" y1="136" x2="190" y2="168" stroke="#79d44e" stroke-width="2" marker-end="url(#dd-green)"/>

  <rect x="60" y="172" width="260" height="44" rx="6" fill="#20251a" stroke="#79d44e"/>
  <text x="190" y="192" text-anchor="middle" fill="#92df62" font-size="12" font-weight="700" font-family="IBM Plex Sans, sans-serif">chat moves to stopped</text>
  <text x="190" y="208" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">record kept &#183; remote down (no -v)</text>

  <line x1="190" y1="216" x2="190" y2="248" stroke="#79d44e" stroke-width="2" marker-end="url(#dd-green)"/>

  <rect x="60" y="252" width="260" height="54" rx="6" fill="#20251a" stroke="#56d8c0"/>
  <text x="190" y="276" text-anchor="middle" fill="#56d8c0" font-size="12" font-weight="700" font-family="IBM Plex Sans, sans-serif">volume preserved</text>
  <text x="190" y="294" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">the chat's data volume survives</text>

  <text x="190" y="340" text-anchor="middle" fill="#abe87f" font-size="12" font-weight="700" font-family="IBM Plex Sans, sans-serif">reactivation = same project, same volume</text>
  <text x="190" y="360" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">your work is exactly where you left it</text>

  <!-- RIGHT: destroy -->
  <rect x="380" y="20" width="340" height="360" rx="8" fill="#252a1e" stroke="#434a35"/>
  <text x="550" y="50" text-anchor="middle" fill="#f08760" font-size="15" font-weight="700" font-family="IBM Plex Sans, sans-serif">Marquee gets DESTROYED</text>
  <text x="550" y="70" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">the host record is deleted</text>

  <rect x="420" y="92" width="260" height="44" rx="6" fill="#20251a" stroke="#f08760"/>
  <text x="550" y="112" text-anchor="middle" fill="#f08760" font-size="12" font-weight="700" font-family="IBM Plex Sans, sans-serif">Playgrounds block the delete</text>
  <text x="550" y="128" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">blocks while any Playground exists</text>

  <line x1="550" y1="136" x2="550" y2="168" stroke="#f08760" stroke-width="2" marker-end="url(#dd-ember)"/>

  <rect x="420" y="172" width="260" height="44" rx="6" fill="#20251a" stroke="#545c42"/>
  <text x="550" y="192" text-anchor="middle" fill="#f3f0e0" font-size="12" font-family="IBM Plex Sans, sans-serif">destroy Playgrounds first</text>
  <text x="550" y="208" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">containers + volumes removed</text>

  <line x1="550" y1="216" x2="550" y2="248" stroke="#f08760" stroke-width="2" marker-end="url(#dd-ember)"/>

  <rect x="420" y="252" width="260" height="54" rx="6" fill="#20251a" stroke="#79d44e"/>
  <text x="550" y="276" text-anchor="middle" fill="#92df62" font-size="12" font-weight="700" font-family="IBM Plex Sans, sans-serif">quiesce first</text>
  <text x="550" y="294" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">then AgentChat rows cascade away</text>

  <text x="550" y="340" text-anchor="middle" fill="#f5da79" font-size="12" font-weight="700" font-family="IBM Plex Sans, sans-serif">no remote teardown on cascade</text>
  <text x="550" y="360" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">orphan volume swept by the reaper</text>
</svg>
