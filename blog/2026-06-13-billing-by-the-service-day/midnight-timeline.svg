<svg viewBox="0 0 720 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The daily funding transaction: once per service-day a small charge is taken from the Wallet, extending the Marquee's paid-through time to the end of today and marking it funded and runnable">
  <defs>
    <marker id="dt-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#79d44e"/>
    </marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" fill="#f3f0e0" font-size="16" font-weight="700" font-family="IBM Plex Sans, sans-serif">One charge a day keeps the Marquee funded</text>
  <text x="360" y="48" text-anchor="middle" fill="#a19f89" font-size="12" font-family="IBM Plex Sans, sans-serif">Mana for tutorials &#183; Sparks otherwise</text>

  <!-- Wallet -->
  <rect x="36" y="92" width="170" height="118" rx="8" fill="#252a1e" stroke="#eec854" stroke-width="1.5"/>
  <text x="121" y="118" text-anchor="middle" fill="#f5da79" font-size="13" font-weight="700" font-family="IBM Plex Sans, sans-serif">Wallet</text>
  <line x1="56" y1="128" x2="186" y2="128" stroke="#434a35"/>
  <text x="56" y="152" fill="#56d8c0" font-size="12" font-family="IBM Plex Sans, sans-serif">Mana</text>
  <text x="186" y="152" text-anchor="end" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">tutorial</text>
  <text x="56" y="176" fill="#92df62" font-size="12" font-family="IBM Plex Sans, sans-serif">Sparks</text>
  <text x="186" y="176" text-anchor="end" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">otherwise</text>
  <text x="121" y="198" text-anchor="middle" fill="#a19f89" font-size="10" font-family="IBM Plex Sans, sans-serif">balance the player holds</text>

  <!-- charge arrow -->
  <line x1="206" y1="151" x2="278" y2="151" stroke="#79d44e" stroke-width="2" marker-end="url(#dt-arrow)"/>
  <text x="242" y="142" text-anchor="middle" fill="#92df62" font-size="11" font-family="IBM Plex Sans, sans-serif">day&#8217;s charge</text>
  <text x="242" y="176" text-anchor="middle" fill="#a19f89" font-size="10" font-family="IBM Plex Sans, sans-serif">once per day</text>

  <!-- timeline of paid-through -->
  <text x="296" y="86" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">paid-through time extends to the end of today</text>
  <rect x="296" y="96" width="388" height="40" rx="5" fill="#20251a" stroke="#5cb43a"/>
  <text x="490" y="121" text-anchor="middle" fill="#92df62" font-size="12" font-weight="700" font-family="IBM Plex Sans, sans-serif">today &#183; funded</text>
  <line x1="676" y1="92" x2="676" y2="148" stroke="#eec854" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="676" y="160" text-anchor="end" fill="#f5da79" font-size="10" font-family="IBM Plex Sans, sans-serif">end of today</text>

  <!-- funded => runnable -->
  <rect x="296" y="182" width="184" height="44" rx="6" fill="#20251a" stroke="#5cb43a"/>
  <text x="388" y="202" text-anchor="middle" fill="#92df62" font-size="12" font-weight="700" font-family="IBM Plex Sans, sans-serif">funded = runnable</text>
  <text x="388" y="218" text-anchor="middle" fill="#a19f89" font-size="10" font-family="IBM Plex Sans, sans-serif">Playgrounds, Tricks, AgentChat</text>

  <rect x="500" y="182" width="184" height="44" rx="6" fill="#20251a" stroke="#f08760"/>
  <text x="592" y="202" text-anchor="middle" fill="#f08760" font-size="12" font-weight="700" font-family="IBM Plex Sans, sans-serif">not funded = 402</text>
  <text x="592" y="218" text-anchor="middle" fill="#a19f89" font-size="10" font-family="IBM Plex Sans, sans-serif">new runtime work is stopped</text>

  <!-- footer -->
  <rect x="120" y="262" width="480" height="40" rx="6" fill="#252a1e" stroke="#545c42"/>
  <text x="360" y="280" text-anchor="middle" fill="#f3f0e0" font-size="12" font-family="IBM Plex Sans, sans-serif">A Marquee is either funded for today &#8230;</text>
  <text x="360" y="296" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">&#8230; or it isn&#8217;t. No proration, no partial days.</text>
</svg>
