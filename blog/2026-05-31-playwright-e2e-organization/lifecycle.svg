<svg viewBox="0 0 740 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="End-to-end test lifecycle: authenticate, create playspec, launch playground, poll status, assert reachability, teardown">
  <defs>
    <marker id="lc-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#79d44e"/>
    </marker>
    <marker id="lc-arrow-gold" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#eec854"/>
    </marker>
  </defs>

  <text x="370" y="26" text-anchor="middle" fill="#f3f0e0" font-size="16" font-weight="700" font-family="IBM Plex Sans, sans-serif">One test, one real environment, start to finish</text>

  <!-- Step 1 -->
  <rect x="24" y="56" width="148" height="74" rx="6" fill="#20251a" stroke="#434a35"/>
  <text x="98" y="80" text-anchor="middle" fill="#92df62" font-size="12" font-weight="700" font-family="JetBrains Mono, monospace">1 &#183; AUTHENTICATE</text>
  <text x="98" y="100" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">backdoor mints Player</text>
  <text x="98" y="116" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">session cached per worker</text>

  <!-- Step 2 -->
  <rect x="296" y="56" width="148" height="74" rx="6" fill="#20251a" stroke="#434a35"/>
  <text x="370" y="80" text-anchor="middle" fill="#92df62" font-size="12" font-weight="700" font-family="JetBrains Mono, monospace">2 &#183; CREATE SPEC</text>
  <text x="370" y="100" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">create a Playspec</text>
  <text x="370" y="116" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">tracked for cleanup</text>

  <!-- Step 3 -->
  <rect x="568" y="56" width="148" height="74" rx="6" fill="#20251a" stroke="#434a35"/>
  <text x="642" y="80" text-anchor="middle" fill="#92df62" font-size="12" font-weight="700" font-family="JetBrains Mono, monospace">3 &#183; LAUNCH</text>
  <text x="642" y="100" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">202 Accepted</text>
  <text x="642" y="116" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">async, not done yet</text>

  <line x1="172" y1="93" x2="290" y2="93" stroke="#79d44e" stroke-width="2" marker-end="url(#lc-arrow)"/>
  <line x1="444" y1="93" x2="562" y2="93" stroke="#79d44e" stroke-width="2" marker-end="url(#lc-arrow)"/>

  <!-- down arrow to poll -->
  <line x1="642" y1="130" x2="642" y2="168" stroke="#eec854" stroke-width="2" marker-end="url(#lc-arrow-gold)"/>

  <!-- Step 4 poll loop -->
  <rect x="540" y="174" width="176" height="92" rx="6" fill="#252a1e" stroke="#99761f"/>
  <text x="628" y="198" text-anchor="middle" fill="#f5da79" font-size="12" font-weight="700" font-family="JetBrains Mono, monospace">4 &#183; POLL STATUS</text>
  <text x="628" y="218" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">queued &#8594; running</text>
  <text x="628" y="234" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">backoff, hard deadline</text>
  <text x="628" y="252" text-anchor="middle" fill="#f08760" font-size="11" font-family="IBM Plex Sans, sans-serif">error &#8594; fail fast</text>

  <line x1="540" y1="220" x2="452" y2="220" stroke="#79d44e" stroke-width="2" marker-end="url(#lc-arrow)"/>

  <!-- Step 5 assert -->
  <rect x="284" y="174" width="168" height="92" rx="6" fill="#20251a" stroke="#545c42"/>
  <text x="368" y="198" text-anchor="middle" fill="#92df62" font-size="12" font-weight="700" font-family="JetBrains Mono, monospace">5 &#183; ASSERT</text>
  <text x="368" y="218" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">status badge = running</text>
  <text x="368" y="234" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">service answers over</text>
  <text x="368" y="250" text-anchor="middle" fill="#56d8c0" font-size="11" font-family="IBM Plex Sans, sans-serif">the Marquee gateway</text>

  <line x1="284" y1="220" x2="196" y2="220" stroke="#79d44e" stroke-width="2" marker-end="url(#lc-arrow)"/>

  <!-- Step 6 teardown -->
  <rect x="24" y="174" width="168" height="92" rx="6" fill="#252a1e" stroke="#545c42"/>
  <text x="108" y="198" text-anchor="middle" fill="#f08760" font-size="12" font-weight="700" font-family="JetBrains Mono, monospace">6 &#183; TEARDOWN</text>
  <text x="108" y="218" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">DELETE in reverse</text>
  <text x="108" y="234" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">runs even on failure</text>
  <text x="108" y="250" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">lane sweep is backstop</text>

  <!-- footer band -->
  <rect x="24" y="296" width="692" height="44" rx="6" fill="#20251a" stroke="#434a35"/>
  <text x="40" y="316" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">Steps 3&#8594;5 are the whole game: the product creates a REAL container on a remote Docker host, so the test must</text>
  <text x="40" y="332" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">wait on the same status signals the UI waits on &#8212; never a fixed sleep. Step 6 always runs, pass or fail.</text>
</svg>
