<svg viewBox="0 0 720 104" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="At a glance: a bring-your-own Marquee is not Terraform-managed, has three required host fields, zero Terraform workflows, and the same one 402 funding gate as every Marquee">
  <rect x="0" y="10" width="168" height="84" rx="6" fill="#20251a" stroke="#434a35"/>
  <text x="84" y="50" text-anchor="middle" fill="#56d8c0" font-size="22" font-weight="700" font-family="IBM Plex Sans, sans-serif">not managed</text>
  <text x="84" y="74" text-anchor="middle" fill="#a19f89" font-size="11.5" font-family="IBM Plex Sans, sans-serif">by Terraform</text>

  <rect x="184" y="10" width="168" height="84" rx="6" fill="#20251a" stroke="#434a35"/>
  <text x="268" y="50" text-anchor="middle" fill="#92df62" font-size="30" font-weight="700" font-family="JetBrains Mono, monospace">3</text>
  <text x="268" y="74" text-anchor="middle" fill="#a19f89" font-size="11.5" font-family="IBM Plex Sans, sans-serif">required host fields</text>

  <rect x="368" y="10" width="168" height="84" rx="6" fill="#20251a" stroke="#434a35"/>
  <text x="452" y="50" text-anchor="middle" fill="#92df62" font-size="30" font-weight="700" font-family="JetBrains Mono, monospace">0</text>
  <text x="452" y="74" text-anchor="middle" fill="#a19f89" font-size="11.5" font-family="IBM Plex Sans, sans-serif">Terraform workflows</text>

  <rect x="552" y="10" width="168" height="84" rx="6" fill="#20251a" stroke="#434a35"/>
  <text x="636" y="50" text-anchor="middle" fill="#eec854" font-size="30" font-weight="700" font-family="JetBrains Mono, monospace">1</text>
  <text x="636" y="74" text-anchor="middle" fill="#a19f89" font-size="11.5" font-family="IBM Plex Sans, sans-serif">funding gate (402)</text>
</svg>
