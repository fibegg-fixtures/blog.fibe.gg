<svg viewBox="0 0 740 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three authentication modes resolve into one credential environment: OAuth, a provider API key, and Mana">
  <defs>
    <marker id="am-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#757d5e"/>
    </marker>
  </defs>

  <text x="370" y="26" text-anchor="middle" fill="#f3f0e0" font-size="16" font-weight="700" font-family="IBM Plex Sans, sans-serif">Three auth modes, one resolved credential env</text>
  <text x="370" y="46" text-anchor="middle" fill="#a19f89" font-size="11.5" font-family="JetBrains Mono, monospace">OAuth &#183; provider API key &#183; Mana</text>

  <!-- oauth -->
  <rect x="20" y="64" width="222" height="150" rx="8" fill="#20251a" stroke="#5cb43a" stroke-width="1.5"/>
  <text x="131" y="88" text-anchor="middle" fill="#92df62" font-size="13" font-weight="700" font-family="JetBrains Mono, monospace">OAuth</text>
  <text x="131" y="110" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">interactive remote auth</text>
  <text x="131" y="128" text-anchor="middle" fill="#a19f89" font-size="10.5" font-family="JetBrains Mono, monospace">background auth job</text>
  <text x="131" y="144" text-anchor="middle" fill="#a19f89" font-size="10.5" font-family="JetBrains Mono, monospace">streamed over WebSocket</text>
  <text x="131" y="170" text-anchor="middle" fill="#c7c4ae" font-size="10.5" font-family="IBM Plex Sans, sans-serif">you log in once; the token</text>
  <text x="131" y="185" text-anchor="middle" fill="#c7c4ae" font-size="10.5" font-family="IBM Plex Sans, sans-serif">streams back, encrypted</text>
  <text x="131" y="204" text-anchor="middle" fill="#56d8c0" font-size="10" font-family="JetBrains Mono, monospace">e.g. Antigravity: browser off</text>

  <!-- provider-api-key -->
  <rect x="259" y="64" width="222" height="150" rx="8" fill="#20251a" stroke="#eec854" stroke-width="1.5"/>
  <text x="370" y="88" text-anchor="middle" fill="#f5da79" font-size="13" font-weight="700" font-family="JetBrains Mono, monospace">provider API key</text>
  <text x="370" y="110" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">bring your own key</text>
  <text x="370" y="128" text-anchor="middle" fill="#a19f89" font-size="10.5" font-family="IBM Plex Sans, sans-serif">read from stored</text>
  <text x="370" y="146" text-anchor="middle" fill="#a19f89" font-size="10.5" font-family="IBM Plex Sans, sans-serif">agent credentials</text>
  <text x="370" y="170" text-anchor="middle" fill="#c7c4ae" font-size="10.5" font-family="IBM Plex Sans, sans-serif">token can resolve from a</text>
  <text x="370" y="185" text-anchor="middle" fill="#c7c4ae" font-size="10.5" font-family="IBM Plex Sans, sans-serif">Secret Vault entry</text>
  <text x="370" y="204" text-anchor="middle" fill="#56d8c0" font-size="10" font-family="IBM Plex Sans, sans-serif">runs against the native CLI</text>

  <!-- fibe-mana -->
  <rect x="498" y="64" width="222" height="150" rx="8" fill="#20251a" stroke="#eec854" stroke-width="1.5"/>
  <text x="609" y="88" text-anchor="middle" fill="#f5da79" font-size="13" font-weight="700" font-family="JetBrains Mono, monospace">Mana</text>
  <text x="609" y="110" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">pay from your Wallet</text>
  <text x="609" y="128" text-anchor="middle" fill="#a19f89" font-size="10.5" font-family="IBM Plex Sans, sans-serif">platform gateway,</text>
  <text x="609" y="146" text-anchor="middle" fill="#a19f89" font-size="10.5" font-family="IBM Plex Sans, sans-serif">seeded from your API key</text>
  <text x="609" y="170" text-anchor="middle" fill="#c7c4ae" font-size="10.5" font-family="IBM Plex Sans, sans-serif">e.g. Claude Code &#8594;</text>
  <text x="609" y="185" text-anchor="middle" fill="#c7c4ae" font-size="10.5" font-family="JetBrains Mono, monospace">ANTHROPIC_BASE_URL swap</text>
  <text x="609" y="204" text-anchor="middle" fill="#f08760" font-size="10" font-family="IBM Plex Sans, sans-serif">excluded: Cursor, Antigravity</text>

  <!-- arrows to resolver -->
  <g stroke="#757d5e" stroke-width="1.5">
    <line x1="131" y1="214" x2="320" y2="262" marker-end="url(#am-arrow)"/>
    <line x1="370" y1="214" x2="370" y2="262" marker-end="url(#am-arrow)"/>
    <line x1="609" y1="214" x2="420" y2="262" marker-end="url(#am-arrow)"/>
  </g>

  <!-- resolver -->
  <rect x="200" y="266" width="340" height="46" rx="8" fill="#252a1e" stroke="#56d8c0" stroke-width="2"/>
  <text x="370" y="285" text-anchor="middle" fill="#56d8c0" font-size="12.5" font-weight="700" font-family="IBM Plex Sans, sans-serif">one credential resolver</text>
  <text x="370" y="302" text-anchor="middle" fill="#c7c4ae" font-size="10.5" font-family="IBM Plex Sans, sans-serif">builds the env the native CLI expects</text>

  <line x1="370" y1="312" x2="370" y2="332" stroke="#757d5e" stroke-width="1.5" marker-end="url(#am-arrow)"/>
  <text x="370" y="350" text-anchor="middle" fill="#abe87f" font-size="12" font-family="IBM Plex Sans, sans-serif">generated config &#8594; credential env</text>
</svg>
