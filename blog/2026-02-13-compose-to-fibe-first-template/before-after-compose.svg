<svg viewBox="0 0 760 408" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Before and after: a raw docker-compose service with host ports becomes a Fibe service where fibe.gg/port and fibe.gg/subdomain replace the host bindings, container_name is dropped, and the named volume stays">
  <defs>
    <marker id="baArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#eec854"/>
    </marker>
  </defs>

  <text x="30" y="28" fill="#f3f0e0" font-size="16" font-weight="700" font-family="IBM Plex Sans, sans-serif">Before: plain docker-compose.yml</text>
  <text x="430" y="28" fill="#f3f0e0" font-size="16" font-weight="700" font-family="IBM Plex Sans, sans-serif">After: a Fibe template</text>

  <!-- before panel -->
  <rect x="30" y="44" width="316" height="332" rx="8" fill="#20251a" stroke="#545c42"/>
  <text x="48" y="76" fill="#c7c4ae" font-size="13" font-family="JetBrains Mono, monospace">services:</text>
  <text x="64" y="98" fill="#c7c4ae" font-size="13" font-family="JetBrains Mono, monospace">web:</text>
  <text x="80" y="120" fill="#c7c4ae" font-size="13" font-family="JetBrains Mono, monospace">image: nginx:alpine</text>
  <text x="80" y="142" fill="#f08760" font-size="13" font-family="JetBrains Mono, monospace">container_name: my-web</text>
  <text x="80" y="164" fill="#f08760" font-size="13" font-family="JetBrains Mono, monospace">ports: ["8080:80"]</text>
  <text x="80" y="186" fill="#c7c4ae" font-size="13" font-family="JetBrains Mono, monospace">volumes:</text>
  <text x="96" y="208" fill="#c7c4ae" font-size="12" font-family="JetBrains Mono, monospace">- site:/usr/share/nginx</text>
  <text x="64" y="240" fill="#c7c4ae" font-size="13" font-family="JetBrains Mono, monospace">db:</text>
  <text x="80" y="262" fill="#c7c4ae" font-size="13" font-family="JetBrains Mono, monospace">image: postgres:17</text>
  <text x="80" y="284" fill="#f08760" font-size="13" font-family="JetBrains Mono, monospace">ports: ["5432:5432"]</text>
  <text x="48" y="334" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">host ports decide who is reachable;</text>
  <text x="48" y="352" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">db is needlessly exposed on 5432</text>

  <!-- arrow -->
  <line x1="350" y1="210" x2="424" y2="210" stroke="#eec854" stroke-width="2.5" marker-end="url(#baArrow)"/>
  <text x="387" y="200" text-anchor="middle" fill="#eec854" font-size="11" font-family="IBM Plex Sans, sans-serif">add labels</text>

  <!-- after panel -->
  <rect x="430" y="44" width="300" height="332" rx="8" fill="#252a1e" stroke="#79d44e"/>
  <text x="448" y="76" fill="#c7c4ae" font-size="13" font-family="JetBrains Mono, monospace">services:</text>
  <text x="464" y="98" fill="#c7c4ae" font-size="13" font-family="JetBrains Mono, monospace">web:</text>
  <text x="480" y="120" fill="#c7c4ae" font-size="13" font-family="JetBrains Mono, monospace">image: nginx:alpine</text>
  <text x="480" y="142" fill="#c7c4ae" font-size="13" font-family="JetBrains Mono, monospace">labels:</text>
  <text x="496" y="164" fill="#92df62" font-size="12" font-family="JetBrains Mono, monospace">fibe.gg/port: 80</text>
  <text x="496" y="186" fill="#92df62" font-size="12" font-family="JetBrains Mono, monospace">fibe.gg/subdomain: site</text>
  <text x="480" y="208" fill="#c7c4ae" font-size="13" font-family="JetBrains Mono, monospace">volumes:</text>
  <text x="496" y="230" fill="#c7c4ae" font-size="12" font-family="JetBrains Mono, monospace">- site:/usr/share/nginx</text>
  <text x="464" y="262" fill="#c7c4ae" font-size="13" font-family="JetBrains Mono, monospace">db:</text>
  <text x="480" y="284" fill="#c7c4ae" font-size="13" font-family="JetBrains Mono, monospace">image: postgres:17</text>
  <text x="480" y="306" fill="#56d8c0" font-size="12" font-family="JetBrains Mono, monospace"># no port, no label</text>
  <text x="448" y="340" fill="#abe87f" font-size="11" font-family="IBM Plex Sans, sans-serif">web gets an HTTPS URL; db stays</text>
  <text x="448" y="358" fill="#abe87f" font-size="11" font-family="IBM Plex Sans, sans-serif">private on the internal network</text>
</svg>
