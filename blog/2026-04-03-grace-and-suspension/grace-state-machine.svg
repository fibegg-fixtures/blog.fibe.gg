<svg viewBox="0 0 760 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The grace incident state machine: active transitions to repaid, suspended, or forgiven; suspended transitions to repaid or destroy scheduled; destroy scheduled transitions to destroyed.">
  <defs>
    <marker id="gsm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-end">
      <path d="M0,0 L10,5 L0,10 z" fill="#757d5e"/>
    </marker>
    <marker id="gsm-arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-end">
      <path d="M0,0 L10,5 L0,10 z" fill="#5cb43a"/>
    </marker>
    <marker id="gsm-arrow-ember" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-end">
      <path d="M0,0 L10,5 L0,10 z" fill="#f08760"/>
    </marker>
  </defs>

  <text x="380" y="26" text-anchor="middle" fill="#f3f0e0" font-size="16" font-weight="700" font-family="IBM Plex Sans, sans-serif">Grace incident &#183; one per marquee per service-day</text>

  <!-- unfunded entry -->
  <rect x="40" y="56" width="150" height="46" rx="6" fill="#252a1e" stroke="#545c42"/>
  <text x="115" y="78" text-anchor="middle" fill="#c7c4ae" font-size="12" font-family="IBM Plex Sans, sans-serif">daily debit fails</text>
  <text x="115" y="93" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">open or suspend incident</text>

  <!-- active -->
  <rect x="305" y="52" width="150" height="54" rx="6" fill="#20251a" stroke="#eec854" stroke-width="2"/>
  <text x="380" y="76" text-anchor="middle" fill="#f5da79" font-size="14" font-weight="700" font-family="JetBrains Mono, monospace">active</text>
  <text x="380" y="94" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">disabled &#183; debt tracked &#183; email</text>

  <line x1="190" y1="79" x2="303" y2="79" stroke="#757d5e" stroke-width="1.6" marker-end="url(#gsm-arrow)"/>

  <!-- forgiven -->
  <rect x="580" y="52" width="150" height="54" rx="6" fill="#20251a" stroke="#56d8c0"/>
  <text x="655" y="76" text-anchor="middle" fill="#56d8c0" font-size="14" font-weight="700" font-family="JetBrains Mono, monospace">forgiven</text>
  <text x="655" y="94" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">admin &#183; no debt owed</text>
  <line x1="455" y1="72" x2="578" y2="72" stroke="#757d5e" stroke-width="1.4" marker-end="url(#gsm-arrow)"/>
  <text x="516" y="64" text-anchor="middle" fill="#a19f89" font-size="10" font-family="IBM Plex Sans, sans-serif">admin</text>

  <!-- repaid (from active) -->
  <rect x="305" y="200" width="150" height="54" rx="6" fill="#20251a" stroke="#5cb43a" stroke-width="2"/>
  <text x="380" y="224" text-anchor="middle" fill="#92df62" font-size="14" font-weight="700" font-family="JetBrains Mono, monospace">repaid</text>
  <text x="380" y="242" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">funded again next cycle</text>

  <line x1="362" y1="106" x2="362" y2="198" stroke="#5cb43a" stroke-width="1.6" marker-end="url(#gsm-arrow-green)"/>
  <text x="300" y="156" text-anchor="end" fill="#92df62" font-size="10" font-family="IBM Plex Sans, sans-serif">credit repays debt</text>

  <!-- suspended -->
  <rect x="40" y="200" width="190" height="54" rx="6" fill="#20251a" stroke="#f08760" stroke-width="2"/>
  <text x="135" y="224" text-anchor="middle" fill="#f08760" font-size="14" font-weight="700" font-family="JetBrains Mono, monospace">suspended</text>
  <text x="135" y="242" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">grace days elapsed / too many</text>

  <line x1="305" y1="92" x2="232" y2="200" stroke="#f08760" stroke-width="1.6" marker-end="url(#gsm-arrow-ember)"/>
  <text x="232" y="150" text-anchor="middle" fill="#f08760" font-size="10" font-family="IBM Plex Sans, sans-serif">grace window expired</text>

  <!-- suspended -> repaid -->
  <line x1="230" y1="222" x2="303" y2="222" stroke="#5cb43a" stroke-width="1.6" marker-end="url(#gsm-arrow-green)"/>
  <text x="267" y="214" text-anchor="middle" fill="#92df62" font-size="10" font-family="IBM Plex Sans, sans-serif">repay</text>

  <!-- destroy scheduled (tutorial only) -->
  <rect x="40" y="340" width="220" height="58" rx="6" fill="#20251a" stroke="#f08760" stroke-width="2"/>
  <text x="150" y="364" text-anchor="middle" fill="#f08760" font-size="13" font-weight="700" font-family="JetBrains Mono, monospace">destroy scheduled</text>
  <text x="150" y="382" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">tutorial only &#183; last chance to repay</text>

  <line x1="135" y1="254" x2="135" y2="338" stroke="#f08760" stroke-width="1.6" marker-end="url(#gsm-arrow-ember)"/>
  <text x="128" y="300" text-anchor="end" fill="#f08760" font-size="10" font-family="IBM Plex Sans, sans-serif">retention elapsed</text>
  <text x="128" y="314" text-anchor="end" fill="#a19f89" font-size="10" font-family="IBM Plex Sans, sans-serif">&amp; still unpaid</text>

  <!-- destroy scheduled -> repaid -->
  <line x1="260" y1="362" x2="362" y2="256" stroke="#5cb43a" stroke-width="1.4" marker-end="url(#gsm-arrow-green)"/>
  <text x="332" y="320" text-anchor="middle" fill="#92df62" font-size="10" font-family="IBM Plex Sans, sans-serif">repay</text>

  <!-- destroyed -->
  <rect x="430" y="340" width="200" height="58" rx="6" fill="#252a1e" stroke="#757d5e"/>
  <text x="530" y="364" text-anchor="middle" fill="#c7c4ae" font-size="13" font-weight="700" font-family="JetBrains Mono, monospace">destroyed</text>
  <text x="530" y="382" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">Terraform destroy completes</text>

  <line x1="260" y1="369" x2="428" y2="369" stroke="#757d5e" stroke-width="1.6" marker-end="url(#gsm-arrow)"/>
  <text x="344" y="361" text-anchor="middle" fill="#a19f89" font-size="10" font-family="IBM Plex Sans, sans-serif">infra destroy</text>

  <text x="380" y="440" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">Standard (non-tutorial) marquees stop at suspended &#8594; they simply stay unfunded, never auto-destroyed.</text>
  <text x="380" y="458" text-anchor="middle" fill="#757d5e" font-size="10" font-family="JetBrains Mono, monospace">green = recovery &#183; gold = open incident &#183; ember = escalation</text>
</svg>
