<svg viewBox="0 0 720 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Expiry decision: eligible expired playgrounds are checked for dirty state; clean ones are destroyed, dirty ones are parked in the has-changes state and preserved">
  <defs>
    <marker id="exparrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#757d5e"/>
    </marker>
    <marker id="exparrowgreen" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#5cb43a"/>
    </marker>
    <marker id="exparrowember" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#f08760"/>
    </marker>
  </defs>

  <!-- entry -->
  <rect x="248" y="16" width="224" height="56" rx="6" fill="#252a1e" stroke="#545c42"/>
  <text x="360" y="40" text-anchor="middle" fill="#f3f0e0" font-size="13" font-weight="600" font-family="IBM Plex Sans, sans-serif">expiry sweep</text>
  <text x="360" y="59" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">past its expiry time</text>

  <!-- eligible filter -->
  <rect x="208" y="104" width="304" height="58" rx="6" fill="#20251a" stroke="#434a35"/>
  <text x="360" y="128" text-anchor="middle" fill="#c7c4ae" font-size="12" font-family="IBM Plex Sans, sans-serif">eligible status?</text>
  <text x="360" y="148" text-anchor="middle" fill="#abe87f" font-size="11" font-family="IBM Plex Sans, sans-serif">running &#183; has changes &#183; completed</text>
  <line x1="360" y1="72" x2="360" y2="102" stroke="#757d5e" stroke-width="1.5" marker-end="url(#exparrow)"/>

  <!-- dirty probe -->
  <polygon points="360,196 470,250 360,304 250,250" fill="#252a1e" stroke="#eec854" stroke-width="1.5"/>
  <text x="360" y="244" text-anchor="middle" fill="#f5da79" font-size="12.5" font-weight="600" font-family="IBM Plex Sans, sans-serif">any service</text>
  <text x="360" y="262" text-anchor="middle" fill="#f5da79" font-size="12.5" font-weight="600" font-family="IBM Plex Sans, sans-serif">dirty?</text>
  <line x1="360" y1="162" x2="360" y2="194" stroke="#757d5e" stroke-width="1.5" marker-end="url(#exparrow)"/>
  <text x="384" y="184" text-anchor="start" fill="#a19f89" font-size="10" font-family="IBM Plex Sans, sans-serif">re-sync git status, live</text>

  <!-- CLEAN path (right) -->
  <line x1="470" y1="250" x2="566" y2="250" stroke="#5cb43a" stroke-width="1.5" marker-end="url(#exparrowgreen)"/>
  <text x="516" y="240" text-anchor="middle" fill="#92df62" font-size="11" font-weight="600" font-family="JetBrains Mono, monospace">NO</text>
  <rect x="566" y="206" width="146" height="88" rx="6" fill="#20251a" stroke="#5cb43a"/>
  <text x="639" y="232" text-anchor="middle" fill="#92df62" font-size="12.5" font-weight="600" font-family="IBM Plex Sans, sans-serif">destroy</text>
  <text x="639" y="252" text-anchor="middle" fill="#c7c4ae" font-size="10.5" font-family="IBM Plex Sans, sans-serif">tear the environment down</text>
  <text x="639" y="268" text-anchor="middle" fill="#a19f89" font-size="10" font-family="IBM Plex Sans, sans-serif">volumes gone unless</text>
  <text x="639" y="282" text-anchor="middle" fill="#a19f89" font-size="10" font-family="IBM Plex Sans, sans-serif">they're persistent</text>
  <line x1="639" y1="294" x2="639" y2="340" stroke="#5cb43a" stroke-width="1.5" marker-end="url(#exparrowgreen)"/>
  <rect x="566" y="344" width="146" height="46" rx="6" fill="#252a1e" stroke="#434a35"/>
  <text x="639" y="365" text-anchor="middle" fill="#f3f0e0" font-size="12" font-weight="600" font-family="IBM Plex Sans, sans-serif">record deleted</text>
  <text x="639" y="381" text-anchor="middle" fill="#a19f89" font-size="10" font-family="IBM Plex Sans, sans-serif">gone for good</text>

  <!-- DIRTY path (left) -->
  <line x1="250" y1="250" x2="154" y2="250" stroke="#f08760" stroke-width="1.5" marker-end="url(#exparrowember)"/>
  <text x="204" y="240" text-anchor="middle" fill="#f08760" font-size="11" font-weight="600" font-family="JetBrains Mono, monospace">YES</text>
  <rect x="8" y="206" width="146" height="88" rx="6" fill="#20251a" stroke="#f08760"/>
  <text x="81" y="232" text-anchor="middle" fill="#f08760" font-size="12.5" font-weight="600" font-family="IBM Plex Sans, sans-serif">park, don't kill</text>
  <text x="81" y="252" text-anchor="middle" fill="#c7c4ae" font-size="10.5" font-family="IBM Plex Sans, sans-serif">move to has-changes</text>
  <text x="81" y="268" text-anchor="middle" fill="#a19f89" font-size="10" font-family="IBM Plex Sans, sans-serif">audit:</text>
  <text x="81" y="282" text-anchor="middle" fill="#a19f89" font-size="9.5" font-family="IBM Plex Sans, sans-serif">expiry skipped, dirty</text>
  <line x1="81" y1="294" x2="81" y2="340" stroke="#f08760" stroke-width="1.5" marker-end="url(#exparrowember)"/>
  <rect x="8" y="344" width="146" height="46" rx="6" fill="#252a1e" stroke="#545c42"/>
  <text x="81" y="365" text-anchor="middle" fill="#f3f0e0" font-size="12" font-weight="600" font-family="IBM Plex Sans, sans-serif">kept &amp; re-extendable</text>
  <text x="81" y="381" text-anchor="middle" fill="#a19f89" font-size="10" font-family="IBM Plex Sans, sans-serif">work survives</text>

  <text x="360" y="424" text-anchor="middle" fill="#a19f89" font-size="11" font-style="italic" font-family="IBM Plex Sans, sans-serif">Ephemeral by default. Sacred when there's unsaved work.</text>
</svg>
