<svg viewBox="0 0 760 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The onboarding wizard step flow: welcome to marquee to props to playground to launch, ending in a running agent">
  <defs>
    <marker id="wflow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#757d5e"/>
    </marker>
  </defs>

  <text x="380" y="26" text-anchor="middle" fill="#f3f0e0" font-size="16" font-weight="700" font-family="IBM Plex Sans, sans-serif">14 steps, one continuous trail</text>
  <text x="380" y="46" text-anchor="middle" fill="#a19f89" font-size="12" font-family="IBM Plex Sans, sans-serif">teach the nouns by walking past them &#183; the last three steps actually build something</text>

  <!-- progress track -->
  <rect x="60" y="92" width="640" height="6" rx="3" fill="#252a1e" stroke="#434a35"/>
  <rect x="60" y="92" width="430" height="6" rx="3" fill="#5cb43a"/>

  <!-- dots -->
  <!-- completed -->
  <circle cx="60"  cy="95" r="13" fill="#20251a" stroke="#79d44e" stroke-width="2"/>
  <text x="60" y="100" text-anchor="middle" fill="#92df62" font-size="12" font-family="JetBrains Mono, monospace">1</text>
  <circle cx="167" cy="95" r="13" fill="#20251a" stroke="#79d44e" stroke-width="2"/>
  <text x="167" y="100" text-anchor="middle" fill="#92df62" font-size="12" font-family="JetBrains Mono, monospace">2</text>
  <circle cx="274" cy="95" r="13" fill="#20251a" stroke="#79d44e" stroke-width="2"/>
  <text x="274" y="100" text-anchor="middle" fill="#92df62" font-size="12" font-family="JetBrains Mono, monospace">3</text>
  <circle cx="381" cy="95" r="13" fill="#20251a" stroke="#79d44e" stroke-width="2"/>
  <text x="381" y="100" text-anchor="middle" fill="#92df62" font-size="12" font-family="JetBrains Mono, monospace">5</text>
  <!-- active -->
  <circle cx="490" cy="95" r="15" fill="#20251a" stroke="#eec854" stroke-width="3"/>
  <text x="490" y="100" text-anchor="middle" fill="#f5da79" font-size="12" font-weight="700" font-family="JetBrains Mono, monospace">8</text>
  <!-- pending -->
  <circle cx="597" cy="95" r="13" fill="#20251a" stroke="#545c42" stroke-width="2"/>
  <text x="597" y="100" text-anchor="middle" fill="#a19f89" font-size="12" font-family="JetBrains Mono, monospace">13</text>
  <circle cx="700" cy="95" r="13" fill="#20251a" stroke="#545c42" stroke-width="2"/>
  <text x="700" y="100" text-anchor="middle" fill="#a19f89" font-size="12" font-family="JetBrains Mono, monospace">14</text>

  <!-- labels -->
  <text x="60"  y="138" text-anchor="middle" fill="#c7c4ae" font-size="12" font-family="IBM Plex Sans, sans-serif">Welcome</text>
  <text x="167" y="138" text-anchor="middle" fill="#c7c4ae" font-size="12" font-family="IBM Plex Sans, sans-serif">Marquee</text>
  <text x="274" y="138" text-anchor="middle" fill="#c7c4ae" font-size="12" font-family="IBM Plex Sans, sans-serif">Props</text>
  <text x="381" y="138" text-anchor="middle" fill="#c7c4ae" font-size="12" font-family="IBM Plex Sans, sans-serif">Playground</text>
  <text x="490" y="138" text-anchor="middle" fill="#f5da79" font-size="12" font-weight="700" font-family="IBM Plex Sans, sans-serif">Bridge</text>
  <text x="597" y="138" text-anchor="middle" fill="#c7c4ae" font-size="12" font-family="IBM Plex Sans, sans-serif">Agent</text>
  <text x="700" y="138" text-anchor="middle" fill="#c7c4ae" font-size="12" font-family="IBM Plex Sans, sans-serif">Authenticate</text>

  <!-- phase bands -->
  <rect x="40" y="170" width="430" height="52" rx="6" fill="#20251a" stroke="#434a35"/>
  <text x="255" y="192" text-anchor="middle" fill="#92df62" font-size="12" font-weight="700" font-family="IBM Plex Sans, sans-serif">Steps 1&#8211;11 &#183; learn the map</text>
  <text x="255" y="211" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">each step names one concept and glows its sidebar home</text>

  <rect x="486" y="170" width="234" height="52" rx="6" fill="#20251a" stroke="#99761f"/>
  <text x="603" y="192" text-anchor="middle" fill="#f5da79" font-size="12" font-weight="700" font-family="IBM Plex Sans, sans-serif">Steps 12&#8211;14 &#183; do it for real</text>
  <text x="603" y="211" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">key &#8594; agent &#8594; authenticated genie</text>

  <line x1="470" y1="196" x2="484" y2="196" stroke="#757d5e" stroke-width="1.5" marker-end="url(#wflow-arrow)"/>
</svg>
