<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two routers match the same host; the priority one million maintenance router wins">
  <defs>
    <marker id="po-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#757d5e"/>
    </marker>
    <marker id="po-arrow-gold" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#e2b33a"/>
    </marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" fill="#f3f0e0" font-size="17" font-weight="700" font-family="IBM Plex Sans, sans-serif">Two routers, one host &#8212; highest priority wins</text>

  <!-- incoming request -->
  <rect x="40" y="58" width="200" height="56" rx="8" fill="#252a1e" stroke="#56d8c0"/>
  <text x="140" y="82" text-anchor="middle" fill="#56d8c0" font-size="12" font-family="JetBrains Mono, monospace">GET app.&lt;env&gt;.marquee.dev</text>
  <text x="140" y="100" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">request arrives at Traefik</text>

  <line x1="240" y1="86" x2="296" y2="86" stroke="#757d5e" stroke-width="1.6" marker-end="url(#po-arrow)"/>

  <!-- traefik matcher -->
  <rect x="298" y="58" width="124" height="56" rx="8" fill="#20251a" stroke="#545c42"/>
  <text x="360" y="83" text-anchor="middle" fill="#f3f0e0" font-size="13" font-weight="700" font-family="JetBrains Mono, monospace">Traefik</text>
  <text x="360" y="101" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">rule match &amp; sort</text>

  <!-- two candidate routers -->
  <line x1="360" y1="114" x2="360" y2="150" stroke="#757d5e" stroke-width="1.6"/>
  <line x1="200" y1="150" x2="520" y2="150" stroke="#757d5e" stroke-width="1.6"/>
  <line x1="200" y1="150" x2="200" y2="180" stroke="#757d5e" stroke-width="1.6" marker-end="url(#po-arrow)"/>
  <line x1="520" y1="150" x2="520" y2="180" stroke="#757d5e" stroke-width="1.6" marker-end="url(#po-arrow-gold)"/>

  <!-- runtime router (loses) -->
  <rect x="70" y="184" width="260" height="92" rx="8" fill="#20251a" stroke="#545c42"/>
  <text x="200" y="208" text-anchor="middle" fill="#c7c4ae" font-size="13" font-weight="700" font-family="JetBrains Mono, monospace">runtime router</text>
  <text x="200" y="230" text-anchor="middle" fill="#a19f89" font-size="11" font-family="JetBrains Mono, monospace">Host(`app.&lt;env&gt;...`)</text>
  <text x="200" y="250" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">service &#8594; app container</text>
  <text x="200" y="269" text-anchor="middle" fill="#757d5e" font-size="12" font-family="JetBrains Mono, monospace">priority: default</text>

  <!-- maintenance router (wins) -->
  <rect x="390" y="184" width="260" height="92" rx="8" fill="#20251a" stroke="#e2b33a" stroke-width="2"/>
  <text x="520" y="208" text-anchor="middle" fill="#eec854" font-size="13" font-weight="700" font-family="JetBrains Mono, monospace">maintenance router</text>
  <text x="520" y="230" text-anchor="middle" fill="#a19f89" font-size="11" font-family="JetBrains Mono, monospace">Host(`app.&lt;env&gt;...`)</text>
  <text x="520" y="250" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">service &#8594; maintenance page</text>
  <text x="520" y="269" text-anchor="middle" fill="#f5da79" font-size="12" font-weight="700" font-family="JetBrains Mono, monospace">priority: 1,000,000</text>

  <!-- loser dimmed cross -->
  <line x1="200" y1="282" x2="200" y2="318" stroke="#545c42" stroke-width="1.4" stroke-dasharray="4 4"/>
  <text x="200" y="336" text-anchor="middle" fill="#757d5e" font-size="11" font-family="IBM Plex Sans, sans-serif">never selected while maintenance is on</text>

  <!-- winner -->
  <line x1="520" y1="276" x2="520" y2="338" stroke="#e2b33a" stroke-width="2" marker-end="url(#po-arrow-gold)"/>
  <rect x="360" y="342" width="320" height="58" rx="8" fill="#252a1e" stroke="#e2b33a"/>
  <text x="520" y="366" text-anchor="middle" fill="#f5da79" font-size="13" font-weight="700" font-family="JetBrains Mono, monospace">HTTP/1.1 503 Service Unavailable</text>
  <text x="520" y="386" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">replacepath /maintenance &#8594; nginx return 503 &#183; Retry-After: 30</text>
</svg>
