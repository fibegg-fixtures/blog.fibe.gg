<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Turning at-least-once delivery into exactly-once effects with an idempotency key and a unique constraint">
  <defs>
    <marker id="ao1-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#757d5e"/>
    </marker>
    <marker id="ao1-arrow-green" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5cb43a"/>
    </marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" fill="#f3f0e0" font-size="16" font-weight="700" font-family="IBM Plex Sans, sans-serif">At-least-once delivery, exactly-once effect</text>

  <!-- callers -->
  <rect x="24" y="58" width="150" height="180" rx="6" fill="#20251a" stroke="#434a35"/>
  <text x="99" y="80" text-anchor="middle" fill="#c7c4ae" font-size="12" font-family="IBM Plex Sans, sans-serif">retries by default</text>

  <rect x="40" y="92" width="118" height="30" rx="4" fill="#252a1e" stroke="#545c42"/>
  <text x="99" y="111" text-anchor="middle" fill="#abe87f" font-size="11" font-family="JetBrains Mono, monospace">Sidekiq retry</text>

  <rect x="40" y="130" width="118" height="30" rx="4" fill="#252a1e" stroke="#545c42"/>
  <text x="99" y="149" text-anchor="middle" fill="#abe87f" font-size="11" font-family="JetBrains Mono, monospace">webhook redeliver</text>

  <rect x="40" y="168" width="118" height="30" rx="4" fill="#252a1e" stroke="#545c42"/>
  <text x="99" y="187" text-anchor="middle" fill="#abe87f" font-size="11" font-family="JetBrains Mono, monospace">network re-send</text>

  <text x="99" y="222" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">3 attempts, same key</text>

  <!-- arrows into key -->
  <line x1="174" y1="107" x2="300" y2="138" stroke="#757d5e" stroke-width="1.6" marker-end="url(#ao1-arrow)"/>
  <line x1="174" y1="145" x2="300" y2="148" stroke="#757d5e" stroke-width="1.6" marker-end="url(#ao1-arrow)"/>
  <line x1="174" y1="183" x2="300" y2="158" stroke="#757d5e" stroke-width="1.6" marker-end="url(#ao1-arrow)"/>

  <!-- idempotency key gate -->
  <rect x="304" y="108" width="160" height="80" rx="6" fill="#20251a" stroke="#eec854" stroke-width="1.6"/>
  <text x="384" y="134" text-anchor="middle" fill="#f5da79" font-size="12" font-weight="700" font-family="IBM Plex Sans, sans-serif">idempotency key</text>
  <text x="384" y="154" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="JetBrains Mono, monospace">look up the key</text>
  <text x="384" y="172" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="JetBrains Mono, monospace">+ UNIQUE index</text>

  <!-- single effect -->
  <line x1="464" y1="148" x2="556" y2="148" stroke="#5cb43a" stroke-width="2" marker-end="url(#ao1-arrow-green)"/>

  <rect x="560" y="112" width="136" height="72" rx="6" fill="#20251a" stroke="#5cb43a" stroke-width="1.6"/>
  <text x="628" y="140" text-anchor="middle" fill="#92df62" font-size="13" font-weight="700" font-family="IBM Plex Sans, sans-serif">ONE effect</text>
  <text x="628" y="162" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">1 debit, never 3</text>

  <!-- replay note -->
  <text x="384" y="226" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">duplicate key &#8594; return the existing record</text>

  <!-- bottom band -->
  <rect x="24" y="252" width="672" height="48" rx="6" fill="#252a1e" stroke="#434a35"/>
  <text x="360" y="273" text-anchor="middle" fill="#c7c4ae" font-size="12" font-family="IBM Plex Sans, sans-serif">The transport guarantees the message arrives at least once.</text>
  <text x="360" y="291" text-anchor="middle" fill="#56d8c0" font-size="12" font-weight="700" font-family="IBM Plex Sans, sans-serif">The key + the constraint guarantee the side effect happens exactly once.</text>
</svg>
