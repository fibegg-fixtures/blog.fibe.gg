<svg viewBox="0 0 720 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The /opt/fibe host filesystem layout on a Marquee">
  <rect x="0" y="0" width="720" height="470" fill="#20251a"/>
  <text x="24" y="34" fill="#f3f0e0" font-size="17" font-weight="700" font-family="IBM Plex Sans, sans-serif">The host filesystem on a Marquee</text>
  <text x="24" y="54" fill="#a19f89" font-size="12" font-family="IBM Plex Sans, sans-serif">Everything Fibe writes to a Docker host lives under one root.</text>

  <!-- root -->
  <rect x="24" y="72" width="200" height="34" rx="5" fill="#252a1e" stroke="#79d44e"/>
  <text x="40" y="94" fill="#92df62" font-size="14" font-weight="700" font-family="JetBrains Mono, monospace">/opt/fibe</text>

  <!-- spine -->
  <line x1="44" y1="106" x2="44" y2="438" stroke="#545c42" stroke-width="1.5"/>

  <!-- playgrounds -->
  <line x1="44" y1="132" x2="68" y2="132" stroke="#545c42" stroke-width="1.5"/>
  <rect x="68" y="116" width="230" height="32" rx="5" fill="#252a1e" stroke="#79d44e"/>
  <text x="82" y="137" fill="#abe87f" font-size="13" font-weight="700" font-family="JetBrains Mono, monospace">playgrounds/&lt;id&gt;/</text>

  <!-- playground children -->
  <line x1="100" y1="148" x2="100" y2="398" stroke="#434a35" stroke-width="1.2"/>

  <line x1="100" y1="170" x2="120" y2="170" stroke="#434a35" stroke-width="1.2"/>
  <text x="126" y="174" fill="#f3f0e0" font-size="12" font-family="JetBrains Mono, monospace">compose.yml</text>
  <text x="330" y="174" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">the generated stack definition</text>

  <line x1="100" y1="196" x2="120" y2="196" stroke="#434a35" stroke-width="1.2"/>
  <text x="126" y="200" fill="#f3f0e0" font-size="12" font-family="JetBrains Mono, monospace">.fibe/owner.json</text>
  <text x="330" y="200" fill="#eec854" font-size="11" font-family="IBM Plex Sans, sans-serif">ownership proof for safe cleanup</text>

  <line x1="100" y1="222" x2="120" y2="222" stroke="#434a35" stroke-width="1.2"/>
  <text x="126" y="226" fill="#f3f0e0" font-size="12" font-family="JetBrains Mono, monospace">docker-config/config.json</text>
  <text x="380" y="226" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">registry auth</text>

  <line x1="100" y1="248" x2="120" y2="248" stroke="#434a35" stroke-width="1.2"/>
  <text x="126" y="252" fill="#56d8c0" font-size="12" font-family="JetBrains Mono, monospace">props/&lt;slug&gt;/&lt;branch&gt;/</text>
  <text x="380" y="252" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">cloned source, bind-mounted</text>

  <line x1="100" y1="274" x2="120" y2="274" stroke="#434a35" stroke-width="1.2"/>
  <text x="126" y="278" fill="#f3f0e0" font-size="12" font-family="JetBrains Mono, monospace">compose-up.{started,exit,log,pid}</text>
  <text x="450" y="278" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">job-mode</text>

  <!-- builds -->
  <line x1="44" y1="312" x2="68" y2="312" stroke="#545c42" stroke-width="1.5"/>
  <rect x="68" y="296" width="190" height="32" rx="5" fill="#252a1e" stroke="#434a35"/>
  <text x="82" y="317" fill="#f3f0e0" font-size="13" font-family="JetBrains Mono, monospace">builds/remote_build.sh</text>

  <!-- agents -->
  <line x1="44" y1="350" x2="68" y2="350" stroke="#545c42" stroke-width="1.5"/>
  <rect x="68" y="334" width="210" height="32" rx="5" fill="#252a1e" stroke="#434a35"/>
  <text x="82" y="355" fill="#f3f0e0" font-size="13" font-family="JetBrains Mono, monospace">agents/&lt;id&gt;/</text>
  <text x="296" y="355" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">Genie mounted files</text>

  <!-- skills -->
  <line x1="44" y1="388" x2="68" y2="388" stroke="#545c42" stroke-width="1.5"/>
  <rect x="68" y="372" width="180" height="32" rx="5" fill="#252a1e" stroke="#434a35"/>
  <text x="82" y="393" fill="#f3f0e0" font-size="13" font-family="JetBrains Mono, monospace">skills/&lt;agent_id&gt;/</text>
  <text x="266" y="393" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">Genie skills (read-only)</text>

  <!-- marquees / playspecs -->
  <line x1="44" y1="426" x2="68" y2="426" stroke="#545c42" stroke-width="1.5"/>
  <rect x="68" y="410" width="320" height="32" rx="5" fill="#252a1e" stroke="#434a35"/>
  <text x="82" y="431" fill="#a19f89" font-size="13" font-family="JetBrains Mono, monospace">marquees/  ·  playspecs/  (host-scoped state)</text>
</svg>
