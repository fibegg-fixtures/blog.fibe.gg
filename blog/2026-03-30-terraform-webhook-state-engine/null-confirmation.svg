<svg viewBox="0 0 720 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two-confirmation null timeline on a provisioned marquee">
  <defs>
    <marker id="nc-arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#757d5e"/>
    </marker>
    <marker id="nc-arrow-ember" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#f08760"/>
    </marker>
  </defs>

  <text x="360" y="26" text-anchor="middle" fill="#f3f0e0" font-size="16" font-weight="700" font-family="IBM Plex Sans, sans-serif">Two-confirmation null &#183; on a provisioned marquee</text>

  <!-- timeline base -->
  <line x1="60" y1="150" x2="660" y2="150" stroke="#545c42" stroke-width="2"/>

  <!-- first null -->
  <circle cx="150" cy="150" r="9" fill="#eec854"/>
  <line x1="150" y1="150" x2="150" y2="86" stroke="#757d5e" stroke-width="1.4"/>
  <rect x="60" y="46" width="180" height="40" rx="6" fill="#252a1e" stroke="#eec854"/>
  <text x="150" y="64" text-anchor="middle" fill="#f5da79" font-size="12" font-weight="700" font-family="JetBrains Mono, monospace">1st null</text>
  <text x="150" y="79" text-anchor="middle" fill="#a19f89" font-size="10.5" font-family="IBM Plex Sans, sans-serif">cache flag, wait</text>

  <!-- 2h window -->
  <rect x="159" y="138" width="322" height="24" rx="4" fill="#20251a" stroke="#434a35"/>
  <text x="320" y="155" text-anchor="middle" fill="#c7c4ae" font-size="11.5" font-family="JetBrains Mono, monospace">2-hour confirmation window</text>

  <!-- branch A: deployed within window -->
  <circle cx="320" cy="150" r="7" fill="#56d8c0"/>
  <line x1="320" y1="150" x2="320" y2="210" stroke="#56d8c0" stroke-width="1.4" marker-end="url(#nc-arrow)"/>
  <rect x="226" y="210" width="190" height="46" rx="6" fill="#252a1e" stroke="#56d8c0"/>
  <text x="321" y="230" text-anchor="middle" fill="#56d8c0" font-size="12" font-weight="700" font-family="IBM Plex Sans, sans-serif">deployed arrives</text>
  <text x="321" y="247" text-anchor="middle" fill="#a19f89" font-size="10.5" font-family="IBM Plex Sans, sans-serif">flag cleared, stays healthy</text>

  <!-- second null -->
  <circle cx="490" cy="150" r="9" fill="#f08760"/>
  <line x1="490" y1="150" x2="490" y2="86" stroke="#f08760" stroke-width="1.4"/>
  <rect x="400" y="46" width="180" height="40" rx="6" fill="#252a1e" stroke="#f08760"/>
  <text x="490" y="64" text-anchor="middle" fill="#f08760" font-size="12" font-weight="700" font-family="JetBrains Mono, monospace">2nd null (confirmed)</text>
  <text x="490" y="79" text-anchor="middle" fill="#a19f89" font-size="10.5" font-family="IBM Plex Sans, sans-serif">flag still pending</text>

  <!-- branch B: failed -->
  <line x1="490" y1="150" x2="490" y2="210" stroke="#f08760" stroke-width="1.4" marker-end="url(#nc-arrow-ember)"/>
  <rect x="396" y="210" width="200" height="62" rx="6" fill="#252a1e" stroke="#f08760"/>
  <text x="496" y="230" text-anchor="middle" fill="#f08760" font-size="12" font-weight="700" font-family="IBM Plex Sans, sans-serif">failed &#183; serving: error</text>
  <text x="496" y="248" text-anchor="middle" fill="#a19f89" font-size="10.5" font-family="IBM Plex Sans, sans-serif">unless tutorial + live chats</text>
  <text x="496" y="264" text-anchor="middle" fill="#92df62" font-size="10.5" font-family="IBM Plex Sans, sans-serif">&#8594; preserve availability</text>

  <!-- footnote -->
  <rect x="60" y="290" width="600" height="30" rx="6" fill="#20251a" stroke="#434a35"/>
  <text x="76" y="309" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">A single null on a healthy marquee is treated as noise. Only a second null inside the window is destiny.</text>
</svg>
