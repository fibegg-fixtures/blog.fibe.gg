<svg viewBox="0 0 720 112" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="TTL defaults: 8 hours for Playgrounds, 1 hour for Tricks, swept every 60 seconds">
  <rect x="0" y="8" width="172" height="96" rx="6" fill="#20251a" stroke="#434a35"/>
  <text x="86" y="50" text-anchor="middle" fill="#92df62" font-size="34" font-weight="700" font-family="JetBrains Mono, monospace">8h</text>
  <text x="86" y="76" text-anchor="middle" fill="#c7c4ae" font-size="12" font-family="IBM Plex Sans, sans-serif">Playground TTL</text>
  <text x="86" y="93" text-anchor="middle" fill="#a19f89" font-size="10.5" font-family="IBM Plex Sans, sans-serif">default lifetime</text>

  <rect x="183" y="8" width="172" height="96" rx="6" fill="#20251a" stroke="#434a35"/>
  <text x="269" y="50" text-anchor="middle" fill="#eec854" font-size="34" font-weight="700" font-family="JetBrains Mono, monospace">1h</text>
  <text x="269" y="76" text-anchor="middle" fill="#c7c4ae" font-size="12" font-family="IBM Plex Sans, sans-serif">Trick (job-mode) TTL</text>
  <text x="269" y="93" text-anchor="middle" fill="#a19f89" font-size="10.5" font-family="IBM Plex Sans, sans-serif">configurable per deploy</text>

  <rect x="366" y="8" width="172" height="96" rx="6" fill="#20251a" stroke="#434a35"/>
  <text x="452" y="50" text-anchor="middle" fill="#56d8c0" font-size="34" font-weight="700" font-family="JetBrains Mono, monospace">60s</text>
  <text x="452" y="76" text-anchor="middle" fill="#c7c4ae" font-size="12" font-family="IBM Plex Sans, sans-serif">expiry sweep</text>
  <text x="452" y="93" text-anchor="middle" fill="#a19f89" font-size="10.5" font-family="IBM Plex Sans, sans-serif">every Playguard cycle</text>

  <rect x="549" y="8" width="171" height="96" rx="6" fill="#20251a" stroke="#434a35"/>
  <text x="634" y="50" text-anchor="middle" fill="#abe87f" font-size="34" font-weight="700" font-family="JetBrains Mono, monospace">0</text>
  <text x="634" y="76" text-anchor="middle" fill="#c7c4ae" font-size="12" font-family="IBM Plex Sans, sans-serif">dirty envs destroyed</text>
  <text x="634" y="93" text-anchor="middle" fill="#a19f89" font-size="10.5" font-family="IBM Plex Sans, sans-serif">on expiry, ever</text>
</svg>
