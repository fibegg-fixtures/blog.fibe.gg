<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Scrolls owns the private template library and publishing; the Bazaar is the public read view of versions flagged public; the Pantry is the onboarding entry point into the same collection.">
  <defs>
    <marker id="bps-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#79d44e"/>
    </marker>
    <marker id="bps-arrow-gold" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#eec854"/>
    </marker>
  </defs>

  <text x="360" y="26" text-anchor="middle" fill="#f3f0e0" font-size="16" font-weight="700" font-family="IBM Plex Sans, sans-serif">Three surfaces, one library of Templates</text>

  <!-- Scrolls (center, owner) -->
  <rect x="250" y="118" width="220" height="150" rx="10" fill="#252a1e" stroke="#92df62" stroke-width="2"/>
  <text x="360" y="146" text-anchor="middle" fill="#92df62" font-size="16" font-weight="700" font-family="IBM Plex Sans, sans-serif">Scrolls</text>
  <text x="360" y="166" text-anchor="middle" fill="#c7c4ae" font-size="11.5" font-family="JetBrains Mono, monospace">/scrolls</text>
  <text x="360" y="190" text-anchor="middle" fill="#c7c4ae" font-size="11.5" font-family="IBM Plex Sans, sans-serif">the library &#183; owns the routes</text>
  <text x="360" y="210" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">create &#183; edit &#183; fork</text>
  <text x="360" y="228" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">versions &#183; per-version</text>
  <text x="360" y="246" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">public toggle</text>

  <!-- Bazaar (left, public read view) -->
  <rect x="32" y="130" width="180" height="120" rx="10" fill="#20251a" stroke="#eec854"/>
  <text x="122" y="158" text-anchor="middle" fill="#eec854" font-size="15" font-weight="700" font-family="IBM Plex Sans, sans-serif">Bazaar</text>
  <text x="122" y="178" text-anchor="middle" fill="#c7c4ae" font-size="11.5" font-family="JetBrains Mono, monospace">/bazaar</text>
  <text x="122" y="200" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">public registry browser</text>
  <text x="122" y="218" text-anchor="middle" fill="#a19f89" font-size="10.5" font-family="IBM Plex Sans, sans-serif">category-filtered, searchable</text>
  <text x="122" y="236" text-anchor="middle" fill="#a19f89" font-size="10.5" font-family="IBM Plex Sans, sans-serif">Templates with a public version</text>

  <!-- Pantry (right, onboarding) -->
  <rect x="508" y="130" width="180" height="120" rx="10" fill="#20251a" stroke="#56d8c0"/>
  <text x="598" y="158" text-anchor="middle" fill="#56d8c0" font-size="15" font-weight="700" font-family="IBM Plex Sans, sans-serif">Pantry</text>
  <text x="598" y="178" text-anchor="middle" fill="#c7c4ae" font-size="11.5" font-family="IBM Plex Sans, sans-serif">in the wizard</text>
  <text x="598" y="200" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">your saved collection</text>
  <text x="598" y="218" text-anchor="middle" fill="#a19f89" font-size="10.5" font-family="IBM Plex Sans, sans-serif">reusable Templates &amp; snippets</text>
  <text x="598" y="236" text-anchor="middle" fill="#a19f89" font-size="10.5" font-family="IBM Plex Sans, sans-serif">launch recipes, kept close</text>

  <!-- arrows: Scrolls -> Bazaar (publish) -->
  <line x1="250" y1="178" x2="216" y2="178" stroke="#eec854" stroke-width="2" marker-end="url(#bps-arrow-gold)"/>
  <text x="233" y="168" text-anchor="middle" fill="#eec854" font-size="9.5" font-family="IBM Plex Sans, sans-serif">publish</text>

  <!-- arrows: Pantry -> Scrolls (entry point) -->
  <line x1="508" y1="190" x2="474" y2="190" stroke="#56d8c0" stroke-width="2" marker-end="url(#bps-arrow)"/>
  <text x="491" y="180" text-anchor="middle" fill="#56d8c0" font-size="9.5" font-family="IBM Plex Sans, sans-serif">into</text>

  <!-- import flow bottom -->
  <line x1="122" y1="250" x2="122" y2="294" stroke="#79d44e" stroke-width="2" marker-end="url(#bps-arrow)"/>
  <rect x="40" y="296" width="640" height="36" rx="6" fill="#252a1e" stroke="#434a35"/>
  <text x="360" y="319" text-anchor="middle" fill="#c7c4ae" font-size="11.5" font-family="IBM Plex Sans, sans-serif">import &#8594; fill variables at launch &#8594; Playspec &#8594; Playground or Trick</text>

  <text x="360" y="84" text-anchor="middle" fill="#a19f89" font-size="11.5" font-family="IBM Plex Sans, sans-serif">A version flagged public in Scrolls is exactly what the Bazaar shows.</text>
</svg>
