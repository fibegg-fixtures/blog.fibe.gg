<svg viewBox="0 0 740 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three payment providers funnel through a provider selector into one provider-neutral subscription and order, then fulfilment mints Mana">
  <defs>
    <marker id="pa-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#757d5e"/>
    </marker>
    <marker id="pa-arrow-gold" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#e2b33a"/>
    </marker>
  </defs>

  <text x="370" y="26" text-anchor="middle" fill="#f3f0e0" font-size="16" font-weight="700" font-family="IBM Plex Sans, sans-serif">One Subscription, three providers</text>

  <!-- Providers -->
  <rect x="24" y="56" width="150" height="42" rx="6" fill="#20251a" stroke="#545c42"/>
  <text x="99" y="82" text-anchor="middle" fill="#abe87f" font-size="14" font-family="JetBrains Mono, monospace">Stripe</text>
  <rect x="24" y="110" width="150" height="42" rx="6" fill="#20251a" stroke="#545c42"/>
  <text x="99" y="136" text-anchor="middle" fill="#abe87f" font-size="14" font-family="JetBrains Mono, monospace">Creem</text>
  <rect x="24" y="164" width="150" height="42" rx="6" fill="#20251a" stroke="#545c42"/>
  <text x="99" y="190" text-anchor="middle" fill="#abe87f" font-size="14" font-family="JetBrains Mono, monospace">Paddle</text>
  <text x="99" y="232" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">provider adapters</text>

  <line x1="174" y1="77" x2="252" y2="118" stroke="#757d5e" stroke-width="1.5" marker-end="url(#pa-arrow)"/>
  <line x1="174" y1="131" x2="252" y2="131" stroke="#757d5e" stroke-width="1.5" marker-end="url(#pa-arrow)"/>
  <line x1="174" y1="185" x2="252" y2="144" stroke="#757d5e" stroke-width="1.5" marker-end="url(#pa-arrow)"/>

  <!-- provider selector -->
  <rect x="256" y="100" width="150" height="62" rx="6" fill="#252a1e" stroke="#79d44e"/>
  <text x="331" y="126" text-anchor="middle" fill="#92df62" font-size="13" font-weight="700" font-family="IBM Plex Sans, sans-serif">provider selector</text>
  <text x="331" y="146" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">override &#183; admin &#183; default</text>

  <line x1="406" y1="131" x2="476" y2="131" stroke="#757d5e" stroke-width="1.5" marker-end="url(#pa-arrow)"/>

  <!-- Subscription / Order -->
  <rect x="480" y="84" width="236" height="94" rx="6" fill="#20251a" stroke="#56d8c0"/>
  <text x="598" y="108" text-anchor="middle" fill="#56d8c0" font-size="13" font-weight="700" font-family="IBM Plex Sans, sans-serif">Subscription</text>
  <text x="598" y="128" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">keyed by provider</text>
  <text x="598" y="144" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">+ provider's own id</text>
  <text x="598" y="166" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">+ order (price snapshot)</text>

  <!-- fulfilment -->
  <line x1="598" y1="178" x2="598" y2="222" stroke="#e2b33a" stroke-width="1.5" marker-end="url(#pa-arrow-gold)"/>
  <rect x="468" y="226" width="260" height="50" rx="6" fill="#252a1e" stroke="#eec854"/>
  <text x="598" y="248" text-anchor="middle" fill="#eec854" font-size="13" font-weight="700" font-family="IBM Plex Sans, sans-serif">fulfilment</text>
  <text x="598" y="266" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">claim-once webhook &#183; order lock</text>

  <!-- Mana outputs -->
  <line x1="540" y1="276" x2="470" y2="318" stroke="#e2b33a" stroke-width="1.5" marker-end="url(#pa-arrow-gold)"/>
  <line x1="598" y1="276" x2="598" y2="318" stroke="#e2b33a" stroke-width="1.5" marker-end="url(#pa-arrow-gold)"/>
  <line x1="656" y1="276" x2="715" y2="318" stroke="#e2b33a" stroke-width="1.5" marker-end="url(#pa-arrow-gold)"/>

  <rect x="360" y="322" width="150" height="50" rx="6" fill="#20251a" stroke="#545c42"/>
  <text x="435" y="343" text-anchor="middle" fill="#f5da79" font-size="12" font-weight="700" font-family="JetBrains Mono, monospace">mint Mana</text>
  <text x="435" y="361" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">top-up / order credit</text>

  <rect x="522" y="322" width="150" height="50" rx="6" fill="#20251a" stroke="#545c42"/>
  <text x="597" y="343" text-anchor="middle" fill="#f5da79" font-size="12" font-weight="700" font-family="JetBrains Mono, monospace">tutorial Marquee</text>
  <text x="597" y="361" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">spend bundle &#183; provision</text>

  <rect x="558" y="322" width="0" height="0"/>
  <rect x="618" y="380" width="0" height="0"/>

  <rect x="246" y="322" width="0" height="0"/>
  <text x="435" y="402" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">standard / multiplayer &#8594; convert Mana &#8594; Sparks (fund wallet)</text>
</svg>
