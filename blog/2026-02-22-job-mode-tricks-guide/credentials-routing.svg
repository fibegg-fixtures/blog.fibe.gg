<svg viewBox="0 0 720 244" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three homes for credentials in a job run: launch variable, Secret Vault, and Job ENV, with a note that secret Job ENV is withheld from pull request runs">
  <rect x="0" y="0" width="720" height="244" fill="#1b1f16"/>
  <text x="360" y="28" text-anchor="middle" fill="#f3f0e0" font-size="16" font-weight="700" font-family="IBM Plex Sans, sans-serif">Where a credential belongs in a Trick</text>

  <!-- launch variable -->
  <rect x="20" y="48" width="216" height="120" rx="8" fill="#20251a" stroke="#545c42"/>
  <text x="128" y="74" text-anchor="middle" fill="#56d8c0" font-size="13.5" font-weight="700" font-family="IBM Plex Sans, sans-serif">Launch variable</text>
  <text x="128" y="98" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">x-fibe.gg.variables</text>
  <text x="128" y="124" text-anchor="middle" fill="#c7c4ae" font-size="11.5" font-family="IBM Plex Sans, sans-serif">prompted once per launch</text>
  <text x="128" y="144" text-anchor="middle" fill="#c7c4ae" font-size="11.5" font-family="IBM Plex Sans, sans-serif">good for one-off values</text>

  <!-- secret vault -->
  <rect x="252" y="48" width="216" height="120" rx="8" fill="#20251a" stroke="#545c42"/>
  <text x="360" y="74" text-anchor="middle" fill="#eec854" font-size="13.5" font-weight="700" font-family="IBM Plex Sans, sans-serif">Secret Vault</text>
  <text x="360" y="98" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">Player-scoped store</text>
  <text x="360" y="124" text-anchor="middle" fill="#c7c4ae" font-size="11.5" font-family="IBM Plex Sans, sans-serif">never written into</text>
  <text x="360" y="144" text-anchor="middle" fill="#c7c4ae" font-size="11.5" font-family="IBM Plex Sans, sans-serif">the template</text>

  <!-- job env -->
  <rect x="484" y="48" width="216" height="120" rx="8" fill="#20251a" stroke="#5cb43a"/>
  <text x="592" y="74" text-anchor="middle" fill="#92df62" font-size="13.5" font-weight="700" font-family="IBM Plex Sans, sans-serif">Job ENV</text>
  <text x="592" y="98" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">global or Prop-scoped</text>
  <text x="592" y="124" text-anchor="middle" fill="#c7c4ae" font-size="11.5" font-family="IBM Plex Sans, sans-serif">reused across many runs</text>
  <text x="592" y="144" text-anchor="middle" fill="#c7c4ae" font-size="11.5" font-family="IBM Plex Sans, sans-serif">NPM_TOKEN, AWS keys</text>

  <!-- caution band -->
  <rect x="20" y="184" width="680" height="44" rx="7" fill="#252a1e" stroke="#f08760"/>
  <text x="360" y="206" text-anchor="middle" fill="#f08760" font-size="12.5" font-weight="700" font-family="IBM Plex Sans, sans-serif">pull_request runs receive only NON-secret Job ENV</text>
  <text x="360" y="222" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">PR code is untrusted; push, scheduled, and manual runs receive both</text>
</svg>
