<svg viewBox="0 0 700 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The blind-daemon no-op: the safety branch that runs before any write">
  <defs>
    <marker id="bd-arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#757d5e"/>
    </marker>
  </defs>
  <text x="20" y="28" fill="#f3f0e0" font-size="17" font-weight="700" font-family="IBM Plex Sans, sans-serif">Absence of evidence is not evidence of absence</text>

  <!-- step 1 -->
  <rect x="40" y="52" width="240" height="58" rx="6" fill="#20251a" stroke="#545c42"/>
  <text x="160" y="78" text-anchor="middle" fill="#f3f0e0" font-size="13" font-weight="700" font-family="IBM Plex Sans, sans-serif">fetch the Docker state</text>
  <text x="160" y="97" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">docker compose ps &#183; over SSH</text>
  <line x1="160" y1="110" x2="160" y2="142" stroke="#757d5e" stroke-width="1.5" marker-end="url(#bd-arrow)"/>

  <!-- decision -->
  <polygon points="160,144 300,196 160,248 20,196" fill="#2a2118" stroke="#99761f"/>
  <text x="160" y="190" text-anchor="middle" fill="#f5da79" font-size="13" font-weight="700" font-family="IBM Plex Sans, sans-serif">inspection failed?</text>
  <text x="160" y="208" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">CLI down OR ps errored</text>

  <!-- yes branch -->
  <line x1="300" y1="196" x2="380" y2="196" stroke="#757d5e" stroke-width="1.5" marker-end="url(#bd-arrow)"/>
  <text x="340" y="186" text-anchor="middle" fill="#f08760" font-size="12" font-weight="700" font-family="JetBrains Mono, monospace">YES</text>
  <rect x="382" y="160" width="296" height="72" rx="6" fill="#20251a" stroke="#56d8c0"/>
  <text x="530" y="188" text-anchor="middle" fill="#56d8c0" font-size="14" font-weight="700" font-family="IBM Plex Sans, sans-serif">return &#8212; no-op</text>
  <text x="530" y="208" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">no write &#183; no teardown &#183; no demotion</text>
  <text x="530" y="223" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">the row keeps whatever it said</text>

  <!-- no branch -->
  <line x1="160" y1="248" x2="160" y2="284" stroke="#757d5e" stroke-width="1.5" marker-end="url(#bd-arrow)"/>
  <text x="178" y="270" text-anchor="middle" fill="#92df62" font-size="12" font-weight="700" font-family="JetBrains Mono, monospace">NO</text>
  <rect x="40" y="286" width="240" height="56" rx="6" fill="#1d2a18" stroke="#79d44e"/>
  <text x="160" y="312" text-anchor="middle" fill="#abe87f" font-size="13" font-weight="700" font-family="IBM Plex Sans, sans-serif">trust the witness</text>
  <text x="160" y="330" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">reconcile DB toward Docker truth</text>

  <text x="382" y="262" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">A timed-out SSH hop and a wiped host</text>
  <text x="382" y="278" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">look identical from here. So we don't</text>
  <text x="382" y="294" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">guess &#8212; we wait for the next 60s tick.</text>
</svg>
