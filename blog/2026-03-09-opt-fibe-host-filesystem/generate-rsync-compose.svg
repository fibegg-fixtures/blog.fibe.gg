<svg viewBox="0 0 740 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The generate to rsync to compose-up-over-SSH pipeline">
  <defs>
    <marker id="arrGRC" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#79d44e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="740" height="360" fill="#20251a"/>
  <text x="24" y="32" fill="#f3f0e0" font-size="17" font-weight="700" font-family="IBM Plex Sans, sans-serif">From a generated YAML to a running stack</text>

  <!-- control plane band -->
  <rect x="20" y="54" width="700" height="118" rx="8" fill="#252a1e" stroke="#434a35" stroke-dasharray="4 3"/>
  <text x="34" y="74" fill="#92df62" font-size="12" font-weight="700" font-family="JetBrains Mono, monospace">CONTROL PLANE &#183; Rails on Scaleway K8s</text>

  <rect x="40" y="86" width="150" height="64" rx="6" fill="#20251a" stroke="#545c42"/>
  <text x="115" y="112" text-anchor="middle" fill="#f3f0e0" font-size="13" font-weight="700" font-family="IBM Plex Sans, sans-serif">1. Generate</text>
  <text x="115" y="132" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">compose from Template</text>

  <line x1="190" y1="118" x2="226" y2="118" stroke="#79d44e" stroke-width="2" marker-end="url(#arrGRC)"/>

  <rect x="230" y="86" width="150" height="64" rx="6" fill="#20251a" stroke="#545c42"/>
  <text x="305" y="112" text-anchor="middle" fill="#f3f0e0" font-size="13" font-weight="700" font-family="IBM Plex Sans, sans-serif">2. rsync over SSH</text>
  <text x="305" y="132" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">compose + scripts + src</text>

  <line x1="380" y1="118" x2="416" y2="118" stroke="#79d44e" stroke-width="2" marker-end="url(#arrGRC)"/>

  <rect x="420" y="86" width="160" height="64" rx="6" fill="#20251a" stroke="#545c42"/>
  <text x="500" y="112" text-anchor="middle" fill="#f3f0e0" font-size="13" font-weight="700" font-family="IBM Plex Sans, sans-serif">3. ssh + compose</text>
  <text x="500" y="132" text-anchor="middle" fill="#a19f89" font-size="11" font-family="JetBrains Mono, monospace">-p proj -f compose.yml</text>

  <line x1="580" y1="118" x2="616" y2="118" stroke="#79d44e" stroke-width="2" marker-end="url(#arrGRC)"/>

  <rect x="620" y="86" width="92" height="64" rx="6" fill="#20251a" stroke="#5cb43a"/>
  <text x="666" y="112" text-anchor="middle" fill="#abe87f" font-size="13" font-weight="700" font-family="IBM Plex Sans, sans-serif">4. up</text>
  <text x="666" y="132" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">health-gated</text>

  <!-- transport arrow down -->
  <line x1="370" y1="172" x2="370" y2="206" stroke="#56d8c0" stroke-width="2"/>
  <text x="384" y="194" fill="#56d8c0" font-size="11" font-family="JetBrains Mono, monospace">SSH (BatchMode, ConnectTimeout=10)</text>

  <!-- remote band -->
  <rect x="20" y="210" width="700" height="124" rx="8" fill="#252a1e" stroke="#434a35"/>
  <text x="34" y="230" fill="#eec854" font-size="12" font-weight="700" font-family="JetBrains Mono, monospace">REMOTE MARQUEE &#183; Docker host (BYO or Scaleway VM)</text>

  <rect x="40" y="244" width="320" height="74" rx="6" fill="#20251a" stroke="#545c42"/>
  <text x="56" y="266" fill="#f3f0e0" font-size="12" font-family="JetBrains Mono, monospace">/opt/fibe/playgrounds/&lt;id&gt;/</text>
  <text x="56" y="286" fill="#a19f89" font-size="11" font-family="JetBrains Mono, monospace">compose.yml &#183; props/ &#183; docker-config/</text>
  <text x="56" y="304" fill="#a19f89" font-size="11" font-family="JetBrains Mono, monospace">.fibe/owner.json</text>

  <rect x="380" y="244" width="300" height="74" rx="6" fill="#20251a" stroke="#5cb43a"/>
  <text x="530" y="270" text-anchor="middle" fill="#92df62" font-size="13" font-weight="700" font-family="IBM Plex Sans, sans-serif">docker compose up</text>
  <text x="530" y="290" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">project dir = compose file's dir</text>
  <text x="530" y="307" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">no agent installed on the box</text>
</svg>
