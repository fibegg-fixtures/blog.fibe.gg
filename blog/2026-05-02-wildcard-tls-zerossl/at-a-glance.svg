<svg viewBox="0 0 740 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="At a glance: one wildcard cert per marquee, ZeroSSL DV90 over DNS-01, gated on a verified HTTPS GET, with up to 15 retry attempts">
  <rect x="0" y="10" width="176" height="80" rx="6" fill="#20251a" stroke="#434a35"/>
  <text x="88" y="48" text-anchor="middle" fill="#92df62" font-size="26" font-weight="700" font-family="JetBrains Mono, monospace">*.domain</text>
  <text x="88" y="72" text-anchor="middle" fill="#a19f89" font-size="11.5" font-family="IBM Plex Sans, sans-serif">one cert per marquee</text>

  <rect x="188" y="10" width="176" height="80" rx="6" fill="#20251a" stroke="#434a35"/>
  <text x="276" y="48" text-anchor="middle" fill="#eec854" font-size="26" font-weight="700" font-family="JetBrains Mono, monospace">DV90</text>
  <text x="276" y="72" text-anchor="middle" fill="#a19f89" font-size="11.5" font-family="IBM Plex Sans, sans-serif">ZeroSSL, DNS-01</text>

  <rect x="376" y="10" width="176" height="80" rx="6" fill="#20251a" stroke="#434a35"/>
  <text x="464" y="48" text-anchor="middle" fill="#56d8c0" font-size="26" font-weight="700" font-family="JetBrains Mono, monospace">verified</text>
  <text x="464" y="72" text-anchor="middle" fill="#a19f89" font-size="11.5" font-family="IBM Plex Sans, sans-serif">HTTPS GET before active</text>

  <rect x="564" y="10" width="176" height="80" rx="6" fill="#20251a" stroke="#434a35"/>
  <text x="652" y="48" text-anchor="middle" fill="#abe87f" font-size="26" font-weight="700" font-family="JetBrains Mono, monospace">15</text>
  <text x="652" y="72" text-anchor="middle" fill="#a19f89" font-size="11.5" font-family="IBM Plex Sans, sans-serif">retry attempts, backed off</text>
</svg>
