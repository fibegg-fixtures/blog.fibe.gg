<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Circuit breaker state machine. Closed lets every request through; after 5 consecutive failures it transitions to Open. Open fails fast with no request for 30 seconds, then transitions to Half-open. Half-open admits 2 probe requests; 2 successes close it, any failure re-opens it.">
  <defs>
    <marker id="cb-g" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#79d44e"/>
    </marker>
    <marker id="cb-r" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#f08760"/>
    </marker>
    <marker id="cb-gold" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#eec854"/>
    </marker>
  </defs>

  <!-- CLOSED -->
  <circle cx="130" cy="150" r="68" fill="#1c2a1e" stroke="#5cb43a" stroke-width="2.5"/>
  <text x="130" y="142" text-anchor="middle" fill="#92df62" font-size="17" font-weight="700" font-family="JetBrains Mono, monospace">CLOSED</text>
  <text x="130" y="164" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">all requests pass</text>

  <!-- OPEN -->
  <circle cx="590" cy="150" r="68" fill="#2a1f1c" stroke="#f08760" stroke-width="2.5"/>
  <text x="590" y="142" text-anchor="middle" fill="#f08760" font-size="19" font-weight="700" font-family="JetBrains Mono, monospace">OPEN</text>
  <text x="590" y="164" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">fail fast, no call</text>

  <!-- HALF-OPEN -->
  <circle cx="360" cy="262" r="56" fill="#2a261a" stroke="#eec854" stroke-width="2.5"/>
  <text x="360" y="258" text-anchor="middle" fill="#eec854" font-size="14" font-weight="700" font-family="JetBrains Mono, monospace">HALF-OPEN</text>
  <text x="360" y="278" text-anchor="middle" fill="#c7c4ae" font-size="10" font-family="IBM Plex Sans, sans-serif">2 probe requests</text>

  <!-- closed -> open -->
  <line x1="198" y1="132" x2="522" y2="132" stroke="#f08760" stroke-width="2" marker-end="url(#cb-r)"/>
  <text x="360" y="122" text-anchor="middle" fill="#f08760" font-size="12" font-weight="700" font-family="JetBrains Mono, monospace">5 consecutive failures</text>

  <!-- open -> half-open -->
  <line x1="540" y1="200" x2="408" y2="244" stroke="#eec854" stroke-width="2" marker-end="url(#cb-gold)"/>
  <text x="500" y="238" text-anchor="middle" fill="#eec854" font-size="12" font-family="JetBrains Mono, monospace">after 30s</text>

  <!-- half-open -> closed (success) -->
  <line x1="312" y1="244" x2="180" y2="200" stroke="#79d44e" stroke-width="2" marker-end="url(#cb-g)"/>
  <text x="218" y="238" text-anchor="middle" fill="#92df62" font-size="12" font-family="JetBrains Mono, monospace">2 successes</text>

  <!-- half-open -> open (any failure) -->
  <path d="M 416 256 Q 540 280 560 212" fill="none" stroke="#f08760" stroke-width="2" marker-end="url(#cb-r)"/>
  <text x="540" y="298" text-anchor="middle" fill="#f08760" font-size="12" font-family="JetBrains Mono, monospace">any failure &#8594; re-open</text>

  <!-- self loop on closed -->
  <path d="M 92 92 Q 110 50 150 70" fill="none" stroke="#79d44e" stroke-width="1.6" marker-end="url(#cb-g)"/>
  <text x="130" y="40" text-anchor="middle" fill="#a19f89" font-size="10" font-family="IBM Plex Sans, sans-serif">success resets counter</text>

  <!-- caption -->
  <text x="590" y="246" text-anchor="middle" fill="#a19f89" font-size="10" font-family="IBM Plex Sans, sans-serif">callers get an open-circuit error</text>
  <text x="590" y="260" text-anchor="middle" fill="#a19f89" font-size="10" font-family="IBM Plex Sans, sans-serif">naming the dead resource</text>
</svg>
