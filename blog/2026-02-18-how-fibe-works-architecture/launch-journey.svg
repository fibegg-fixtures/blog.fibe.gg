<svg viewBox="0 0 760 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The launch journey: a Playground moves from pending through eight ordered creation steps to running, with failures routed to error, requeue, or user-fault">
  <defs>
    <marker id="lj-arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#757d5e"/>
    </marker>
  </defs>

  <text x="380" y="26" text-anchor="middle" fill="#f3f0e0" font-size="17" font-weight="700" font-family="IBM Plex Sans, sans-serif">What happens when you click Launch</text>
  <text x="380" y="46" text-anchor="middle" fill="#a19f89" font-size="12" font-family="IBM Plex Sans, sans-serif">pending &#8594; a creation job claims the record &#8594; in progress &#8594; eight ordered steps &#8594; running</text>

  <!-- step boxes -->
  <!-- row 1 -->
  <g font-family="IBM Plex Sans, sans-serif">
    <rect x="30" y="70" width="160" height="62" rx="7" fill="#20251a" stroke="#545c42"/>
    <text x="42" y="90" fill="#eec854" font-size="13" font-weight="700" font-family="JetBrains Mono, monospace">1</text>
    <text x="110" y="92" text-anchor="middle" fill="#abe87f" font-size="12" font-weight="700">Start the router</text>
    <text x="110" y="110" text-anchor="middle" fill="#a19f89" font-size="10">router up (skipped</text>
    <text x="110" y="123" text-anchor="middle" fill="#a19f89" font-size="10">in job mode)</text>

    <rect x="220" y="70" width="160" height="62" rx="7" fill="#20251a" stroke="#545c42"/>
    <text x="232" y="90" fill="#eec854" font-size="13" font-weight="700" font-family="JetBrains Mono, monospace">2</text>
    <text x="300" y="92" text-anchor="middle" fill="#abe87f" font-size="12" font-weight="700">Clone the branch</text>
    <text x="300" y="110" text-anchor="middle" fill="#a19f89" font-size="10">sync source from</text>
    <text x="300" y="123" text-anchor="middle" fill="#a19f89" font-size="10">the Prop</text>

    <rect x="410" y="70" width="160" height="62" rx="7" fill="#20251a" stroke="#545c42"/>
    <text x="422" y="90" fill="#eec854" font-size="13" font-weight="700" font-family="JetBrains Mono, monospace">3</text>
    <text x="490" y="92" text-anchor="middle" fill="#abe87f" font-size="12" font-weight="700">Registry auth</text>
    <text x="490" y="110" text-anchor="middle" fill="#a19f89" font-size="10">merge registry creds</text>
    <text x="490" y="123" text-anchor="middle" fill="#a19f89" font-size="10">to remote config</text>

    <rect x="600" y="70" width="160" height="62" rx="7" fill="#20251a" stroke="#545c42"/>
    <text x="612" y="90" fill="#eec854" font-size="13" font-weight="700" font-family="JetBrains Mono, monospace">4</text>
    <text x="680" y="92" text-anchor="middle" fill="#abe87f" font-size="12" font-weight="700">Build the image</text>
    <text x="680" y="110" text-anchor="middle" fill="#a19f89" font-size="10">build or reuse a</text>
    <text x="680" y="123" text-anchor="middle" fill="#a19f89" font-size="10">valid image</text>
  </g>

  <!-- row 2 -->
  <g font-family="IBM Plex Sans, sans-serif">
    <rect x="30" y="178" width="160" height="62" rx="7" fill="#20251a" stroke="#545c42"/>
    <text x="42" y="198" fill="#eec854" font-size="13" font-weight="700" font-family="JetBrains Mono, monospace">5</text>
    <text x="110" y="200" text-anchor="middle" fill="#abe87f" font-size="11" font-weight="700">Pre-compose</text>
    <text x="110" y="214" text-anchor="middle" fill="#abe87f" font-size="11" font-weight="700">teardown</text>
    <text x="110" y="231" text-anchor="middle" fill="#a19f89" font-size="10">clear stale services</text>

    <rect x="220" y="178" width="160" height="62" rx="7" fill="#20251a" stroke="#545c42"/>
    <text x="232" y="198" fill="#eec854" font-size="13" font-weight="700" font-family="JetBrains Mono, monospace">6</text>
    <text x="300" y="200" text-anchor="middle" fill="#abe87f" font-size="11" font-weight="700">Generate Compose</text>
    <text x="300" y="218" text-anchor="middle" fill="#a19f89" font-size="10">render the runtime</text>
    <text x="300" y="231" text-anchor="middle" fill="#a19f89" font-size="10">compose file</text>

    <rect x="410" y="178" width="160" height="62" rx="7" fill="#20251a" stroke="#545c42"/>
    <text x="422" y="198" fill="#eec854" font-size="13" font-weight="700" font-family="JetBrains Mono, monospace">7</text>
    <text x="490" y="200" text-anchor="middle" fill="#abe87f" font-size="12" font-weight="700">Start the agent</text>
    <text x="490" y="218" text-anchor="middle" fill="#a19f89" font-size="10">only if a Genie is</text>
    <text x="490" y="231" text-anchor="middle" fill="#a19f89" font-size="10">attached</text>

    <rect x="600" y="178" width="160" height="62" rx="7" fill="#20251a" stroke="#79d44e" stroke-width="2"/>
    <text x="612" y="198" fill="#eec854" font-size="13" font-weight="700" font-family="JetBrains Mono, monospace">8</text>
    <text x="680" y="200" text-anchor="middle" fill="#92df62" font-size="12" font-weight="700">Bring it up</text>
    <text x="680" y="218" text-anchor="middle" fill="#a19f89" font-size="10">up / rollout, then</text>
    <text x="680" y="231" text-anchor="middle" fill="#a19f89" font-size="10">mark it running</text>
  </g>

  <!-- arrows within rows -->
  <line x1="190" y1="101" x2="218" y2="101" stroke="#757d5e" stroke-width="1.5" marker-end="url(#lj-arrow)"/>
  <line x1="380" y1="101" x2="408" y2="101" stroke="#757d5e" stroke-width="1.5" marker-end="url(#lj-arrow)"/>
  <line x1="570" y1="101" x2="598" y2="101" stroke="#757d5e" stroke-width="1.5" marker-end="url(#lj-arrow)"/>
  <!-- wrap arrow 4 -> 5 -->
  <path d="M680,132 L680,155 L110,155 L110,176" fill="none" stroke="#757d5e" stroke-width="1.5" marker-end="url(#lj-arrow)"/>
  <line x1="190" y1="209" x2="218" y2="209" stroke="#757d5e" stroke-width="1.5" marker-end="url(#lj-arrow)"/>
  <line x1="380" y1="209" x2="408" y2="209" stroke="#757d5e" stroke-width="1.5" marker-end="url(#lj-arrow)"/>
  <line x1="570" y1="209" x2="598" y2="209" stroke="#757d5e" stroke-width="1.5" marker-end="url(#lj-arrow)"/>

  <!-- running result -->
  <rect x="290" y="290" width="180" height="48" rx="8" fill="#252a1e" stroke="#92df62" stroke-width="2"/>
  <text x="380" y="312" text-anchor="middle" fill="#92df62" font-size="14" font-weight="700" font-family="JetBrains Mono, monospace">running</text>
  <text x="380" y="329" text-anchor="middle" fill="#a19f89" font-size="10" font-family="IBM Plex Sans, sans-serif">live, routed, healed</text>
  <path d="M680,240 L680,264 L470,264 L470,288" fill="none" stroke="#79d44e" stroke-width="1.6" marker-end="url(#lj-arrow)"/>

  <!-- failure routing band -->
  <text x="380" y="372" text-anchor="middle" fill="#c7c4ae" font-size="12" font-weight="700" font-family="IBM Plex Sans, sans-serif">if a step fails, the classifier routes it</text>

  <rect x="40" y="390" width="220" height="58" rx="7" fill="#20251a" stroke="#f08760"/>
  <text x="150" y="412" text-anchor="middle" fill="#f08760" font-size="12" font-weight="700" font-family="IBM Plex Sans, sans-serif">user fault</text>
  <text x="150" y="430" text-anchor="middle" fill="#a19f89" font-size="10" font-family="IBM Plex Sans, sans-serif">bad clone / build / compose</text>
  <text x="150" y="443" text-anchor="middle" fill="#a19f89" font-size="10" font-family="IBM Plex Sans, sans-serif">&#8594; error, visible, no auto-retry</text>

  <rect x="270" y="390" width="220" height="58" rx="7" fill="#20251a" stroke="#eec854"/>
  <text x="380" y="412" text-anchor="middle" fill="#eec854" font-size="12" font-weight="700" font-family="IBM Plex Sans, sans-serif">temporary infra</text>
  <text x="380" y="430" text-anchor="middle" fill="#a19f89" font-size="10" font-family="IBM Plex Sans, sans-serif">timeout / conn refused</text>
  <text x="380" y="443" text-anchor="middle" fill="#a19f89" font-size="10" font-family="IBM Plex Sans, sans-serif">&#8594; requeue to pending</text>

  <rect x="500" y="390" width="220" height="58" rx="7" fill="#20251a" stroke="#56d8c0"/>
  <text x="610" y="412" text-anchor="middle" fill="#56d8c0" font-size="12" font-weight="700" font-family="IBM Plex Sans, sans-serif">recoverable compose</text>
  <text x="610" y="430" text-anchor="middle" fill="#a19f89" font-size="10" font-family="IBM Plex Sans, sans-serif">container conflict / one-shot</text>
  <text x="610" y="443" text-anchor="middle" fill="#a19f89" font-size="10" font-family="IBM Plex Sans, sans-serif">&#8594; self-clean &amp; retry / done</text>
</svg>
