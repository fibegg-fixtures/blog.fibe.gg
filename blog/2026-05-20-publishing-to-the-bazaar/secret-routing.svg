<svg viewBox="0 0 720 132" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Where a credential belongs: generated values use random true, external creds use the Secret Vault, job-mode runs use Job ENV">
  <text x="360" y="24" text-anchor="middle" fill="#f3f0e0" font-size="14" font-weight="700" font-family="IBM Plex Sans, sans-serif">A credential never lives in default: — it lives in one of these</text>

  <rect x="18" y="38" width="222" height="80" rx="6" fill="#20251a" stroke="#79d44e"/>
  <text x="129" y="66" text-anchor="middle" fill="#92df62" font-size="15" font-weight="700" font-family="JetBrains Mono, monospace">random: true</text>
  <text x="129" y="90" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">generated per launch</text>
  <text x="129" y="106" text-anchor="middle" fill="#a19f89" font-size="10.5" font-family="IBM Plex Sans, sans-serif">DB passwords, signing keys</text>

  <rect x="249" y="38" width="222" height="80" rx="6" fill="#20251a" stroke="#eec854"/>
  <text x="360" y="66" text-anchor="middle" fill="#eec854" font-size="15" font-weight="700" font-family="JetBrains Mono, monospace">Secret Vault</text>
  <text x="360" y="90" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">external credentials</text>
  <text x="360" y="106" text-anchor="middle" fill="#a19f89" font-size="10.5" font-family="IBM Plex Sans, sans-serif">API keys, OAuth, third-party</text>

  <rect x="480" y="38" width="222" height="80" rx="6" fill="#20251a" stroke="#56d8c0"/>
  <text x="591" y="66" text-anchor="middle" fill="#56d8c0" font-size="15" font-weight="700" font-family="JetBrains Mono, monospace">Job ENV</text>
  <text x="591" y="90" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">job-mode runs</text>
  <text x="591" y="106" text-anchor="middle" fill="#a19f89" font-size="10.5" font-family="IBM Plex Sans, sans-serif">Tricks: tests, migrations, cron</text>
</svg>
