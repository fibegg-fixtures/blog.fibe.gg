<svg viewBox="0 0 720 112" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Resilience primitives at a glance: 5 failure HTTP codes are retryable, 24-hour idempotent replay window, 1-second default poll interval, 5 failures trip the breaker">
  <rect x="0" y="8" width="168" height="96" rx="6" fill="#20251a" stroke="#434a35"/>
  <text x="84" y="50" text-anchor="middle" fill="#92df62" font-size="30" font-weight="700" font-family="JetBrains Mono, monospace">5</text>
  <text x="84" y="74" text-anchor="middle" fill="#c7c4ae" font-size="12" font-family="IBM Plex Sans, sans-serif">retryable codes</text>
  <text x="84" y="90" text-anchor="middle" fill="#a19f89" font-size="10" font-family="JetBrains Mono, monospace">429 500 502 503 504</text>

  <rect x="184" y="8" width="168" height="96" rx="6" fill="#20251a" stroke="#434a35"/>
  <text x="268" y="50" text-anchor="middle" fill="#eec854" font-size="30" font-weight="700" font-family="JetBrains Mono, monospace">24h</text>
  <text x="268" y="74" text-anchor="middle" fill="#c7c4ae" font-size="12" font-family="IBM Plex Sans, sans-serif">idempotent replay</text>
  <text x="268" y="90" text-anchor="middle" fill="#a19f89" font-size="10" font-family="JetBrains Mono, monospace">cached &amp; replayed</text>

  <rect x="368" y="8" width="168" height="96" rx="6" fill="#20251a" stroke="#434a35"/>
  <text x="452" y="50" text-anchor="middle" fill="#56d8c0" font-size="30" font-weight="700" font-family="JetBrains Mono, monospace">1s</text>
  <text x="452" y="74" text-anchor="middle" fill="#c7c4ae" font-size="12" font-family="IBM Plex Sans, sans-serif">poll interval</text>
  <text x="452" y="90" text-anchor="middle" fill="#a19f89" font-size="10" font-family="JetBrains Mono, monospace">202 &#8594; result, 5m cap</text>

  <rect x="552" y="8" width="168" height="96" rx="6" fill="#20251a" stroke="#434a35"/>
  <text x="636" y="50" text-anchor="middle" fill="#f08760" font-size="30" font-weight="700" font-family="JetBrains Mono, monospace">5</text>
  <text x="636" y="74" text-anchor="middle" fill="#c7c4ae" font-size="12" font-family="IBM Plex Sans, sans-serif">failures trip breaker</text>
  <text x="636" y="90" text-anchor="middle" fill="#a19f89" font-size="10" font-family="JetBrains Mono, monospace">30s reset &#183; 2 probes</text>
</svg>
