<svg viewBox="0 0 740 326" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Clash resolution: when every clashing sibling is already being destroyed, the error softens from subdomain in use to the gentler subdomain freeing up">
  <text x="370" y="30" text-anchor="middle" fill="#f3f0e0" font-size="17" font-weight="700" font-family="IBM Plex Sans, sans-serif">When a clash is permanent vs. about to clear</text>
  <text x="370" y="50" text-anchor="middle" fill="#a19f89" font-size="12" font-family="IBM Plex Sans, sans-serif">Same Marquee, same bare subdomain &#8594; the message depends on the sibling&#8217;s status</text>

  <!-- Left: hard clash -->
  <rect x="28" y="72" width="332" height="216" rx="8" fill="#20251a" stroke="#f08760"/>
  <text x="194" y="98" text-anchor="middle" fill="#f08760" font-size="14" font-weight="700" font-family="IBM Plex Sans, sans-serif">A sibling is still live</text>

  <rect x="48" y="114" width="292" height="40" rx="4" fill="#252a1e" stroke="#434a35"/>
  <text x="64" y="132" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">sibling &#8220;web&#8221;</text>
  <text x="324" y="132" text-anchor="end" fill="#92df62" font-size="11" font-family="JetBrains Mono, monospace">running</text>
  <text x="64" y="147" fill="#a19f89" font-size="10" font-family="JetBrains Mono, monospace">app.host  (bare)</text>

  <text x="194" y="180" text-anchor="middle" fill="#a19f89" font-size="12" font-family="IBM Plex Sans, sans-serif">not all destroying &#8594;</text>

  <rect x="48" y="194" width="292" height="36" rx="4" fill="#2a1d17" stroke="#99761f"/>
  <text x="194" y="217" text-anchor="middle" fill="#f08760" font-size="13" font-weight="700" font-family="IBM Plex Sans, sans-serif">&#8220;subdomain in use&#8221;</text>

  <text x="194" y="258" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">Real conflict. Pick a different</text>
  <text x="194" y="274" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">subdomain or wait it out.</text>

  <!-- Right: soft clash -->
  <rect x="380" y="72" width="332" height="216" rx="8" fill="#20251a" stroke="#eec854"/>
  <text x="546" y="98" text-anchor="middle" fill="#eec854" font-size="14" font-weight="700" font-family="IBM Plex Sans, sans-serif">Every sibling is destroying</text>

  <rect x="400" y="114" width="292" height="40" rx="4" fill="#252a1e" stroke="#434a35"/>
  <text x="416" y="132" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">sibling &#8220;web&#8221;</text>
  <text x="676" y="132" text-anchor="end" fill="#f08760" font-size="11" font-family="JetBrains Mono, monospace">destroying</text>
  <text x="416" y="147" fill="#a19f89" font-size="10" font-family="JetBrains Mono, monospace">app.host  (bare)</text>

  <text x="546" y="180" text-anchor="middle" fill="#a19f89" font-size="12" font-family="IBM Plex Sans, sans-serif">all destroying &#8594;</text>

  <rect x="400" y="194" width="292" height="36" rx="4" fill="#252118" stroke="#99761f"/>
  <text x="546" y="217" text-anchor="middle" fill="#f5da79" font-size="13" font-weight="700" font-family="IBM Plex Sans, sans-serif">&#8220;subdomain freeing up&#8221;</text>

  <text x="546" y="258" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">The address is freeing up.</text>
  <text x="546" y="274" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">Retry in a moment.</text>

  <text x="370" y="312" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">The @ root gets the same treatment: &#8220;root in use&#8221; vs. &#8220;root freeing up&#8221;.</text>
</svg>
