<svg viewBox="0 0 760 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Provisioning pipeline from paid checkout to active Marquee">
  <defs>
    <marker id="pipe-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#757d5e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="540" fill="none"/>

  <!-- lane labels -->
  <text x="16" y="30" fill="#a19f89" font-size="12" font-family="JetBrains Mono, monospace">Rails control plane</text>
  <text x="16" y="206" fill="#a19f89" font-size="12" font-family="JetBrains Mono, monospace">GitHub Actions &#183; Terraform</text>
  <text x="16" y="382" fill="#a19f89" font-size="12" font-family="JetBrains Mono, monospace">Marquee runtime (Traefik)</text>

  <!-- Row 1: control plane -->
  <rect x="16" y="40" width="160" height="58" rx="6" fill="#20251a" stroke="#434a35"/>
  <text x="96" y="64" text-anchor="middle" fill="#f5da79" font-size="13" font-weight="700" font-family="IBM Plex Sans, sans-serif">Paid checkout</text>
  <text x="96" y="84" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">mints Mana, publishes event</text>

  <rect x="216" y="40" width="172" height="58" rx="6" fill="#20251a" stroke="#434a35"/>
  <text x="302" y="64" text-anchor="middle" fill="#f3f0e0" font-size="13" font-weight="700" font-family="IBM Plex Sans, sans-serif">Planner job</text>
  <text x="302" y="84" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">creates Marquee: disabled / provisioning</text>

  <rect x="428" y="40" width="172" height="58" rx="6" fill="#20251a" stroke="#434a35"/>
  <text x="514" y="60" text-anchor="middle" fill="#f3f0e0" font-size="13" font-weight="700" font-family="IBM Plex Sans, sans-serif">Dispatch deploy</text>
  <text x="514" y="78" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">trigger Terraform workflow</text>
  <text x="514" y="92" text-anchor="middle" fill="#56d8c0" font-size="10" font-family="JetBrains Mono, monospace">+ Redis dispatch-lock</text>

  <line x1="176" y1="69" x2="212" y2="69" stroke="#757d5e" stroke-width="1.5" marker-end="url(#pipe-arrow)"/>
  <line x1="388" y1="69" x2="424" y2="69" stroke="#757d5e" stroke-width="1.5" marker-end="url(#pipe-arrow)"/>

  <!-- down to actions -->
  <line x1="514" y1="98" x2="514" y2="156" stroke="#757d5e" stroke-width="1.5" marker-end="url(#pipe-arrow)"/>
  <text x="524" y="130" fill="#a19f89" font-size="10" font-family="JetBrains Mono, monospace">id, subdomain, domain,</text>
  <text x="524" y="144" fill="#a19f89" font-size="10" font-family="JetBrains Mono, monospace">webhook url+secret, generation</text>

  <!-- Row 2: terraform -->
  <rect x="428" y="216" width="172" height="58" rx="6" fill="#252a1e" stroke="#545c42"/>
  <text x="514" y="240" text-anchor="middle" fill="#92df62" font-size="13" font-weight="700" font-family="IBM Plex Sans, sans-serif">Terraform apply</text>
  <text x="514" y="260" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">VM + DNS + acme-dns</text>

  <rect x="216" y="216" width="172" height="58" rx="6" fill="#252a1e" stroke="#545c42"/>
  <text x="302" y="237" text-anchor="middle" fill="#f3f0e0" font-size="12" font-weight="700" font-family="IBM Plex Sans, sans-serif">step webhooks</text>
  <text x="302" y="254" text-anchor="middle" fill="#56d8c0" font-size="10" font-family="JetBrains Mono, monospace">VM coming up &#8594; VM ready</text>
  <text x="302" y="268" text-anchor="middle" fill="#56d8c0" font-size="10" font-family="JetBrains Mono, monospace">&#8594; SSH configured</text>

  <rect x="16" y="216" width="172" height="58" rx="6" fill="#252a1e" stroke="#545c42"/>
  <text x="102" y="240" text-anchor="middle" fill="#f3f0e0" font-size="12" font-weight="700" font-family="IBM Plex Sans, sans-serif">host-landed webhook</text>
  <text x="102" y="260" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">store host/ip/ssh + creds</text>

  <line x1="510" y1="274" x2="430" y2="274" stroke="#757d5e" stroke-width="0" />
  <line x1="514" y1="274" x2="514" y2="300" stroke="#757d5e" stroke-width="1.5"/>
  <line x1="514" y1="300" x2="302" y2="300" stroke="#757d5e" stroke-width="1.5"/>
  <line x1="302" y1="300" x2="302" y2="278" stroke="#757d5e" stroke-width="1.5" marker-end="url(#pipe-arrow)"/>
  <line x1="216" y1="245" x2="192" y2="245" stroke="#757d5e" stroke-width="1.5" marker-end="url(#pipe-arrow)"/>

  <!-- host-landed enters TLS phase, enqueues bootstrap -->
  <line x1="102" y1="274" x2="102" y2="332" stroke="#757d5e" stroke-width="1.5" marker-end="url(#pipe-arrow)"/>
  <text x="112" y="306" fill="#f5da79" font-size="10" font-family="JetBrains Mono, monospace">enter TLS phase,</text>
  <text x="112" y="320" fill="#f5da79" font-size="10" font-family="JetBrains Mono, monospace">enqueue bootstrap job</text>

  <!-- Row 3: traefik runtime -->
  <rect x="16" y="392" width="220" height="62" rx="6" fill="#20251a" stroke="#434a35"/>
  <text x="126" y="416" text-anchor="middle" fill="#92df62" font-size="13" font-weight="700" font-family="IBM Plex Sans, sans-serif">Traefik bootstrap</text>
  <text x="126" y="436" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">acme-dns + ZeroSSL EAB</text>

  <rect x="276" y="392" width="200" height="62" rx="6" fill="#20251a" stroke="#434a35"/>
  <text x="376" y="416" text-anchor="middle" fill="#f3f0e0" font-size="13" font-weight="700" font-family="IBM Plex Sans, sans-serif">warm-up router</text>
  <text x="376" y="436" text-anchor="middle" fill="#56d8c0" font-size="11" font-family="JetBrains Mono, monospace">requests *.{domain}</text>

  <rect x="516" y="392" width="228" height="62" rx="6" fill="#20251a" stroke="#434a35"/>
  <text x="630" y="416" text-anchor="middle" fill="#f5da79" font-size="13" font-weight="700" font-family="IBM Plex Sans, sans-serif">TLS readiness probe</text>
  <text x="630" y="436" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">verified HTTPS GET</text>

  <line x1="236" y1="423" x2="272" y2="423" stroke="#757d5e" stroke-width="1.5" marker-end="url(#pipe-arrow)"/>
  <line x1="476" y1="423" x2="512" y2="423" stroke="#757d5e" stroke-width="1.5" marker-end="url(#pipe-arrow)"/>

  <!-- final active -->
  <rect x="516" y="486" width="228" height="44" rx="6" fill="#252a1e" stroke="#5cb43a" stroke-width="1.5"/>
  <text x="630" y="513" text-anchor="middle" fill="#abe87f" font-size="13" font-weight="700" font-family="JetBrains Mono, monospace">active &#183; provisioned</text>
  <line x1="630" y1="454" x2="630" y2="482" stroke="#5cb43a" stroke-width="1.5" marker-end="url(#pipe-arrow)"/>
</svg>
