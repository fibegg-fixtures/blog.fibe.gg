<svg viewBox="0 0 740 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Rails generates a compose file, rsyncs it to a per-environment directory on the remote Marquee over SSH, and runs docker compose -p project -f compose.yml up there">
  <defs>
    <marker id="hc-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5cb43a"/>
    </marker>
    <marker id="hc-teal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#56d8c0"/>
    </marker>
  </defs>

  <text x="24" y="30" fill="#f3f0e0" font-size="17" font-weight="700" font-family="IBM Plex Sans, sans-serif">There is no local checkout &#8212; the compose is generated, synced, and run over SSH</text>

  <!-- Rails side -->
  <rect x="24" y="56" width="240" height="180" rx="8" fill="#20251a" stroke="#545c42"/>
  <text x="44" y="82" fill="#92df62" font-size="13" font-weight="700" font-family="IBM Plex Sans, sans-serif">Rails (the control plane)</text>

  <rect x="44" y="98" width="200" height="38" rx="5" fill="#252a1e" stroke="#434a35"/>
  <text x="144" y="121" text-anchor="middle" fill="#c7c4ae" font-size="11.5" font-family="IBM Plex Sans, sans-serif">render the compose file</text>

  <rect x="44" y="146" width="200" height="38" rx="5" fill="#252a1e" stroke="#434a35"/>
  <text x="144" y="169" text-anchor="middle" fill="#c7c4ae" font-size="11.5" font-family="IBM Plex Sans, sans-serif">the generated compose YAML</text>

  <rect x="44" y="194" width="200" height="34" rx="5" fill="#252a1e" stroke="#434a35"/>
  <text x="144" y="215" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">resolve ${...} &#183; never sync if unresolved</text>

  <!-- rsync arrow -->
  <line x1="264" y1="150" x2="430" y2="150" stroke="#56d8c0" stroke-width="2.4" marker-end="url(#hc-teal)"/>
  <text x="347" y="138" text-anchor="middle" fill="#56d8c0" font-size="12" font-weight="700" font-family="JetBrains Mono, monospace">rsync over SSH</text>
  <text x="347" y="170" text-anchor="middle" fill="#a19f89" font-size="10.5" font-family="IBM Plex Sans, sans-serif">non-interactive &#183; short connect timeout &#183; 4 retries</text>

  <!-- Marquee host -->
  <rect x="430" y="56" width="286" height="440" rx="8" fill="#1c2118" stroke="#757d5e"/>
  <text x="450" y="82" fill="#92df62" font-size="13" font-weight="700" font-family="IBM Plex Sans, sans-serif">Marquee (Docker host)</text>
  <text x="450" y="100" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">a managed base directory on the host</text>

  <!-- playground dir -->
  <rect x="450" y="112" width="246" height="232" rx="6" fill="#20251a" stroke="#545c42"/>
  <text x="464" y="132" fill="#f3f0e0" font-size="11.5" font-family="IBM Plex Sans, sans-serif">the per-environment directory</text>

  <rect x="466" y="142" width="214" height="28" rx="4" fill="#252a1e" stroke="#434a35"/>
  <text x="476" y="160" fill="#abe87f" font-size="11" font-family="JetBrains Mono, monospace">compose.yml</text>

  <rect x="466" y="174" width="214" height="28" rx="4" fill="#252a1e" stroke="#434a35"/>
  <text x="476" y="192" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">a Docker credentials file</text>

  <rect x="466" y="206" width="214" height="28" rx="4" fill="#252a1e" stroke="#434a35"/>
  <text x="476" y="224" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">the cloned prop source</text>

  <rect x="466" y="238" width="214" height="28" rx="4" fill="#252a1e" stroke="#434a35"/>
  <text x="476" y="256" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">an owner marker</text>

  <rect x="466" y="270" width="214" height="28" rx="4" fill="#252a1e" stroke="#434a35"/>
  <text x="476" y="288" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">bring-up markers and logs</text>

  <text x="464" y="322" fill="#a19f89" font-size="10.5" font-family="IBM Plex Sans, sans-serif">siblings: builds, hosts, playspecs, agents</text>

  <!-- the run -->
  <rect x="450" y="356" width="246" height="60" rx="6" fill="#1c241a" stroke="#5cb43a" stroke-width="2"/>
  <text x="573" y="380" text-anchor="middle" fill="#abe87f" font-size="11" font-weight="700" font-family="JetBrains Mono, monospace">docker compose -p &#171;project&#187;</text>
  <text x="573" y="398" text-anchor="middle" fill="#abe87f" font-size="11" font-weight="700" font-family="JetBrains Mono, monospace">-f compose.yml up -d</text>
  <text x="573" y="411" text-anchor="middle" fill="#a19f89" font-size="9.5" font-family="IBM Plex Sans, sans-serif">--remove-orphans --pull missing</text>

  <!-- arrow compose -> run -->
  <line x1="573" y1="298" x2="573" y2="354" stroke="#5cb43a" stroke-width="2" marker-end="url(#hc-arrow)"/>

  <!-- readiness -->
  <rect x="450" y="428" width="246" height="56" rx="6" fill="#20251a" stroke="#434a35"/>
  <text x="573" y="450" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">poll health every 2s, up to 90s</text>
  <text x="573" y="470" text-anchor="middle" fill="#92df62" font-size="11" font-weight="700" font-family="IBM Plex Sans, sans-serif">healthy &#8594; mark running</text>

  <line x1="573" y1="416" x2="573" y2="426" stroke="#5cb43a" stroke-width="2" marker-end="url(#hc-arrow)"/>

  <!-- project dir note -->
  <text x="24" y="280" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">No --project-directory:</text>
  <text x="24" y="298" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">the compose file's own dir</text>
  <text x="24" y="316" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">is the project dir, so a</text>
  <text x="24" y="334" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">relative source path</text>
  <text x="24" y="352" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">resolves on the host.</text>

  <text x="24" y="392" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">DOCKER_CONFIG points at the</text>
  <text x="24" y="410" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">credentials dir, so pulls</text>
  <text x="24" y="428" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">use the merged creds.</text>
</svg>
