<svg viewBox="0 0 740 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="TLS bootstrap sequence: Traefik comes up, requests a wildcard cert from ZeroSSL over acme-dns, and the marquee only flips to active after a verified HTTPS probe succeeds">
  <defs>
    <marker id="arrowDown" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto">
      <path d="M1,1 L5,8 L9,1" fill="none" stroke="#79d44e" stroke-width="1.6"/>
    </marker>
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto">
      <path d="M1,1 L5,8 L9,1" fill="none" stroke="#eec854" stroke-width="1.6"/>
    </marker>
  </defs>

  <text x="20" y="30" fill="#f3f0e0" font-size="17" font-weight="700" font-family="IBM Plex Sans, sans-serif">TLS bootstrap: verify before trust</text>
  <text x="20" y="50" fill="#a19f89" font-size="12" font-family="IBM Plex Sans, sans-serif">TLS bootstrap &#183; runs after the deploy webhook lands</text>

  <!-- Step 1 -->
  <rect x="60" y="66" width="620" height="50" rx="6" fill="#20251a" stroke="#434a35"/>
  <text x="80" y="90" fill="#92df62" font-size="13" font-weight="700" font-family="JetBrains Mono, monospace">1 &#183; bring Traefik up</text>
  <text x="80" y="108" fill="#c7c4ae" font-size="11.5" font-family="IBM Plex Sans, sans-serif">render compose &#183; rsync to the host &#183; bring Traefik up with the acme-dns + ZeroSSL EAB resolver</text>
  <line x1="370" y1="116" x2="370" y2="134" stroke="#79d44e" stroke-width="1.6" marker-end="url(#arrowDown)"/>

  <!-- Step 2 -->
  <rect x="60" y="136" width="620" height="50" rx="6" fill="#20251a" stroke="#434a35"/>
  <text x="80" y="160" fill="#92df62" font-size="13" font-weight="700" font-family="JetBrains Mono, monospace">2 &#183; cert-warmup router asks for *.domain</text>
  <text x="80" y="178" fill="#c7c4ae" font-size="11.5" font-family="IBM Plex Sans, sans-serif">main = domain &#183; SAN = *.domain &#8594; one wildcard order, all subdomains</text>
  <line x1="370" y1="186" x2="370" y2="204" stroke="#79d44e" stroke-width="1.6" marker-end="url(#arrowDown)"/>

  <!-- Step 3 -->
  <rect x="60" y="206" width="620" height="50" rx="6" fill="#20251a" stroke="#434a35"/>
  <text x="80" y="230" fill="#eec854" font-size="13" font-weight="700" font-family="JetBrains Mono, monospace">3 &#183; ZeroSSL DV90 over DNS-01 (acme-dns)</text>
  <text x="80" y="248" fill="#c7c4ae" font-size="11.5" font-family="IBM Plex Sans, sans-serif">EAB binds the order to our account &#183; acme-dns answers the _acme-challenge TXT record</text>
  <line x1="370" y1="256" x2="370" y2="274" stroke="#eec854" stroke-width="1.6" marker-end="url(#arrowGold)"/>

  <!-- Step 4 -->
  <rect x="60" y="276" width="620" height="56" rx="6" fill="#20251a" stroke="#545c42"/>
  <text x="80" y="300" fill="#56d8c0" font-size="13" font-weight="700" font-family="JetBrains Mono, monospace">4 &#183; readiness probe</text>
  <text x="80" y="318" fill="#c7c4ae" font-size="11.5" font-family="IBM Plex Sans, sans-serif">verified HTTPS GET to tls-probe-&lt;id&gt;.domain &#183; full peer + hostname verification</text>
  <line x1="240" y1="332" x2="240" y2="356" stroke="#79d44e" stroke-width="1.6" marker-end="url(#arrowDown)"/>
  <line x1="500" y1="332" x2="500" y2="356" stroke="#f08760" stroke-width="1.6" marker-end="url(#arrowDown)"/>

  <!-- ready branch -->
  <rect x="60" y="358" width="300" height="58" rx="6" fill="#20251a" stroke="#5cb43a"/>
  <text x="210" y="382" text-anchor="middle" fill="#92df62" font-size="13" font-weight="700" font-family="JetBrains Mono, monospace">ready &#8594; promote the Marquee</text>
  <text x="210" y="402" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">marked active &#183; provisioning finished</text>

  <!-- not ready branch -->
  <rect x="380" y="358" width="300" height="58" rx="6" fill="#20251a" stroke="#f08760"/>
  <text x="530" y="382" text-anchor="middle" fill="#f08760" font-size="13" font-weight="700" font-family="JetBrains Mono, monospace">not ready &#8594; retry w/ backoff</text>
  <text x="530" y="402" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">5,5,10..60s &#183; 15 tries &#183; then error/failed</text>

  <text x="370" y="448" text-anchor="middle" fill="#a19f89" font-size="11.5" font-family="IBM Plex Sans, sans-serif">The marquee never serves traffic on a cert it could not itself verify over the wire.</text>
</svg>
