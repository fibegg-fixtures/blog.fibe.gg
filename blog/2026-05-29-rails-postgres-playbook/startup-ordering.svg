<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Startup ordering: Postgres and Redis must reach a healthy state, then the one-shot setup service runs migrations and exits zero, then web and jobs are allowed to start">
  <defs>
    <marker id="arrSO" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#79d44e"/>
    </marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" fill="#f3f0e0" font-size="17" font-weight="700" font-family="IBM Plex Sans, sans-serif">Startup ordering with depends_on conditions</text>

  <!-- Stage 1: datastores -->
  <rect x="36" y="64" width="180" height="180" rx="8" fill="none" stroke="#434a35"/>
  <text x="126" y="84" text-anchor="middle" fill="#a19f89" font-size="11" font-family="JetBrains Mono, monospace">1 &#183; reach healthy</text>

  <rect x="56" y="100" width="140" height="52" rx="6" fill="#20251a" stroke="#56d8c0"/>
  <text x="126" y="121" text-anchor="middle" fill="#56d8c0" font-size="13" font-weight="700" font-family="JetBrains Mono, monospace">postgres</text>
  <text x="126" y="139" text-anchor="middle" fill="#a19f89" font-size="10" font-family="JetBrains Mono, monospace">pg_isready</text>

  <rect x="56" y="166" width="140" height="52" rx="6" fill="#20251a" stroke="#56d8c0"/>
  <text x="126" y="187" text-anchor="middle" fill="#56d8c0" font-size="13" font-weight="700" font-family="JetBrains Mono, monospace">redis</text>
  <text x="126" y="205" text-anchor="middle" fill="#a19f89" font-size="10" font-family="JetBrains Mono, monospace">redis-cli ping</text>

  <!-- Stage 2: setup -->
  <rect x="270" y="64" width="180" height="180" rx="8" fill="none" stroke="#434a35"/>
  <text x="360" y="84" text-anchor="middle" fill="#a19f89" font-size="11" font-family="JetBrains Mono, monospace">2 &#183; complete &amp; exit 0</text>

  <rect x="290" y="120" width="140" height="76" rx="6" fill="#252a1e" stroke="#eec854"/>
  <text x="360" y="147" text-anchor="middle" fill="#eec854" font-size="13" font-weight="700" font-family="JetBrains Mono, monospace">setup</text>
  <text x="360" y="166" text-anchor="middle" fill="#a19f89" font-size="10" font-family="JetBrains Mono, monospace">db:prepare</text>
  <text x="360" y="181" text-anchor="middle" fill="#a19f89" font-size="10" font-family="JetBrains Mono, monospace">assets:precompile</text>

  <!-- Stage 3: web + jobs -->
  <rect x="504" y="64" width="180" height="180" rx="8" fill="none" stroke="#434a35"/>
  <text x="594" y="84" text-anchor="middle" fill="#a19f89" font-size="11" font-family="JetBrains Mono, monospace">3 &#183; start</text>

  <rect x="524" y="100" width="140" height="52" rx="6" fill="#20251a" stroke="#79d44e" stroke-width="2"/>
  <text x="594" y="121" text-anchor="middle" fill="#92df62" font-size="13" font-weight="700" font-family="JetBrains Mono, monospace">web</text>
  <text x="594" y="139" text-anchor="middle" fill="#a19f89" font-size="10" font-family="JetBrains Mono, monospace">serves traffic</text>

  <rect x="524" y="166" width="140" height="52" rx="6" fill="#20251a" stroke="#545c42"/>
  <text x="594" y="187" text-anchor="middle" fill="#c7c4ae" font-size="13" font-weight="700" font-family="JetBrains Mono, monospace">jobs</text>
  <text x="594" y="205" text-anchor="middle" fill="#a19f89" font-size="10" font-family="JetBrains Mono, monospace">sidekiq</text>

  <!-- arrows stage1 -> stage2 -->
  <line x1="196" y1="126" x2="288" y2="150" stroke="#79d44e" stroke-width="1.6" marker-end="url(#arrSO)"/>
  <line x1="196" y1="192" x2="288" y2="166" stroke="#79d44e" stroke-width="1.6" marker-end="url(#arrSO)"/>

  <!-- arrows stage2 -> stage3 -->
  <line x1="430" y1="150" x2="522" y2="126" stroke="#79d44e" stroke-width="1.6" marker-end="url(#arrSO)"/>
  <line x1="430" y1="166" x2="522" y2="192" stroke="#79d44e" stroke-width="1.6" marker-end="url(#arrSO)"/>

  <!-- condition legend -->
  <text x="226" y="276" text-anchor="middle" fill="#56d8c0" font-size="10.5" font-family="JetBrains Mono, monospace">service_healthy</text>
  <text x="460" y="276" text-anchor="middle" fill="#eec854" font-size="10.5" font-family="JetBrains Mono, monospace">service_completed_successfully</text>

  <text x="360" y="304" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">Each condition needs a real healthcheck (stage 1) or a clean exit 0 (stage 2) to fire.</text>
</svg>
