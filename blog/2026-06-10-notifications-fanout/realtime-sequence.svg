<svg viewBox="0 0 740 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Real-time update sequence: a domain event triggers a notification, the server renders the toast component to HTML, pushes a Turbo Stream append over the player's channel, and the browser's Turbo runtime applies the DOM operation without a page reload.">
  <defs>
    <marker id="seq-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L8,5 L0,9 Z" fill="#79d44e"/>
    </marker>
  </defs>

  <text x="370" y="28" text-anchor="middle" fill="#f3f0e0" font-size="17" font-weight="700" font-family="IBM Plex Sans, sans-serif">From event to DOM, no reload</text>

  <!-- Lanes -->
  <text x="160" y="62" text-anchor="middle" fill="#92df62" font-size="12.5" font-weight="700" font-family="IBM Plex Sans, sans-serif">SERVER (Rails)</text>
  <text x="560" y="62" text-anchor="middle" fill="#56d8c0" font-size="12.5" font-weight="700" font-family="IBM Plex Sans, sans-serif">BROWSER</text>

  <line x1="160" y1="72" x2="160" y2="350" stroke="#434a35" stroke-width="1.5"/>
  <line x1="560" y1="72" x2="560" y2="350" stroke="#434a35" stroke-width="1.5"/>

  <!-- Step 1 -->
  <circle cx="160" cy="100" r="13" fill="#252a1e" stroke="#79d44e"/>
  <text x="160" y="105" text-anchor="middle" fill="#92df62" font-size="12" font-weight="700" font-family="JetBrains Mono, monospace">1</text>
  <rect x="200" y="84" width="320" height="34" rx="5" fill="#20251a" stroke="#545c42"/>
  <text x="212" y="105" fill="#c7c4ae" font-size="11.5" font-family="IBM Plex Sans, sans-serif">Domain event &#8594; raise a notification</text>

  <!-- Step 2 -->
  <circle cx="160" cy="152" r="13" fill="#252a1e" stroke="#79d44e"/>
  <text x="160" y="157" text-anchor="middle" fill="#92df62" font-size="12" font-weight="700" font-family="JetBrains Mono, monospace">2</text>
  <rect x="200" y="136" width="320" height="34" rx="5" fill="#20251a" stroke="#545c42"/>
  <text x="212" y="157" fill="#c7c4ae" font-size="11.5" font-family="IBM Plex Sans, sans-serif">render toast component &#8594; HTML string</text>

  <!-- Step 3: the stream crossing -->
  <circle cx="160" cy="208" r="13" fill="#252a1e" stroke="#79d44e"/>
  <text x="160" y="213" text-anchor="middle" fill="#92df62" font-size="12" font-weight="700" font-family="JetBrains Mono, monospace">3</text>
  <line x1="175" y1="208" x2="545" y2="208" stroke="#79d44e" stroke-width="2" marker-end="url(#seq-arrow)"/>
  <rect x="248" y="184" width="224" height="20" rx="4" fill="#252a1e" stroke="#79d44e"/>
  <text x="360" y="198" text-anchor="middle" fill="#abe87f" font-size="10.5" font-family="JetBrains Mono, monospace">Turbo Stream: append</text>
  <text x="360" y="226" text-anchor="middle" fill="#a19f89" font-size="9.5" font-family="IBM Plex Sans, sans-serif">over the player's private channel &#183; ActionCable</text>

  <!-- Step 4 browser -->
  <circle cx="560" cy="262" r="13" fill="#252a1e" stroke="#56d8c0"/>
  <text x="560" y="267" text-anchor="middle" fill="#56d8c0" font-size="12" font-weight="700" font-family="JetBrains Mono, monospace">4</text>
  <rect x="248" y="246" width="300" height="34" rx="5" fill="#20251a" stroke="#56d8c0"/>
  <text x="398" y="267" text-anchor="middle" fill="#c7c4ae" font-size="11.5" font-family="IBM Plex Sans, sans-serif">Turbo runtime applies the DOM op</text>

  <!-- Step 5 -->
  <circle cx="560" cy="314" r="13" fill="#252a1e" stroke="#56d8c0"/>
  <text x="560" y="319" text-anchor="middle" fill="#56d8c0" font-size="12" font-weight="700" font-family="JetBrains Mono, monospace">5</text>
  <rect x="248" y="298" width="300" height="34" rx="5" fill="#20251a" stroke="#56d8c0"/>
  <text x="398" y="319" text-anchor="middle" fill="#abe87f" font-size="11.5" font-family="IBM Plex Sans, sans-serif">toast appended to the toast container</text>

  <text x="370" y="362" text-anchor="middle" fill="#757d5e" font-size="10.5" font-family="IBM Plex Sans, sans-serif">Same view component renders the first paint and every live update &#183; one source of markup</text>
</svg>
