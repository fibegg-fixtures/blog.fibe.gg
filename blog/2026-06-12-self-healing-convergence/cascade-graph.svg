<svg viewBox="0 0 740 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cascade graph: solid arrows are real lifecycle edges (Marquee down quiesces chats, destroy cascades, API-key revoke redeploys); dashed arrows are deliberately-absent edges (Prop disable does not stop playgrounds, team revoke does not kill sessions).">
  <defs>
    <marker id="cg-solid" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#79d44e"/>
    </marker>
    <marker id="cg-gold" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#eec854"/>
    </marker>
    <marker id="cg-no" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#f08760"/>
    </marker>
  </defs>

  <text x="370" y="26" text-anchor="middle" fill="#f3f0e0" font-size="17" font-weight="700" font-family="IBM Plex Sans, sans-serif">What cascades &#8212; and what deliberately doesn't</text>

  <!-- Marquee node -->
  <rect x="296" y="56" width="148" height="50" rx="8" fill="#252a1e" stroke="#eec854"/>
  <text x="370" y="80" text-anchor="middle" fill="#eec854" font-size="13" font-weight="700" font-family="IBM Plex Sans, sans-serif">Marquee</text>
  <text x="370" y="96" text-anchor="middle" fill="#a19f89" font-size="10" font-family="IBM Plex Sans, sans-serif">unavailable / destroyed</text>

  <!-- AgentChat -->
  <rect x="60" y="180" width="148" height="50" rx="8" fill="#20251a" stroke="#5cb43a"/>
  <text x="134" y="204" text-anchor="middle" fill="#92df62" font-size="13" font-weight="700" font-family="IBM Plex Sans, sans-serif">AgentChat</text>
  <text x="134" y="220" text-anchor="middle" fill="#a19f89" font-size="10" font-family="IBM Plex Sans, sans-serif">quiesced &#8594; stopped</text>

  <!-- Playground -->
  <rect x="296" y="180" width="148" height="50" rx="8" fill="#20251a" stroke="#5cb43a"/>
  <text x="370" y="204" text-anchor="middle" fill="#92df62" font-size="13" font-weight="700" font-family="IBM Plex Sans, sans-serif">Playground</text>
  <text x="370" y="220" text-anchor="middle" fill="#a19f89" font-size="10" font-family="IBM Plex Sans, sans-serif">blocks destroy</text>

  <!-- Build records -->
  <rect x="532" y="180" width="148" height="50" rx="8" fill="#20251a" stroke="#5cb43a"/>
  <text x="606" y="204" text-anchor="middle" fill="#92df62" font-size="13" font-weight="700" font-family="IBM Plex Sans, sans-serif">Build records</text>
  <text x="606" y="220" text-anchor="middle" fill="#a19f89" font-size="10" font-family="IBM Plex Sans, sans-serif">cascade destroy</text>

  <!-- Prop -->
  <rect x="60" y="320" width="148" height="50" rx="8" fill="#20251a" stroke="#56d8c0"/>
  <text x="134" y="344" text-anchor="middle" fill="#56d8c0" font-size="13" font-weight="700" font-family="IBM Plex Sans, sans-serif">Prop disable</text>
  <text x="134" y="360" text-anchor="middle" fill="#a19f89" font-size="10" font-family="IBM Plex Sans, sans-serif">status flip only</text>

  <!-- Team role -->
  <rect x="296" y="320" width="148" height="50" rx="8" fill="#20251a" stroke="#56d8c0"/>
  <text x="370" y="344" text-anchor="middle" fill="#56d8c0" font-size="13" font-weight="700" font-family="IBM Plex Sans, sans-serif">Team revoke</text>
  <text x="370" y="360" text-anchor="middle" fill="#a19f89" font-size="10" font-family="IBM Plex Sans, sans-serif">access computed live</text>

  <!-- API key -->
  <rect x="532" y="320" width="148" height="50" rx="8" fill="#20251a" stroke="#56d8c0"/>
  <text x="606" y="344" text-anchor="middle" fill="#56d8c0" font-size="13" font-weight="700" font-family="IBM Plex Sans, sans-serif">API-key revoke</text>
  <text x="606" y="360" text-anchor="middle" fill="#a19f89" font-size="10" font-family="IBM Plex Sans, sans-serif">clear &#8594; redeploy</text>

  <!-- SOLID: Marquee -> AgentChat (quiesce) -->
  <line x1="300" y1="98" x2="160" y2="178" stroke="#79d44e" stroke-width="1.8" marker-end="url(#cg-solid)"/>
  <text x="196" y="138" fill="#92df62" font-size="10" font-family="IBM Plex Sans, sans-serif">quiesce</text>

  <!-- SOLID: Marquee -> Playground (restrict) -->
  <line x1="370" y1="106" x2="370" y2="178" stroke="#eec854" stroke-width="1.8" marker-end="url(#cg-gold)"/>
  <text x="378" y="146" fill="#eec854" font-size="10" font-family="IBM Plex Sans, sans-serif">restrict</text>

  <!-- SOLID: Marquee -> Build (destroy) -->
  <line x1="440" y1="98" x2="580" y2="178" stroke="#79d44e" stroke-width="1.8" marker-end="url(#cg-solid)"/>
  <text x="520" y="138" fill="#92df62" font-size="10" font-family="IBM Plex Sans, sans-serif">destroy</text>

  <!-- SOLID: API key -> AgentChat (redeploy most recent) -->
  <path d="M532 338 C 360 290, 240 250, 210 222" fill="none" stroke="#79d44e" stroke-width="1.6" marker-end="url(#cg-solid)"/>
  <text x="430" y="284" fill="#92df62" font-size="10" font-family="IBM Plex Sans, sans-serif">redeploy newest chat</text>

  <!-- NO-EDGE: Prop -> Playground (dashed) -->
  <line x1="208" y1="338" x2="296" y2="224" stroke="#f08760" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#cg-no)"/>
  <text x="206" y="290" fill="#f08760" font-size="10" font-family="IBM Plex Sans, sans-serif">no stop</text>

  <!-- NO-EDGE: Team -> Playground (dashed) -->
  <line x1="370" y1="320" x2="370" y2="234" stroke="#f08760" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#cg-no)"/>
  <text x="378" y="278" fill="#f08760" font-size="10" font-family="IBM Plex Sans, sans-serif">no kill</text>

  <!-- legend -->
  <line x1="60" y1="398" x2="92" y2="398" stroke="#79d44e" stroke-width="1.8"/>
  <text x="100" y="402" fill="#c7c4ae" font-size="10.5" font-family="IBM Plex Sans, sans-serif">real cascade</text>
  <line x1="220" y1="398" x2="252" y2="398" stroke="#f08760" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="260" y="402" fill="#c7c4ae" font-size="10.5" font-family="IBM Plex Sans, sans-serif">edge that deliberately does NOT exist</text>
</svg>
