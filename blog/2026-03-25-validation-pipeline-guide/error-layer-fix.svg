<svg viewBox="0 0 740 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A lookup table mapping common Fibe error messages to the validation layer that emits them and the smallest fix for each.">
  <text x="370" y="26" text-anchor="middle" fill="#f3f0e0" font-size="16" font-weight="700" font-family="IBM Plex Sans, sans-serif">Read the error &#8594; find the layer &#8594; apply the fix</text>

  <!-- header -->
  <rect x="20" y="42" width="300" height="30" rx="4" fill="#252a1e" stroke="#545c42"/>
  <rect x="324" y="42" width="100" height="30" rx="4" fill="#252a1e" stroke="#545c42"/>
  <rect x="428" y="42" width="292" height="30" rx="4" fill="#252a1e" stroke="#545c42"/>
  <text x="34" y="62" fill="#f5da79" font-size="12" font-weight="700" font-family="IBM Plex Sans, sans-serif">error substring</text>
  <text x="374" y="62" text-anchor="middle" fill="#f5da79" font-size="12" font-weight="700" font-family="IBM Plex Sans, sans-serif">layer</text>
  <text x="442" y="62" fill="#f5da79" font-size="12" font-weight="700" font-family="IBM Plex Sans, sans-serif">smallest fix</text>

  <!-- rows -->
  <!-- row 1 -->
  <text x="34" y="92" fill="#c7c4ae" font-size="10.5" font-family="JetBrains Mono, monospace">unknown label '...'</text>
  <rect x="350" y="80" width="48" height="20" rx="9" fill="#20251a" stroke="#eec854"/>
  <text x="374" y="94" text-anchor="middle" fill="#f5da79" font-size="11" font-weight="700" font-family="JetBrains Mono, monospace">3</text>
  <text x="442" y="92" fill="#c7c4ae" font-size="10.5" font-family="IBM Plex Sans, sans-serif">fix the spelling or remove the label</text>
  <line x1="20" y1="104" x2="720" y2="104" stroke="#434a35" stroke-width="0.75"/>

  <!-- row 2 -->
  <text x="34" y="124" fill="#c7c4ae" font-size="10.5" font-family="JetBrains Mono, monospace">build directive but lacks repo_url</text>
  <rect x="350" y="112" width="48" height="20" rx="9" fill="#20251a" stroke="#eec854"/>
  <text x="374" y="126" text-anchor="middle" fill="#f5da79" font-size="11" font-weight="700" font-family="JetBrains Mono, monospace">4</text>
  <text x="442" y="124" fill="#c7c4ae" font-size="10.5" font-family="IBM Plex Sans, sans-serif">add fibe.gg/repo_url to the service</text>
  <line x1="20" y1="136" x2="720" y2="136" stroke="#434a35" stroke-width="0.75"/>

  <!-- row 3 -->
  <text x="34" y="156" fill="#c7c4ae" font-size="10.5" font-family="JetBrains Mono, monospace">zerodowntime cannot have 'ports'</text>
  <rect x="350" y="144" width="48" height="20" rx="9" fill="#20251a" stroke="#eec854"/>
  <text x="374" y="158" text-anchor="middle" fill="#f5da79" font-size="11" font-weight="700" font-family="JetBrains Mono, monospace">4</text>
  <text x="442" y="156" fill="#c7c4ae" font-size="10.5" font-family="IBM Plex Sans, sans-serif">drop ports:, reach via fibe.gg/port</text>
  <line x1="20" y1="168" x2="720" y2="168" stroke="#434a35" stroke-width="0.75"/>

  <!-- row 4 -->
  <text x="34" y="188" fill="#c7c4ae" font-size="10.5" font-family="JetBrains Mono, monospace">referenced but not declared</text>
  <rect x="350" y="176" width="48" height="20" rx="9" fill="#20251a" stroke="#eec854"/>
  <text x="374" y="190" text-anchor="middle" fill="#f5da79" font-size="11" font-weight="700" font-family="JetBrains Mono, monospace">5</text>
  <text x="442" y="188" fill="#c7c4ae" font-size="10.5" font-family="IBM Plex Sans, sans-serif">declare NAME under x-fibe.gg.variables</text>
  <line x1="20" y1="200" x2="720" y2="200" stroke="#434a35" stroke-width="0.75"/>

  <!-- row 5 -->
  <text x="34" y="220" fill="#c7c4ae" font-size="10.5" font-family="JetBrains Mono, monospace">default must be a literal</text>
  <rect x="350" y="208" width="48" height="20" rx="9" fill="#20251a" stroke="#eec854"/>
  <text x="374" y="222" text-anchor="middle" fill="#f5da79" font-size="11" font-weight="700" font-family="JetBrains Mono, monospace">5</text>
  <text x="442" y="220" fill="#c7c4ae" font-size="10.5" font-family="IBM Plex Sans, sans-serif">remove $$var__ token from the default</text>
  <line x1="20" y1="232" x2="720" y2="232" stroke="#434a35" stroke-width="0.75"/>

  <!-- row 6 -->
  <text x="34" y="252" fill="#c7c4ae" font-size="10.5" font-family="JetBrains Mono, monospace">Variable '...' is required</text>
  <rect x="350" y="240" width="48" height="20" rx="9" fill="#20251a" stroke="#f08760"/>
  <text x="374" y="254" text-anchor="middle" fill="#f08760" font-size="11" font-weight="700" font-family="JetBrains Mono, monospace">6</text>
  <text x="442" y="252" fill="#c7c4ae" font-size="10.5" font-family="IBM Plex Sans, sans-serif">supply value, add default, or random:true</text>
  <line x1="20" y1="264" x2="720" y2="264" stroke="#434a35" stroke-width="0.75"/>

  <!-- row 7 -->
  <text x="34" y="284" fill="#c7c4ae" font-size="10.5" font-family="JetBrains Mono, monospace">fails validation pattern ...</text>
  <rect x="350" y="272" width="48" height="20" rx="9" fill="#20251a" stroke="#f08760"/>
  <text x="374" y="286" text-anchor="middle" fill="#f08760" font-size="11" font-weight="700" font-family="JetBrains Mono, monospace">6</text>
  <text x="442" y="284" fill="#c7c4ae" font-size="10.5" font-family="IBM Plex Sans, sans-serif">correct the value or loosen the regex</text>
  <line x1="20" y1="296" x2="720" y2="296" stroke="#434a35" stroke-width="0.75"/>

  <!-- row 8 -->
  <text x="34" y="316" fill="#c7c4ae" font-size="10.5" font-family="JetBrains Mono, monospace">prop_id ... not found</text>
  <rect x="350" y="304" width="48" height="20" rx="9" fill="#20251a" stroke="#f08760"/>
  <text x="374" y="318" text-anchor="middle" fill="#f08760" font-size="11" font-weight="700" font-family="JetBrains Mono, monospace">7</text>
  <text x="442" y="316" fill="#c7c4ae" font-size="10.5" font-family="IBM Plex Sans, sans-serif">re-point to a Prop you own</text>

  <text x="34" y="346" fill="#a19f89" font-size="10" font-family="IBM Plex Sans, sans-serif">gold = caught by static validation (fibe_schema) &#183; ember = only the compiler or runtime sees it</text>
</svg>
