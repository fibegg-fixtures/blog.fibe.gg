<svg viewBox="0 0 740 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Build identity: a build record is keyed by prop, service, branch, commit and a build identity digest, giving one image per commit">
  <defs>
    <marker id="bi-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#757d5e"/>
    </marker>
  </defs>

  <text x="370" y="28" text-anchor="middle" fill="#f3f0e0" font-size="17" font-weight="700" font-family="IBM Plex Sans, sans-serif">One build per commit, addressed by identity</text>

  <!-- the key tuple -->
  <rect x="40" y="58" width="660" height="92" rx="10" fill="#20251a" stroke="#545c42"/>
  <text x="60" y="82" fill="#a19f89" font-size="12" font-family="IBM Plex Sans, sans-serif">the lookup key</text>

  <g font-family="JetBrains Mono, monospace" font-size="12">
    <rect x="60" y="96" width="120" height="38" rx="6" fill="#252a1e" stroke="#757d5e"/>
    <text x="120" y="113" text-anchor="middle" fill="#c7c4ae" font-size="10">prop</text>
    <text x="120" y="128" text-anchor="middle" fill="#92df62">owner</text>

    <rect x="192" y="96" width="120" height="38" rx="6" fill="#252a1e" stroke="#757d5e"/>
    <text x="252" y="113" text-anchor="middle" fill="#c7c4ae" font-size="10">service</text>
    <text x="252" y="128" text-anchor="middle" fill="#92df62">web</text>

    <rect x="324" y="96" width="120" height="38" rx="6" fill="#252a1e" stroke="#757d5e"/>
    <text x="384" y="113" text-anchor="middle" fill="#c7c4ae" font-size="10">branch</text>
    <text x="384" y="128" text-anchor="middle" fill="#92df62">main</text>

    <rect x="456" y="96" width="120" height="38" rx="6" fill="#252a1e" stroke="#eec854"/>
    <text x="516" y="113" text-anchor="middle" fill="#c7c4ae" font-size="10">commit</text>
    <text x="516" y="128" text-anchor="middle" fill="#eec854">a1b2c3d</text>

    <rect x="588" y="96" width="96" height="38" rx="6" fill="#252a1e" stroke="#56d8c0"/>
    <text x="636" y="113" text-anchor="middle" fill="#c7c4ae" font-size="9">identity digest</text>
    <text x="636" y="128" text-anchor="middle" fill="#56d8c0" font-size="11">dockerfile +</text>
  </g>
  <text x="636" y="146" text-anchor="middle" fill="#56d8c0" font-size="10" font-family="JetBrains Mono, monospace">target + args</text>

  <!-- arrow down -->
  <line x1="370" y1="150" x2="370" y2="186" stroke="#757d5e" stroke-width="2" marker-end="url(#bi-arrow)"/>
  <text x="430" y="172" text-anchor="middle" fill="#a19f89" font-size="10" font-family="IBM Plex Sans, sans-serif">resolves to exactly one record</text>

  <!-- the build record -->
  <rect x="200" y="192" width="340" height="58" rx="10" fill="#20251a" stroke="#5cb43a"/>
  <text x="370" y="216" text-anchor="middle" fill="#92df62" font-size="13" font-weight="700" font-family="JetBrains Mono, monospace">build record</text>
  <text x="370" y="236" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">one row, one image, one truth</text>

  <!-- arrow to image -->
  <line x1="370" y1="250" x2="370" y2="284" stroke="#757d5e" stroke-width="2" marker-end="url(#bi-arrow)"/>

  <!-- the image -->
  <rect x="200" y="290" width="340" height="56" rx="10" fill="#20251a" stroke="#545c42"/>
  <text x="370" y="312" text-anchor="middle" fill="#f3f0e0" font-size="12" font-weight="700" font-family="JetBrains Mono, monospace">docker image</text>
  <text x="370" y="331" text-anchor="middle" fill="#56d8c0" font-size="10" font-family="JetBrains Mono, monospace">commit stamped into the image: a1b2c3d</text>

  <!-- side note: same commit -> same key -> dedup -->
  <rect x="40" y="290" width="140" height="56" rx="8" fill="#252a1e" stroke="#757d5e"/>
  <text x="110" y="312" text-anchor="middle" fill="#c7c4ae" font-size="10" font-family="IBM Plex Sans, sans-serif">same commit</text>
  <text x="110" y="328" text-anchor="middle" fill="#c7c4ae" font-size="10" font-family="IBM Plex Sans, sans-serif">&#8594; same key</text>
  <text x="110" y="342" text-anchor="middle" fill="#92df62" font-size="10" font-family="IBM Plex Sans, sans-serif">no rebuild</text>

  <rect x="560" y="290" width="140" height="56" rx="8" fill="#252a1e" stroke="#757d5e"/>
  <text x="630" y="312" text-anchor="middle" fill="#c7c4ae" font-size="10" font-family="IBM Plex Sans, sans-serif">new commit</text>
  <text x="630" y="328" text-anchor="middle" fill="#c7c4ae" font-size="10" font-family="IBM Plex Sans, sans-serif">&#8594; new key</text>
  <text x="630" y="342" text-anchor="middle" fill="#eec854" font-size="10" font-family="IBM Plex Sans, sans-serif">new record</text>
</svg>
