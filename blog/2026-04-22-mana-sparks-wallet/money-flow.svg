<svg viewBox="0 0 740 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Money flow: three payment providers behind one subscription mint Mana, which either spends on tutorial marquees or converts one-way to Sparks; daily funding debits the wallet to extend the paid-through time or opens a grace incident">
  <defs>
    <marker id="mf-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#757d5e"/>
    </marker>
  </defs>

  <text x="370" y="26" text-anchor="middle" fill="#f3f0e0" font-size="16" font-weight="700" font-family="IBM Plex Sans, sans-serif">From a card swipe to a funded compute day</text>

  <!-- providers -->
  <rect x="24" y="50" width="170" height="84" rx="8" fill="#20251a" stroke="#545c42"/>
  <text x="109" y="74" text-anchor="middle" fill="#f3f0e0" font-size="12" font-weight="700" font-family="IBM Plex Sans, sans-serif">Stripe &#183; Creem &#183; Paddle</text>
  <text x="109" y="94" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">3 providers, one</text>
  <text x="109" y="110" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">subscription</text>
  <text x="109" y="126" text-anchor="middle" fill="#a19f89" font-size="10" font-family="IBM Plex Sans, sans-serif">claim-once webhooks</text>

  <line x1="194" y1="92" x2="250" y2="92" stroke="#757d5e" stroke-width="2" marker-end="url(#mf-arrow)"/>

  <!-- Mana wallet -->
  <rect x="252" y="50" width="200" height="84" rx="8" fill="#20251a" stroke="#e2b33a" stroke-width="1.5"/>
  <text x="352" y="76" text-anchor="middle" fill="#eec854" font-size="14" font-weight="700" font-family="JetBrains Mono, monospace">Mana wallet</text>
  <text x="352" y="98" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">minted: checkout &#183; recharge</text>
  <text x="352" y="114" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">&#183; grants</text>

  <!-- referrals -->
  <rect x="512" y="50" width="204" height="84" rx="8" fill="#20251a" stroke="#92df62" stroke-width="1.5"/>
  <text x="614" y="76" text-anchor="middle" fill="#92df62" font-size="14" font-weight="700" font-family="JetBrains Mono, monospace">Sparks wallet</text>
  <text x="614" y="98" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">funded: convert from Mana</text>
  <text x="614" y="114" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">&#183; referral rewards</text>

  <line x1="452" y1="84" x2="510" y2="84" stroke="#92df62" stroke-width="2" marker-end="url(#mf-arrow)"/>
  <text x="481" y="76" text-anchor="middle" fill="#92df62" font-size="9" font-family="IBM Plex Sans, sans-serif">one way</text>

  <!-- spend tutorial -->
  <line x1="320" y1="134" x2="320" y2="176" stroke="#757d5e" stroke-width="2" marker-end="url(#mf-arrow)"/>
  <rect x="208" y="178" width="224" height="56" rx="6" fill="#252a1e" stroke="#545c42"/>
  <text x="320" y="202" text-anchor="middle" fill="#f3f0e0" font-size="12" font-family="IBM Plex Sans, sans-serif">tutorial purchase &#8594; debit Mana</text>
  <text x="320" y="220" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">provision marquee, set paid-through time</text>

  <!-- funding loop -->
  <line x1="614" y1="134" x2="614" y2="176" stroke="#757d5e" stroke-width="2" marker-end="url(#mf-arrow)"/>
  <rect x="470" y="178" width="246" height="56" rx="6" fill="#252a1e" stroke="#eec854"/>
  <text x="593" y="202" text-anchor="middle" fill="#eec854" font-size="12" font-weight="700" font-family="IBM Plex Sans, sans-serif">daily funding sweep (every few minutes)</text>
  <text x="593" y="220" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">debit day amount &#183; key per marquee/day</text>

  <line x1="593" y1="234" x2="593" y2="272" stroke="#757d5e" stroke-width="2" marker-end="url(#mf-arrow)"/>

  <!-- sufficient -->
  <rect x="438" y="274" width="300" height="52" rx="6" fill="#20251a" stroke="#92df62"/>
  <text x="588" y="296" text-anchor="middle" fill="#92df62" font-size="12" font-weight="700" font-family="IBM Plex Sans, sans-serif">sufficient &#8594; paid through end of service-day</text>
  <text x="588" y="314" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">marquee active &#183; runtime entitled</text>

  <!-- insufficient -->
  <rect x="438" y="338" width="300" height="56" rx="6" fill="#20251a" stroke="#f08760"/>
  <text x="588" y="362" text-anchor="middle" fill="#f08760" font-size="12" font-weight="700" font-family="IBM Plex Sans, sans-serif">insufficient &#8594; insufficient-balance error</text>
  <text x="588" y="380" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">open grace incident &#183; 402 gate trips</text>

  <line x1="588" y1="326" x2="588" y2="336" stroke="#757d5e" stroke-width="1.5"/>

  <!-- tutorial paid-through time leads to runtime too -->
  <line x1="320" y1="234" x2="320" y2="300" stroke="#757d5e" stroke-width="2" marker-end="url(#mf-arrow)"/>
  <rect x="120" y="302" width="200" height="52" rx="6" fill="#20251a" stroke="#545c42"/>
  <text x="220" y="324" text-anchor="middle" fill="#f3f0e0" font-size="12" font-family="IBM Plex Sans, sans-serif">Playgrounds &#183; Tricks</text>
  <text x="220" y="342" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">&#183; AgentChats run</text>
  <line x1="438" y1="300" x2="322" y2="320" stroke="#757d5e" stroke-width="2" marker-end="url(#mf-arrow)"/>
</svg>
