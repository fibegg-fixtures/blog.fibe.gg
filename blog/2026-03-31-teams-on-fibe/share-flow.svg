<svg viewBox="0 0 740 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Flow for sharing a Marquee with a team: owner creates team, invites by handle, member accepts, owner shares Marquee, member launches">
  <defs>
    <marker id="arrShare" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#79d44e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="740" height="300" fill="#20251a" stroke="#434a35" rx="8"/>
  <text x="24" y="32" fill="#f3f0e0" font-size="16" font-weight="700" font-family="IBM Plex Sans, sans-serif">Sharing a Marquee, end to end</text>

  <!-- Step 1 -->
  <rect x="24" y="56" width="160" height="86" rx="6" fill="#252a1e" stroke="#79d44e"/>
  <text x="104" y="84" text-anchor="middle" fill="#92df62" font-size="12.5" font-weight="700" font-family="JetBrains Mono, monospace">1. Create team</text>
  <text x="104" y="106" text-anchor="middle" fill="#c7c4ae" font-size="10.5" font-family="IBM Plex Sans, sans-serif">Owner, web UI</text>
  <text x="104" y="122" text-anchor="middle" fill="#a19f89" font-size="10" font-family="IBM Plex Sans, sans-serif">collaboration on</text>

  <!-- Step 2 -->
  <rect x="216" y="56" width="160" height="86" rx="6" fill="#252a1e" stroke="#eec854"/>
  <text x="296" y="84" text-anchor="middle" fill="#eec854" font-size="12.5" font-weight="700" font-family="JetBrains Mono, monospace">2. Invite</text>
  <text x="296" y="106" text-anchor="middle" fill="#c7c4ae" font-size="10.5" font-family="IBM Plex Sans, sans-serif">by username or</text>
  <text x="296" y="122" text-anchor="middle" fill="#c7c4ae" font-size="10.5" font-family="IBM Plex Sans, sans-serif">GitHub handle</text>

  <!-- Step 3 -->
  <rect x="408" y="56" width="160" height="86" rx="6" fill="#252a1e" stroke="#56d8c0"/>
  <text x="488" y="84" text-anchor="middle" fill="#56d8c0" font-size="12.5" font-weight="700" font-family="JetBrains Mono, monospace">3. Accept</text>
  <text x="488" y="106" text-anchor="middle" fill="#c7c4ae" font-size="10.5" font-family="IBM Plex Sans, sans-serif">invitee joins</text>
  <text x="488" y="122" text-anchor="middle" fill="#a19f89" font-size="10" font-family="IBM Plex Sans, sans-serif">pending &#8594; member</text>

  <!-- Step 4 -->
  <rect x="600" y="56" width="116" height="86" rx="6" fill="#252a1e" stroke="#79d44e"/>
  <text x="658" y="84" text-anchor="middle" fill="#92df62" font-size="12.5" font-weight="700" font-family="JetBrains Mono, monospace">4. Share</text>
  <text x="658" y="106" text-anchor="middle" fill="#c7c4ae" font-size="10.5" font-family="IBM Plex Sans, sans-serif">Marquee into</text>
  <text x="658" y="122" text-anchor="middle" fill="#c7c4ae" font-size="10.5" font-family="IBM Plex Sans, sans-serif">the team</text>

  <!-- arrows between steps -->
  <line x1="184" y1="99" x2="214" y2="99" stroke="#79d44e" stroke-width="2" marker-end="url(#arrShare)"/>
  <line x1="376" y1="99" x2="406" y2="99" stroke="#79d44e" stroke-width="2" marker-end="url(#arrShare)"/>
  <line x1="568" y1="99" x2="598" y2="99" stroke="#79d44e" stroke-width="2" marker-end="url(#arrShare)"/>

  <!-- Result band -->
  <rect x="24" y="178" width="692" height="92" rx="6" fill="#252a1e" stroke="#545c42"/>
  <text x="44" y="206" fill="#92df62" font-size="13" font-weight="700" font-family="JetBrains Mono, monospace">Result &#8594; the shared Marquee appears in every member's list</text>
  <text x="44" y="230" fill="#c7c4ae" font-size="11.5" font-family="IBM Plex Sans, sans-serif">Members launch Playgrounds, run Tricks, target it from CI and schedules &#183; manage-level for all</text>
  <text x="44" y="252" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">Owner still funds it. Unfunded blocks everyone (402 payment required). No team wallet.</text>
</svg>
