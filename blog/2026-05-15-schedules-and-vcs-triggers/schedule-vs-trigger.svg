<svg viewBox="0 0 720 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Decision panel: use schedule_config when work is driven by the clock such as backups and cleanup; use trigger_config when work is driven by code events such as tests on push or pull request; declare both when a CI job should also run nightly">
  <text x="360" y="30" text-anchor="middle" fill="#f3f0e0" font-size="15" font-weight="700" font-family="IBM Plex Sans, sans-serif">Which automation do you reach for?</text>

  <!-- schedule -->
  <rect x="20" y="48" width="216" height="136" rx="6" fill="#20251a" stroke="#56d8c0"/>
  <text x="128" y="74" text-anchor="middle" fill="#56d8c0" font-size="13" font-weight="700" font-family="JetBrains Mono, monospace">schedule_config</text>
  <text x="128" y="96" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">driven by the clock</text>
  <text x="36" y="122" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">&#183; nightly backups</text>
  <text x="36" y="142" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">&#183; cache / temp cleanup</text>
  <text x="36" y="162" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">&#183; periodic data sync</text>

  <!-- trigger -->
  <rect x="252" y="48" width="216" height="136" rx="6" fill="#20251a" stroke="#79d44e"/>
  <text x="360" y="74" text-anchor="middle" fill="#92df62" font-size="13" font-weight="700" font-family="JetBrains Mono, monospace">trigger_config</text>
  <text x="360" y="96" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">driven by code events</text>
  <text x="268" y="122" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">&#183; tests on every push</text>
  <text x="268" y="142" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">&#183; checks on every PR</text>
  <text x="268" y="162" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">&#183; lint / build gates</text>

  <!-- both -->
  <rect x="484" y="48" width="216" height="136" rx="6" fill="#252a1e" stroke="#eec854"/>
  <text x="592" y="74" text-anchor="middle" fill="#eec854" font-size="13" font-weight="700" font-family="JetBrains Mono, monospace">declare both</text>
  <text x="592" y="96" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">each fires independently</text>
  <text x="500" y="122" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">&#183; CI on commits AND</text>
  <text x="500" y="142" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">&#183; a nightly safety run</text>
  <text x="500" y="162" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">&#183; same template, one file</text>
</svg>
