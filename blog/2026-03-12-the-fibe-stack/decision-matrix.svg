<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Decision matrix: when code belongs in Rails versus the Rust core">
  <text x="360" y="28" text-anchor="middle" fill="#f3f0e0" font-size="17" font-weight="700" font-family="IBM Plex Sans, sans-serif">Where does this code live?</text>

  <!-- Rails column -->
  <rect x="30" y="48" width="320" height="312" rx="8" fill="#252a1e" stroke="#79d44e"/>
  <text x="190" y="76" text-anchor="middle" fill="#92df62" font-size="15" font-weight="700" font-family="JetBrains Mono, monospace">Rails</text>
  <text x="190" y="96" text-anchor="middle" fill="#a19f89" font-size="11.5" font-family="IBM Plex Sans, sans-serif">the answer is usually this one</text>

  <text x="52" y="130" fill="#abe87f" font-size="13" font-family="IBM Plex Sans, sans-serif">&#10003;  Touches the database</text>
  <text x="52" y="160" fill="#abe87f" font-size="13" font-family="IBM Plex Sans, sans-serif">&#10003;  Does I/O (SSH, HTTP, Docker)</text>
  <text x="52" y="190" fill="#abe87f" font-size="13" font-family="IBM Plex Sans, sans-serif">&#10003;  Long-running / orchestration</text>
  <text x="52" y="220" fill="#abe87f" font-size="13" font-family="IBM Plex Sans, sans-serif">&#10003;  Holds state across calls</text>
  <text x="52" y="250" fill="#abe87f" font-size="13" font-family="IBM Plex Sans, sans-serif">&#10003;  Authorization decisions</text>
  <text x="52" y="280" fill="#abe87f" font-size="13" font-family="IBM Plex Sans, sans-serif">&#10003;  Still changing weekly</text>
  <text x="52" y="320" fill="#c7c4ae" font-size="11.5" font-family="JetBrains Mono, monospace">e.g. provisioning, Playguard,</text>
  <text x="52" y="338" fill="#c7c4ae" font-size="11.5" font-family="JetBrains Mono, monospace">billing flows, the JSON API</text>

  <!-- Rust column -->
  <rect x="370" y="48" width="320" height="312" rx="8" fill="#20251a" stroke="#eec854"/>
  <text x="530" y="76" text-anchor="middle" fill="#eec854" font-size="15" font-weight="700" font-family="JetBrains Mono, monospace">Rust core</text>
  <text x="530" y="96" text-anchor="middle" fill="#a19f89" font-size="11.5" font-family="IBM Plex Sans, sans-serif">only when ALL of these hold</text>

  <text x="392" y="130" fill="#f5da79" font-size="13" font-family="IBM Plex Sans, sans-serif">&#10003;  Pure function, input &#8594; output</text>
  <text x="392" y="160" fill="#f5da79" font-size="13" font-family="IBM Plex Sans, sans-serif">&#10003;  No DB, no network, no clock</text>
  <text x="392" y="190" fill="#f5da79" font-size="13" font-family="IBM Plex Sans, sans-serif">&#10003;  Stateless &#183; deterministic</text>
  <text x="392" y="220" fill="#f5da79" font-size="13" font-family="IBM Plex Sans, sans-serif">&#10003;  CPU-bound (parse, diff, gen)</text>
  <text x="392" y="250" fill="#f5da79" font-size="13" font-family="IBM Plex Sans, sans-serif">&#10003;  Behavior has stabilized</text>
  <text x="392" y="280" fill="#f5da79" font-size="13" font-family="IBM Plex Sans, sans-serif">&#10003;  Worth a JSON round-trip</text>
  <text x="392" y="320" fill="#c7c4ae" font-size="11.5" font-family="JetBrains Mono, monospace">e.g. compiling a Template to</text>
  <text x="392" y="338" fill="#c7c4ae" font-size="11.5" font-family="JetBrains Mono, monospace">Compose, detecting host drift</text>
</svg>
