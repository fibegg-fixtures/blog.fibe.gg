<svg viewBox="0 0 720 408" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Browser-side resilience. Top: an SSH terminal websocket receives a session-expired status, and on the first time only refreshes the cable URL and resets the connection, then reconnects, clearing a one-shot flag on reconnect. Bottom: a protected bridge iframe survives Turbo morph and stream updates for the same session, only reloading when the URL actually changes.">
  <defs>
    <marker id="br-arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#56d8c0"/>
    </marker>
    <marker id="br-gold" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#eec854"/>
    </marker>
  </defs>

  <!-- ===== top band: SSH session recovery ===== -->
  <text x="20" y="28" fill="#f3f0e0" font-size="14" font-weight="700" font-family="JetBrains Mono, monospace">Live SSH terminal &#183; one-shot session recovery</text>

  <rect x="20" y="44" width="150" height="56" rx="6" fill="#20251a" stroke="#434a35"/>
  <text x="95" y="68" text-anchor="middle" fill="#c7c4ae" font-size="12" font-family="JetBrains Mono, monospace">streaming</text>
  <text x="95" y="86" text-anchor="middle" fill="#56d8c0" font-size="11" font-family="JetBrains Mono, monospace">over ActionCable</text>

  <line x1="170" y1="72" x2="226" y2="72" stroke="#eec854" stroke-width="2" marker-end="url(#br-gold)"/>
  <text x="280" y="60" text-anchor="middle" fill="#eec854" font-size="11" font-family="JetBrains Mono, monospace">session_expired</text>

  <rect x="232" y="44" width="190" height="56" rx="6" fill="#2a261a" stroke="#eec854"/>
  <text x="327" y="66" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="JetBrains Mono, monospace">first time only?</text>
  <text x="327" y="84" text-anchor="middle" fill="#eec854" font-size="11" font-family="IBM Plex Sans, sans-serif">refresh the cable URL</text>

  <line x1="422" y1="72" x2="478" y2="72" stroke="#56d8c0" stroke-width="2" marker-end="url(#br-arrow)"/>

  <rect x="484" y="44" width="216" height="56" rx="6" fill="#1c2a1e" stroke="#5cb43a"/>
  <text x="592" y="66" text-anchor="middle" fill="#92df62" font-size="11" font-family="IBM Plex Sans, sans-serif">reset the connection + resubscribe</text>
  <text x="592" y="84" text-anchor="middle" fill="#c7c4ae" font-size="10" font-family="IBM Plex Sans, sans-serif">flag clears on (re)connect</text>

  <text x="360" y="124" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">one attempt per expiry &#8212; no reconnect storm, no scrollback wipe</text>

  <line x1="20" y1="146" x2="700" y2="146" stroke="#434a35" stroke-width="1"/>

  <!-- ===== bottom band: protected iframe ===== -->
  <text x="20" y="178" fill="#f3f0e0" font-size="14" font-weight="700" font-family="JetBrains Mono, monospace">Protected bridge iframe &#183; Turbo continuity</text>

  <!-- iframe box -->
  <rect x="40" y="198" width="260" height="170" rx="8" fill="#20251a" stroke="#56d8c0" stroke-width="2"/>
  <text x="170" y="222" text-anchor="middle" fill="#56d8c0" font-size="12" font-weight="700" font-family="JetBrains Mono, monospace">live preview iframe</text>
  <text x="170" y="244" text-anchor="middle" fill="#a19f89" font-size="10" font-family="IBM Plex Sans, sans-serif">marked session-protected</text>
  <text x="170" y="260" text-anchor="middle" fill="#a19f89" font-size="10" font-family="IBM Plex Sans, sans-serif">stamped with a ready-version marker</text>
  <line x1="70" y1="276" x2="270" y2="276" stroke="#434a35"/>
  <text x="170" y="300" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">your running app, mid-session</text>
  <text x="170" y="318" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">scroll, form state, socket</text>
  <text x="170" y="346" text-anchor="middle" fill="#92df62" font-size="11" font-weight="700" font-family="IBM Plex Sans, sans-serif">stays alive across page updates</text>

  <!-- guard column -->
  <rect x="360" y="200" width="340" height="50" rx="6" fill="#1c2a1e" stroke="#5cb43a"/>
  <text x="378" y="220" fill="#92df62" font-size="12" font-weight="700" font-family="JetBrains Mono, monospace">same URL morph / stream &#8594; preserved</text>
  <text x="378" y="238" fill="#c7c4ae" font-size="10" font-family="IBM Plex Sans, sans-serif">guard cancels the swap; emits a protected-stream-blocked event</text>

  <rect x="360" y="258" width="340" height="50" rx="6" fill="#1c2a1e" stroke="#5cb43a"/>
  <text x="378" y="278" fill="#92df62" font-size="12" font-weight="700" font-family="JetBrains Mono, monospace">missing panes imported in place</text>
  <text x="378" y="296" fill="#c7c4ae" font-size="10" font-family="IBM Plex Sans, sans-serif">appended in place, never resets the iframe source</text>

  <rect x="360" y="316" width="340" height="50" rx="6" fill="#2a261a" stroke="#eec854"/>
  <text x="378" y="336" fill="#eec854" font-size="12" font-weight="700" font-family="JetBrains Mono, monospace">URL actually changed &#8594; allow reload</text>
  <text x="378" y="354" fill="#c7c4ae" font-size="10" font-family="IBM Plex Sans, sans-serif">refresh deferred while a form is dirty or focused</text>
</svg>
