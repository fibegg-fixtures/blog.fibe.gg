<svg viewBox="0 0 720 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Decision tree: is a service static or dynamic, driven by the fibe.gg/repo_url label">
  <defs>
    <marker id="dp-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#757d5e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="430" fill="none"/>
  <text x="360" y="28" text-anchor="middle" fill="#f3f0e0" font-size="16" font-weight="700" font-family="IBM Plex Sans, sans-serif">Is this service static or dynamic?</text>

  <!-- root question -->
  <rect x="246" y="48" width="228" height="56" rx="8" fill="#252a1e" stroke="#545c42"/>
  <text x="360" y="72" text-anchor="middle" fill="#f3f0e0" font-size="13" font-family="IBM Plex Sans, sans-serif">Does the service build from</text>
  <text x="360" y="90" text-anchor="middle" fill="#eec854" font-size="13" font-family="JetBrains Mono, monospace">your Git repo?</text>

  <!-- branch lines -->
  <line x1="300" y1="104" x2="170" y2="150" stroke="#757d5e" stroke-width="1.5" marker-end="url(#dp-arrow)"/>
  <line x1="420" y1="104" x2="550" y2="150" stroke="#757d5e" stroke-width="1.5" marker-end="url(#dp-arrow)"/>
  <text x="210" y="132" text-anchor="middle" fill="#a19f89" font-size="12" font-family="JetBrains Mono, monospace">no</text>
  <text x="512" y="132" text-anchor="middle" fill="#a19f89" font-size="12" font-family="JetBrains Mono, monospace">yes</text>

  <!-- STATIC column -->
  <rect x="30" y="156" width="300" height="60" rx="8" fill="#20251a" stroke="#5cb43a"/>
  <text x="180" y="180" text-anchor="middle" fill="#92df62" font-size="15" font-weight="700" font-family="JetBrains Mono, monospace">STATIC</text>
  <text x="180" y="202" text-anchor="middle" fill="#c7c4ae" font-size="12" font-family="IBM Plex Sans, sans-serif">runs a published image, period</text>

  <rect x="30" y="228" width="300" height="174" rx="8" fill="#20251a" stroke="#434a35"/>
  <text x="48" y="252" fill="#abe87f" font-size="12" font-family="JetBrains Mono, monospace">postgres:17  &#183;  redis:8-alpine</text>
  <text x="48" y="274" fill="#abe87f" font-size="12" font-family="JetBrains Mono, monospace">nginx:alpine  &#183;  registry images</text>
  <text x="48" y="300" fill="#c7c4ae" font-size="12" font-family="IBM Plex Sans, sans-serif">No fibe.gg/repo_url.</text>
  <text x="48" y="320" fill="#c7c4ae" font-size="12" font-family="IBM Plex Sans, sans-serif">Configured via env + volumes.</text>
  <text x="48" y="340" fill="#c7c4ae" font-size="12" font-family="IBM Plex Sans, sans-serif">No build:, no source_mount.</text>
  <text x="48" y="372" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">Treat exactly as in plain Compose.</text>

  <!-- DYNAMIC column -->
  <rect x="390" y="156" width="300" height="60" rx="8" fill="#20251a" stroke="#e2b33a"/>
  <text x="540" y="180" text-anchor="middle" fill="#eec854" font-size="15" font-weight="700" font-family="JetBrains Mono, monospace">DYNAMIC</text>
  <text x="540" y="202" text-anchor="middle" fill="#c7c4ae" font-size="12" font-family="IBM Plex Sans, sans-serif">source-backed from a Prop</text>

  <rect x="390" y="228" width="300" height="174" rx="8" fill="#20251a" stroke="#434a35"/>
  <text x="408" y="252" fill="#f5da79" font-size="12" font-family="JetBrains Mono, monospace">fibe.gg/repo_url  (REQUIRED)</text>
  <text x="408" y="278" fill="#c7c4ae" font-size="12" font-family="IBM Plex Sans, sans-serif">Triggered by one of:</text>
  <text x="424" y="300" fill="#abe87f" font-size="12" font-family="JetBrains Mono, monospace">&#183; a Compose build: block</text>
  <text x="424" y="320" fill="#abe87f" font-size="12" font-family="JetBrains Mono, monospace">&#183; fibe.gg/source_mount</text>
  <text x="408" y="350" fill="#c7c4ae" font-size="12" font-family="IBM Plex Sans, sans-serif">Both are errors WITHOUT</text>
  <text x="408" y="370" fill="#f08760" font-size="12" font-family="JetBrains Mono, monospace">fibe.gg/repo_url.</text>
  <text x="408" y="392" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">There is no fibe.gg/type label.</text>
</svg>
