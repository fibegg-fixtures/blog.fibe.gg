<svg viewBox="0 0 740 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Six Genie providers funnel through one provider abstraction into a single shared runtime">
  <defs>
    <marker id="pa-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#757d5e"/>
    </marker>
  </defs>

  <text x="370" y="28" text-anchor="middle" fill="#f3f0e0" font-size="16" font-weight="700" font-family="IBM Plex Sans, sans-serif">One interface, six Genies, one runtime</text>

  <!-- Provider tiles -->
  <text x="370" y="58" text-anchor="middle" fill="#a19f89" font-size="12" font-family="IBM Plex Sans, sans-serif">Six provider keys</text>

  <g font-family="JetBrains Mono, monospace" font-size="12">
    <rect x="24"  y="72" width="108" height="40" rx="6" fill="#20251a" stroke="#434a35"/>
    <text x="78"  y="97" text-anchor="middle" fill="#92df62">Gemini</text>
    <rect x="146" y="72" width="118" height="40" rx="6" fill="#20251a" stroke="#434a35"/>
    <text x="205" y="97" text-anchor="middle" fill="#92df62">Antigravity</text>
    <rect x="278" y="72" width="124" height="40" rx="6" fill="#20251a" stroke="#434a35"/>
    <text x="340" y="97" text-anchor="middle" fill="#92df62">Claude Code</text>
    <rect x="416" y="72" width="128" height="40" rx="6" fill="#20251a" stroke="#434a35"/>
    <text x="480" y="97" text-anchor="middle" fill="#92df62">OpenAI Codex</text>
    <rect x="558" y="72" width="78"  height="40" rx="6" fill="#20251a" stroke="#434a35"/>
    <text x="597" y="97" text-anchor="middle" fill="#92df62">Cursor</text>
    <rect x="650" y="72" width="90"  height="40" rx="6" fill="#20251a" stroke="#434a35"/>
    <text x="695" y="97" text-anchor="middle" fill="#92df62">OpenCode</text>
  </g>

  <!-- arrows down to the interface -->
  <g stroke="#757d5e" stroke-width="1.5">
    <line x1="78"  y1="112" x2="300" y2="158" marker-end="url(#pa-arrow)"/>
    <line x1="205" y1="112" x2="330" y2="158" marker-end="url(#pa-arrow)"/>
    <line x1="340" y1="112" x2="360" y2="158" marker-end="url(#pa-arrow)"/>
    <line x1="480" y1="112" x2="400" y2="158" marker-end="url(#pa-arrow)"/>
    <line x1="597" y1="112" x2="430" y2="158" marker-end="url(#pa-arrow)"/>
    <line x1="695" y1="112" x2="450" y2="158" marker-end="url(#pa-arrow)"/>
  </g>

  <!-- provider abstraction -->
  <rect x="150" y="162" width="440" height="110" rx="8" fill="#252a1e" stroke="#5cb43a" stroke-width="2"/>
  <text x="370" y="186" text-anchor="middle" fill="#abe87f" font-size="14" font-weight="700" font-family="JetBrains Mono, monospace">Provider abstraction</text>
  <text x="370" y="205" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">the common contract every provider implements</text>
  <g font-family="JetBrains Mono, monospace" font-size="11" fill="#c7c4ae">
    <text x="370" y="228" text-anchor="middle">image tag &#183; credential path &#183; runtime &#183; skills mapping</text>
    <text x="370" y="247" text-anchor="middle">credential env &#183; MCP config &#183; generated config file</text>
    <text x="370" y="263" text-anchor="middle" fill="#eec854">auth modes: OAuth &#183; provider API key &#183; Mana</text>
  </g>

  <line x1="370" y1="272" x2="370" y2="306" stroke="#757d5e" stroke-width="1.5" marker-end="url(#pa-arrow)"/>

  <!-- one runtime pipeline -->
  <rect x="90" y="310" width="560" height="120" rx="8" fill="#20251a" stroke="#434a35"/>
  <text x="370" y="334" text-anchor="middle" fill="#f3f0e0" font-size="13" font-weight="700" font-family="IBM Plex Sans, sans-serif">One deploy pipeline &#183; one reachability healthcheck</text>

  <g font-family="JetBrains Mono, monospace" font-size="10.5" fill="#c7c4ae">
    <rect x="106" y="350" width="92" height="32" rx="5" fill="#252a1e" stroke="#545c42"/>
    <text x="152" y="370" text-anchor="middle">compose + config</text>
    <rect x="208" y="350" width="74" height="32" rx="5" fill="#252a1e" stroke="#545c42"/>
    <text x="245" y="370" text-anchor="middle">stage files</text>
    <rect x="292" y="350" width="92" height="32" rx="5" fill="#252a1e" stroke="#545c42"/>
    <text x="338" y="370" text-anchor="middle">compose up -d</text>
    <rect x="394" y="350" width="78" height="32" rx="5" fill="#252a1e" stroke="#545c42"/>
    <text x="433" y="370" text-anchor="middle">Traefik join</text>
    <rect x="482" y="350" width="152" height="32" rx="5" fill="#252a1e" stroke="#56d8c0"/>
    <text x="558" y="370" text-anchor="middle" fill="#56d8c0">GET /api/health 45&#215;2s</text>
  </g>

  <text x="370" y="406" text-anchor="middle" fill="#92df62" font-size="11.5" font-family="IBM Plex Sans, sans-serif">reachable &#8594; status running, iframe revealed</text>
  <text x="370" y="423" text-anchor="middle" fill="#a19f89" font-size="10.5" font-family="IBM Plex Sans, sans-serif">the runtime never learned which provider it just deployed</text>

  <text x="370" y="456" text-anchor="middle" fill="#757d5e" font-size="10.5" font-family="JetBrains Mono, monospace">one provider abstraction, six implementations</text>
</svg>
