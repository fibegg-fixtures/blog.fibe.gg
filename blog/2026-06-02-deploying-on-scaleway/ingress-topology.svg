<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ingress topology: Cloudflare proxy terminates TLS and forwards to a Scaleway load balancer, which speaks PROXY protocol to Traefik; Traefik routes the cable path prefix to the AnyCable ws service and everything else to the Rails web service">
  <defs>
    <marker id="in-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#757d5e"/>
    </marker>
  </defs>

  <text x="20" y="28" fill="#f3f0e0" font-size="16" font-weight="700" font-family="IBM Plex Sans, sans-serif">Ingress topology &#183; one Host, two services</text>

  <!-- client -->
  <rect x="40" y="56" width="150" height="48" rx="6" fill="#20251a" stroke="#545c42"/>
  <text x="115" y="78" text-anchor="middle" fill="#f3f0e0" font-size="13" font-family="IBM Plex Sans, sans-serif">Browser / SDK</text>
  <text x="115" y="95" text-anchor="middle" fill="#a19f89" font-size="11" font-family="JetBrains Mono, monospace">https://fibe.gg</text>

  <!-- cloudflare -->
  <rect x="270" y="56" width="170" height="48" rx="6" fill="#20251a" stroke="#e2b33a"/>
  <text x="355" y="76" text-anchor="middle" fill="#eec854" font-size="13" font-family="IBM Plex Sans, sans-serif">Cloudflare proxy</text>
  <text x="355" y="93" text-anchor="middle" fill="#a19f89" font-size="10" font-family="IBM Plex Sans, sans-serif">TLS + Turnstile captcha</text>

  <!-- scaleway LB -->
  <rect x="520" y="56" width="160" height="48" rx="6" fill="#20251a" stroke="#56d8c0"/>
  <text x="600" y="76" text-anchor="middle" fill="#56d8c0" font-size="13" font-family="IBM Plex Sans, sans-serif">Scaleway LB</text>
  <text x="600" y="93" text-anchor="middle" fill="#a19f89" font-size="10" font-family="JetBrains Mono, monospace">PROXY protocol v2</text>

  <line x1="192" y1="80" x2="266" y2="80" stroke="#757d5e" stroke-width="1.5" marker-end="url(#in-arrow)"/>
  <line x1="442" y1="80" x2="516" y2="80" stroke="#757d5e" stroke-width="1.5" marker-end="url(#in-arrow)"/>

  <!-- traefik -->
  <rect x="270" y="150" width="180" height="60" rx="6" fill="#252a1e" stroke="#92df62"/>
  <text x="360" y="176" text-anchor="middle" fill="#abe87f" font-size="14" font-weight="700" font-family="IBM Plex Sans, sans-serif">Traefik v3</text>
  <text x="360" y="196" text-anchor="middle" fill="#a19f89" font-size="10" font-family="IBM Plex Sans, sans-serif">IngressRoute &#183; entryPoint websecure</text>

  <line x1="600" y1="106" x2="600" y2="180" stroke="#757d5e" stroke-width="1.5"/>
  <line x1="600" y1="180" x2="454" y2="180" stroke="#757d5e" stroke-width="1.5" marker-end="url(#in-arrow)"/>

  <!-- rule labels -->
  <rect x="60" y="250" width="280" height="44" rx="5" fill="#20251a" stroke="#434a35"/>
  <text x="74" y="270" fill="#eec854" font-size="11" font-family="JetBrains Mono, monospace">Host(fibe.gg) &amp;&amp; PathPrefix(/cable)</text>
  <text x="74" y="287" fill="#a19f89" font-size="10" font-family="IBM Plex Sans, sans-serif">matched first &#8594; WebSocket service</text>

  <rect x="380" y="250" width="280" height="44" rx="5" fill="#20251a" stroke="#434a35"/>
  <text x="394" y="270" fill="#92df62" font-size="11" font-family="JetBrains Mono, monospace">Host(fibe.gg)</text>
  <text x="394" y="287" fill="#a19f89" font-size="10" font-family="IBM Plex Sans, sans-serif">catch-all &#8594; Rails web service</text>

  <line x1="320" y1="212" x2="220" y2="246" stroke="#757d5e" stroke-width="1.5" marker-end="url(#in-arrow)"/>
  <line x1="400" y1="212" x2="500" y2="246" stroke="#757d5e" stroke-width="1.5" marker-end="url(#in-arrow)"/>

  <!-- services -->
  <rect x="80" y="330" width="220" height="64" rx="6" fill="#20251a" stroke="#56d8c0"/>
  <text x="190" y="356" text-anchor="middle" fill="#56d8c0" font-size="13" font-weight="700" font-family="JetBrains Mono, monospace">ws  (AnyCable-Go)</text>
  <text x="190" y="376" text-anchor="middle" fill="#a19f89" font-size="10" font-family="IBM Plex Sans, sans-serif">2 replicas &#183; RPC back to web/_anycable</text>

  <rect x="420" y="330" width="220" height="64" rx="6" fill="#20251a" stroke="#5cb43a"/>
  <text x="530" y="356" text-anchor="middle" fill="#abe87f" font-size="13" font-weight="700" font-family="JetBrains Mono, monospace">web  (Rails)</text>
  <text x="530" y="376" text-anchor="middle" fill="#a19f89" font-size="10" font-family="IBM Plex Sans, sans-serif">2 replicas &#183; port 3000 &#183; /up probe</text>

  <line x1="190" y1="296" x2="190" y2="326" stroke="#757d5e" stroke-width="1.5" marker-end="url(#in-arrow)"/>
  <line x1="530" y1="296" x2="530" y2="326" stroke="#757d5e" stroke-width="1.5" marker-end="url(#in-arrow)"/>
</svg>
