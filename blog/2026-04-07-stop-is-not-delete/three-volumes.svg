<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The three persistent volumes: a data volume, a dependency cache volume, and a build cache volume. The data volume holds the agent working state, the other two are dev-only caches. All three are named after the stable agent identity, not the chat, and only an explicit purge removes them.">
  <text x="360" y="28" text-anchor="middle" fill="#f3f0e0" font-size="17" font-weight="700" font-family="IBM Plex Sans, sans-serif">Three persistent volumes, one preservation set</text>
  <text x="360" y="48" text-anchor="middle" fill="#a19f89" font-size="12" font-family="IBM Plex Sans, sans-serif">one for data, two for build caches</text>

  <!-- data volume -->
  <rect x="20" y="68" width="216" height="150" rx="8" fill="#20251a" stroke="#5cb43a"/>
  <text x="128" y="96" text-anchor="middle" fill="#92df62" font-size="13.5" font-weight="700" font-family="IBM Plex Sans, sans-serif">Data volume</text>
  <line x1="40" y1="110" x2="216" y2="110" stroke="#434a35"/>
  <text x="128" y="134" text-anchor="middle" fill="#f3f0e0" font-size="13" font-weight="700" font-family="IBM Plex Sans, sans-serif">The memory</text>
  <text x="128" y="158" text-anchor="middle" fill="#c7c4ae" font-size="11.5" font-family="IBM Plex Sans, sans-serif">Working state, history,</text>
  <text x="128" y="174" text-anchor="middle" fill="#c7c4ae" font-size="11.5" font-family="IBM Plex Sans, sans-serif">config under ~/.claude,</text>
  <text x="128" y="190" text-anchor="middle" fill="#c7c4ae" font-size="11.5" font-family="IBM Plex Sans, sans-serif">whatever the agent wrote</text>
  <text x="128" y="208" text-anchor="middle" fill="#abe87f" font-size="11" font-style="italic" font-family="IBM Plex Sans, sans-serif">the one that hurts to lose</text>

  <!-- dependency cache -->
  <rect x="252" y="68" width="216" height="150" rx="8" fill="#20251a" stroke="#545c42"/>
  <text x="360" y="96" text-anchor="middle" fill="#56d8c0" font-size="12.5" font-weight="700" font-family="IBM Plex Sans, sans-serif">Dependency cache volume</text>
  <line x1="272" y1="110" x2="448" y2="110" stroke="#434a35"/>
  <text x="360" y="134" text-anchor="middle" fill="#f3f0e0" font-size="13" font-weight="700" font-family="IBM Plex Sans, sans-serif">A cache</text>
  <text x="360" y="158" text-anchor="middle" fill="#c7c4ae" font-size="11.5" font-family="IBM Plex Sans, sans-serif">Dev-only dependency</text>
  <text x="360" y="174" text-anchor="middle" fill="#c7c4ae" font-size="11.5" font-family="IBM Plex Sans, sans-serif">cache. Reproducible.</text>
  <text x="360" y="198" text-anchor="middle" fill="#a19f89" font-size="11" font-style="italic" font-family="IBM Plex Sans, sans-serif">rebuilds from package files</text>

  <!-- build cache -->
  <rect x="484" y="68" width="216" height="150" rx="8" fill="#20251a" stroke="#545c42"/>
  <text x="592" y="96" text-anchor="middle" fill="#56d8c0" font-size="13" font-weight="700" font-family="IBM Plex Sans, sans-serif">Build cache volume</text>
  <line x1="504" y1="110" x2="680" y2="110" stroke="#434a35"/>
  <text x="592" y="134" text-anchor="middle" fill="#f3f0e0" font-size="13" font-weight="700" font-family="IBM Plex Sans, sans-serif">A cache</text>
  <text x="592" y="158" text-anchor="middle" fill="#c7c4ae" font-size="11.5" font-family="IBM Plex Sans, sans-serif">Dev-only build cache.</text>
  <text x="592" y="174" text-anchor="middle" fill="#c7c4ae" font-size="11.5" font-family="IBM Plex Sans, sans-serif">Reproducible.</text>
  <text x="592" y="198" text-anchor="middle" fill="#a19f89" font-size="11" font-style="italic" font-family="IBM Plex Sans, sans-serif">recomputed on demand</text>

  <rect x="20" y="244" width="680" height="40" rx="6" fill="#1a1f15" stroke="#434a35"/>
  <text x="360" y="262" text-anchor="middle" fill="#c7c4ae" font-size="11.5" font-family="IBM Plex Sans, sans-serif">Named after the stable agent identity &#8212; not the chat. A new chat for the same Agent reattaches the same volumes.</text>
  <text x="360" y="278" text-anchor="middle" fill="#eec854" font-size="11.5" font-weight="700" font-family="IBM Plex Sans, sans-serif">Only an explicit purge removes them.</text>
</svg>
