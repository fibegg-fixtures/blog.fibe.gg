<svg viewBox="0 0 720 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Dynamic service modes compared: production false bind-mounts source for hot reload, production true builds and runs the image">
  <text x="360" y="26" text-anchor="middle" fill="#f3f0e0" font-size="16" font-weight="700" font-family="IBM Plex Sans, sans-serif">One dynamic service, two modes</text>

  <!-- dev mode -->
  <rect x="24" y="48" width="328" height="172" rx="8" fill="#20251a" stroke="#5cb43a"/>
  <text x="44" y="74" fill="#92df62" font-size="13" font-weight="700" font-family="JetBrains Mono, monospace">production: "false"</text>
  <text x="44" y="96" fill="#c7c4ae" font-size="12" font-family="IBM Plex Sans, sans-serif">Bind-mount the cloned tree.</text>
  <line x1="44" y1="108" x2="332" y2="108" stroke="#434a35" stroke-width="1"/>
  <text x="44" y="130" fill="#abe87f" font-size="11" font-family="JetBrains Mono, monospace">&#183; edits reflected immediately</text>
  <text x="44" y="150" fill="#abe87f" font-size="11" font-family="JetBrains Mono, monospace">&#183; app runs a watch/dev process</text>
  <text x="44" y="170" fill="#abe87f" font-size="11" font-family="JetBrains Mono, monospace">&#183; source_mount + start_command</text>
  <text x="44" y="196" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">Fast feedback. Not for prod.</text>

  <!-- prod mode -->
  <rect x="368" y="48" width="328" height="172" rx="8" fill="#20251a" stroke="#e2b33a"/>
  <text x="388" y="74" fill="#eec854" font-size="13" font-weight="700" font-family="JetBrains Mono, monospace">production: "true"</text>
  <text x="388" y="96" fill="#c7c4ae" font-size="12" font-family="IBM Plex Sans, sans-serif">Build the Dockerfile, run the image.</text>
  <line x1="388" y1="108" x2="676" y2="108" stroke="#434a35" stroke-width="1"/>
  <text x="388" y="130" fill="#f5da79" font-size="11" font-family="JetBrains Mono, monospace">&#183; no bind-mount; source_mount ignored</text>
  <text x="388" y="150" fill="#f5da79" font-size="11" font-family="JetBrains Mono, monospace">&#183; rebuild on commit, then rollout</text>
  <text x="388" y="170" fill="#f5da79" font-size="11" font-family="JetBrains Mono, monospace">&#183; pairs with zerodowntime + healthcheck</text>
  <text x="388" y="196" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">Reproducible. Slower loop.</text>
</svg>
