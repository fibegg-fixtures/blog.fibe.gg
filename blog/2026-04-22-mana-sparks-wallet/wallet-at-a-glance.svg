<svg viewBox="0 0 720 104" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Wallet at a glance: 2 currencies, 1 wallet per currency per player, exactly 1 ledger entry per transaction, 0 negative balances allowed">
  <rect x="0" y="10" width="168" height="84" rx="6" fill="#20251a" stroke="#434a35"/>
  <text x="84" y="50" text-anchor="middle" fill="#eec854" font-size="32" font-weight="700" font-family="JetBrains Mono, monospace">2</text>
  <text x="84" y="74" text-anchor="middle" fill="#a19f89" font-size="12" font-family="IBM Plex Sans, sans-serif">currencies (mana &#183; sparks)</text>

  <rect x="184" y="10" width="168" height="84" rx="6" fill="#20251a" stroke="#434a35"/>
  <text x="268" y="50" text-anchor="middle" fill="#92df62" font-size="32" font-weight="700" font-family="JetBrains Mono, monospace">1</text>
  <text x="268" y="74" text-anchor="middle" fill="#a19f89" font-size="12" font-family="IBM Plex Sans, sans-serif">wallet per currency / player</text>

  <rect x="368" y="10" width="168" height="84" rx="6" fill="#20251a" stroke="#434a35"/>
  <text x="452" y="50" text-anchor="middle" fill="#56d8c0" font-size="32" font-weight="700" font-family="JetBrains Mono, monospace">1:1</text>
  <text x="452" y="74" text-anchor="middle" fill="#a19f89" font-size="12" font-family="IBM Plex Sans, sans-serif">ledger entry per transaction</text>

  <rect x="552" y="10" width="168" height="84" rx="6" fill="#20251a" stroke="#434a35"/>
  <text x="636" y="50" text-anchor="middle" fill="#f08760" font-size="32" font-weight="700" font-family="JetBrains Mono, monospace">0</text>
  <text x="636" y="74" text-anchor="middle" fill="#a19f89" font-size="12" font-family="IBM Plex Sans, sans-serif">negative balances allowed</text>
</svg>
