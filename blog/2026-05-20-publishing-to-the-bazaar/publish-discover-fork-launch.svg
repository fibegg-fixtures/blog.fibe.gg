<svg viewBox="0 0 740 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The lifecycle of a published template: publish a version, a consumer discovers it, then either forks or launches it">
  <defs>
    <marker id="pdfl-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#757d5e"/>
    </marker>
  </defs>

  <text x="370" y="26" text-anchor="middle" fill="#f3f0e0" font-size="16" font-weight="700" font-family="IBM Plex Sans, sans-serif">From your account to someone else's running Playground</text>

  <!-- Publisher side -->
  <rect x="18" y="46" width="200" height="60" rx="7" fill="#252a1e" stroke="#eec854"/>
  <text x="118" y="72" text-anchor="middle" fill="#eec854" font-size="13" font-weight="700" font-family="IBM Plex Sans, sans-serif">YOU (publisher)</text>
  <text x="118" y="92" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="JetBrains Mono, monospace">Make public on a version</text>

  <!-- Bazaar -->
  <rect x="270" y="46" width="200" height="60" rx="7" fill="#20251a" stroke="#79d44e"/>
  <text x="370" y="72" text-anchor="middle" fill="#92df62" font-size="13" font-weight="700" font-family="IBM Plex Sans, sans-serif">THE BAZAAR</text>
  <text x="370" y="92" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="JetBrains Mono, monospace">public, searchable, no queue</text>

  <!-- Consumer discovers -->
  <rect x="522" y="46" width="200" height="60" rx="7" fill="#252a1e" stroke="#56d8c0"/>
  <text x="622" y="72" text-anchor="middle" fill="#56d8c0" font-size="13" font-weight="700" font-family="IBM Plex Sans, sans-serif">CONSUMER</text>
  <text x="622" y="92" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="JetBrains Mono, monospace">search / filter / direct link</text>

  <line x1="218" y1="76" x2="266" y2="76" stroke="#757d5e" stroke-width="1.6" marker-end="url(#pdfl-arrow)"/>
  <line x1="470" y1="76" x2="518" y2="76" stroke="#757d5e" stroke-width="1.6" marker-end="url(#pdfl-arrow)"/>

  <text x="242" y="68" text-anchor="middle" fill="#a19f89" font-size="9.5" font-family="IBM Plex Sans, sans-serif">publish</text>
  <text x="494" y="68" text-anchor="middle" fill="#a19f89" font-size="9.5" font-family="IBM Plex Sans, sans-serif">discover</text>

  <!-- two outcomes -->
  <line x1="622" y1="106" x2="622" y2="132" stroke="#757d5e" stroke-width="1.6"/>
  <line x1="622" y1="132" x2="372" y2="132" stroke="#757d5e" stroke-width="1.6"/>
  <line x1="622" y1="132" x2="372" y2="132" stroke="#757d5e" stroke-width="1.6"/>
  <line x1="372" y1="132" x2="372" y2="160" stroke="#757d5e" stroke-width="1.6" marker-end="url(#pdfl-arrow)"/>
  <line x1="622" y1="132" x2="622" y2="160" stroke="#757d5e" stroke-width="1.6" marker-end="url(#pdfl-arrow)"/>

  <!-- Fork -->
  <rect x="232" y="166" width="280" height="104" rx="7" fill="#20251a" stroke="#eec854"/>
  <text x="372" y="190" text-anchor="middle" fill="#eec854" font-size="13" font-weight="700" font-family="IBM Plex Sans, sans-serif">FORK</text>
  <text x="372" y="210" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="JetBrains Mono, monospace">private copy in their account</text>
  <text x="372" y="228" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="JetBrains Mono, monospace">independent: no upstream updates</text>
  <text x="372" y="248" text-anchor="middle" fill="#a19f89" font-size="10.5" font-family="IBM Plex Sans, sans-serif">customize, snapshot, or repoint</text>
  <text x="372" y="263" text-anchor="middle" fill="#a19f89" font-size="10.5" font-family="IBM Plex Sans, sans-serif">at their own Prop</text>

  <!-- Launch -->
  <rect x="522" y="166" width="200" height="104" rx="7" fill="#20251a" stroke="#79d44e"/>
  <text x="622" y="190" text-anchor="middle" fill="#92df62" font-size="13" font-weight="700" font-family="IBM Plex Sans, sans-serif">LAUNCH</text>
  <text x="622" y="210" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="JetBrains Mono, monospace">fresh Playspec bound to</text>
  <text x="622" y="226" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="JetBrains Mono, monospace">the latest version</text>
  <text x="622" y="248" text-anchor="middle" fill="#a19f89" font-size="10.5" font-family="IBM Plex Sans, sans-serif">fill vars &#183; pick Marquee</text>
  <text x="622" y="263" text-anchor="middle" fill="#a19f89" font-size="10.5" font-family="IBM Plex Sans, sans-serif">&#8594; a Playground they own</text>
</svg>
