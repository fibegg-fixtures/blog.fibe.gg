<svg viewBox="0 0 740 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The six Genie providers: Gemini, Antigravity, Claude Code, OpenAI Codex, Cursor and OpenCode, each with its image tag, credential path and auth notes">
  <text x="20" y="28" fill="#f3f0e0" font-size="16" font-weight="700" font-family="IBM Plex Sans, sans-serif">Six Genie providers, one runtime contract</text>

  <!-- gemini -->
  <rect x="20" y="46" width="230" height="120" rx="8" fill="#20251a" stroke="#434a35"/>
  <text x="36" y="72" fill="#92df62" font-size="15" font-weight="700" font-family="IBM Plex Sans, sans-serif">gemini</text>
  <text x="36" y="94" fill="#c7c4ae" font-size="11" font-family="JetBrains Mono, monospace">image: gemini-latest</text>
  <text x="36" y="112" fill="#c7c4ae" font-size="11" font-family="JetBrains Mono, monospace">creds: ~/.gemini</text>
  <text x="36" y="134" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">oauth-personal or API key</text>
  <text x="36" y="152" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">fibe-mana eligible</text>

  <!-- antigravity -->
  <rect x="262" y="46" width="230" height="120" rx="8" fill="#20251a" stroke="#434a35"/>
  <text x="278" y="72" fill="#92df62" font-size="15" font-weight="700" font-family="IBM Plex Sans, sans-serif">antigravity</text>
  <text x="278" y="94" fill="#c7c4ae" font-size="11" font-family="JetBrains Mono, monospace">image: antigravity-latest</text>
  <text x="278" y="112" fill="#c7c4ae" font-size="11" font-family="JetBrains Mono, monospace">creds: ~/.gemini</text>
  <text x="278" y="134" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">OAuth-code via remote auth</text>
  <text x="278" y="152" fill="#eec854" font-size="11" font-family="IBM Plex Sans, sans-serif">browser disabled &#183; no fibe-mana</text>

  <!-- claude-code -->
  <rect x="504" y="46" width="230" height="120" rx="8" fill="#20251a" stroke="#434a35"/>
  <text x="520" y="72" fill="#92df62" font-size="15" font-weight="700" font-family="IBM Plex Sans, sans-serif">claude-code</text>
  <text x="520" y="94" fill="#c7c4ae" font-size="11" font-family="JetBrains Mono, monospace">image: claude-code-latest</text>
  <text x="520" y="112" fill="#c7c4ae" font-size="11" font-family="JetBrains Mono, monospace">creds: ~/.claude</text>
  <text x="520" y="134" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">always exports env creds</text>
  <text x="520" y="152" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">fibe-mana &#8594; ANTHROPIC_BASE_URL</text>

  <!-- openai-codex -->
  <rect x="20" y="178" width="230" height="120" rx="8" fill="#20251a" stroke="#434a35"/>
  <text x="36" y="204" fill="#92df62" font-size="15" font-weight="700" font-family="IBM Plex Sans, sans-serif">openai-codex</text>
  <text x="36" y="226" fill="#c7c4ae" font-size="11" font-family="JetBrains Mono, monospace">image: openai-codex-latest</text>
  <text x="36" y="244" fill="#c7c4ae" font-size="11" font-family="JetBrains Mono, monospace">creds: ~/.codex</text>
  <text x="36" y="266" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">CODEX_HOME points at config</text>
  <text x="36" y="284" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">fibe-mana eligible</text>

  <!-- cursor -->
  <rect x="262" y="178" width="230" height="120" rx="8" fill="#20251a" stroke="#434a35"/>
  <text x="278" y="204" fill="#92df62" font-size="15" font-weight="700" font-family="IBM Plex Sans, sans-serif">cursor</text>
  <text x="278" y="226" fill="#c7c4ae" font-size="11" font-family="JetBrains Mono, monospace">image: cursor-latest</text>
  <text x="278" y="244" fill="#c7c4ae" font-size="11" font-family="JetBrains Mono, monospace">creds: ~/.cursor</text>
  <text x="278" y="266" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">adds a runtime rule file</text>
  <text x="278" y="284" fill="#eec854" font-size="11" font-family="IBM Plex Sans, sans-serif">no fibe-mana</text>

  <!-- opencode -->
  <rect x="504" y="178" width="230" height="120" rx="8" fill="#20251a" stroke="#434a35"/>
  <text x="520" y="204" fill="#92df62" font-size="15" font-weight="700" font-family="IBM Plex Sans, sans-serif">opencode</text>
  <text x="520" y="226" fill="#c7c4ae" font-size="11" font-family="JetBrains Mono, monospace">image: opencode-latest</text>
  <text x="520" y="244" fill="#c7c4ae" font-size="10.5" font-family="JetBrains Mono, monospace">creds: ~/.local/share/opencode</text>
  <text x="520" y="266" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">routes to openrouter (default),</text>
  <text x="520" y="284" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">anthropic / openai / gemini ...</text>
</svg>
