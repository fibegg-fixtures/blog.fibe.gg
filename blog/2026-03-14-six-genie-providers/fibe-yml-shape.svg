<svg viewBox="0 0 720 446" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The shape of the generated config file: provider, password, model options, credential environment, and MCP config">
  <text x="360" y="26" text-anchor="middle" fill="#f3f0e0" font-size="16" font-weight="700" font-family="IBM Plex Sans, sans-serif">The one file that makes them all look the same</text>
  <text x="360" y="46" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">a generated config file, mounted into the container</text>

  <rect x="40" y="62" width="640" height="338" rx="8" fill="#20251a" stroke="#434a35"/>

  <!-- comment line -->
  <text x="60" y="88" fill="#757d5e" font-size="11.5" font-family="JetBrains Mono, monospace"># Auto-generated by Fibe Platform &#8212; do not edit manually</text>

  <!-- core block -->
  <text x="60" y="112" fill="#92df62"  font-size="12" font-family="JetBrains Mono, monospace">provider:</text>
  <text x="230" y="112" fill="#c7c4ae" font-size="12" font-family="JetBrains Mono, monospace">Claude Code</text>
  <text x="60" y="132" fill="#92df62"  font-size="12" font-family="JetBrains Mono, monospace">password:</text>
  <text x="230" y="132" fill="#c7c4ae" font-size="12" font-family="JetBrains Mono, monospace">&#183;&#183;&#183;&#183;&#183;&#183;&#183;&#183; (one-time internal password)</text>
  <text x="60" y="152" fill="#eec854"  font-size="12" font-family="JetBrains Mono, monospace">auth mode:</text>
  <text x="230" y="152" fill="#a19f89" font-size="12" font-family="IBM Plex Sans, sans-serif">only when a provider API key is used</text>

  <!-- model block -->
  <text x="60" y="178" fill="#92df62"  font-size="12" font-family="JetBrains Mono, monospace">default model:</text>
  <text x="230" y="178" fill="#c7c4ae" font-size="12" font-family="JetBrains Mono, monospace">claude-opus-4-8</text>
  <text x="60" y="198" fill="#92df62"  font-size="12" font-family="JetBrains Mono, monospace">model options:</text>
  <text x="230" y="198" fill="#a19f89" font-size="12" font-family="IBM Plex Sans, sans-serif">the effective options for this chat</text>
  <text x="60" y="218" fill="#92df62"  font-size="12" font-family="JetBrains Mono, monospace">system prompt:</text>
  <text x="230" y="218" fill="#a19f89" font-size="12" font-family="IBM Plex Sans, sans-serif">the effective prompt for this chat</text>

  <!-- paths -->
  <text x="60" y="244" fill="#92df62"  font-size="12" font-family="JetBrains Mono, monospace">data dir:</text>
  <text x="230" y="244" fill="#c7c4ae" font-size="12" font-family="JetBrains Mono, monospace">/app/data</text>
  <text x="60" y="264" fill="#92df62"  font-size="12" font-family="JetBrains Mono, monospace">session dir:</text>
  <text x="230" y="264" fill="#c7c4ae" font-size="12" font-family="IBM Plex Sans, sans-serif">per-chat path the native CLI writes to</text>

  <!-- credential env -->
  <text x="60" y="290" fill="#56d8c0"  font-size="12" font-family="JetBrains Mono, monospace">credential env:</text>
  <text x="80" y="310" fill="#c7c4ae" font-size="11.5" font-family="JetBrains Mono, monospace">ANTHROPIC_AUTH_TOKEN: &#183;&#183;&#183;  ANTHROPIC_BASE_URL: &#183;&#183;&#183;</text>
  <text x="80" y="328" fill="#a19f89" font-size="10.5" font-family="IBM Plex Sans, sans-serif">resolved per mode; injected into the native CLI subprocess</text>

  <!-- MCP block -->
  <text x="60" y="354" fill="#56d8c0"  font-size="12" font-family="JetBrains Mono, monospace">MCP servers:</text>
  <g font-family="JetBrains Mono, monospace" font-size="10.5">
    <rect x="80"  y="362" width="86"  height="24" rx="4" fill="#252a1e" stroke="#5cb43a"/>
    <text x="123" y="378" text-anchor="middle" fill="#92df62">docker</text>
    <rect x="174" y="362" width="120" height="24" rx="4" fill="#252a1e" stroke="#545c42"/>
    <text x="234" y="378" text-anchor="middle" fill="#a19f89">fibe (if api key)</text>
    <rect x="302" y="362" width="150" height="24" rx="4" fill="#252a1e" stroke="#545c42"/>
    <text x="377" y="378" text-anchor="middle" fill="#a19f89">github (if installation)</text>
    <rect x="460" y="362" width="120" height="24" rx="4" fill="#252a1e" stroke="#545c42"/>
    <text x="520" y="378" text-anchor="middle" fill="#a19f89">gitea (if token)</text>
  </g>
  <text x="80" y="398" fill="#757d5e" font-size="10" font-family="IBM Plex Sans, sans-serif">only docker is unconditional &#183; the rest depend on what you connected</text>

  <text x="360" y="430" text-anchor="middle" fill="#757d5e" font-size="10.5" font-family="IBM Plex Sans, sans-serif">one builder, identical shape for every provider</text>
</svg>
