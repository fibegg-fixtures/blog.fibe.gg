<svg viewBox="0 0 740 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A single notification fans out from one producer through the broadcaster and in-process event bus to four destinations: audit channel, mini-toast, inbox, and web push.">
  <defs>
    <marker id="fan-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L8,5 L0,9 Z" fill="#79d44e"/>
    </marker>
    <marker id="fan-arrow-gold" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L8,5 L0,9 Z" fill="#e2b33a"/>
    </marker>
  </defs>

  <text x="370" y="28" text-anchor="middle" fill="#f3f0e0" font-size="17" font-weight="700" font-family="IBM Plex Sans, sans-serif">One event, four destinations</text>

  <!-- Producer -->
  <rect x="40" y="58" width="200" height="58" rx="6" fill="#20251a" stroke="#545c42"/>
  <text x="140" y="83" text-anchor="middle" fill="#c7c4ae" font-size="12" font-family="IBM Plex Sans, sans-serif">Producer (e.g.)</text>
  <text x="140" y="103" text-anchor="middle" fill="#92df62" font-size="12.5" font-family="IBM Plex Sans, sans-serif">agent-message notification</text>

  <!-- raise a notification -->
  <rect x="300" y="50" width="180" height="74" rx="6" fill="#252a1e" stroke="#79d44e" stroke-width="1.5"/>
  <text x="390" y="80" text-anchor="middle" fill="#abe87f" font-size="13" font-family="IBM Plex Sans, sans-serif">raise a</text>
  <text x="390" y="98" text-anchor="middle" fill="#abe87f" font-size="13" font-family="IBM Plex Sans, sans-serif">notification</text>
  <text x="390" y="116" text-anchor="middle" fill="#a19f89" font-size="10.5" font-family="IBM Plex Sans, sans-serif">the broadcaster</text>

  <line x1="240" y1="87" x2="298" y2="87" stroke="#79d44e" stroke-width="2" marker-end="url(#fan-arrow)"/>
  <text x="269" y="78" text-anchor="middle" fill="#a19f89" font-size="9.5" font-family="IBM Plex Sans, sans-serif">intent only</text>

  <!-- event bus -->
  <rect x="300" y="160" width="180" height="56" rx="6" fill="#20251a" stroke="#56d8c0"/>
  <text x="390" y="184" text-anchor="middle" fill="#56d8c0" font-size="13" font-family="IBM Plex Sans, sans-serif">publish event</text>
  <text x="390" y="202" text-anchor="middle" fill="#a19f89" font-size="10" font-family="IBM Plex Sans, sans-serif">in-process event bus</text>

  <line x1="390" y1="124" x2="390" y2="158" stroke="#56d8c0" stroke-width="2" marker-end="url(#fan-arrow)"/>

  <!-- Four destination tiles -->
  <!-- 1 Audit channel -->
  <rect x="40" y="270" width="150" height="86" rx="6" fill="#20251a" stroke="#56d8c0"/>
  <text x="115" y="294" text-anchor="middle" fill="#56d8c0" font-size="12.5" font-weight="700" font-family="IBM Plex Sans, sans-serif">Audit channel</text>
  <text x="115" y="316" text-anchor="middle" fill="#c7c4ae" font-size="10.5" font-family="IBM Plex Sans, sans-serif">event JSON broadcast</text>
  <text x="115" y="332" text-anchor="middle" fill="#a19f89" font-size="10" font-family="IBM Plex Sans, sans-serif">default observer,</text>
  <text x="115" y="346" text-anchor="middle" fill="#a19f89" font-size="10" font-family="IBM Plex Sans, sans-serif">every event</text>

  <!-- 2 Mini-toast -->
  <rect x="205" y="270" width="150" height="86" rx="6" fill="#20251a" stroke="#79d44e"/>
  <text x="280" y="294" text-anchor="middle" fill="#92df62" font-size="12.5" font-weight="700" font-family="IBM Plex Sans, sans-serif">Mini-toast</text>
  <text x="280" y="316" text-anchor="middle" fill="#c7c4ae" font-size="10.5" font-family="IBM Plex Sans, sans-serif">Turbo Stream</text>
  <text x="280" y="331" text-anchor="middle" fill="#c7c4ae" font-size="10.5" font-family="IBM Plex Sans, sans-serif">append</text>
  <text x="280" y="348" text-anchor="middle" fill="#a19f89" font-size="10" font-family="IBM Plex Sans, sans-serif">ephemeral &#183; seconds</text>

  <!-- 3 Inbox -->
  <rect x="370" y="270" width="150" height="86" rx="6" fill="#20251a" stroke="#79d44e"/>
  <text x="445" y="294" text-anchor="middle" fill="#92df62" font-size="12.5" font-weight="700" font-family="IBM Plex Sans, sans-serif">FAB inbox</text>
  <text x="445" y="316" text-anchor="middle" fill="#c7c4ae" font-size="10.5" font-family="IBM Plex Sans, sans-serif">Turbo Stream</text>
  <text x="445" y="331" text-anchor="middle" fill="#c7c4ae" font-size="10.5" font-family="IBM Plex Sans, sans-serif">prepend</text>
  <text x="445" y="348" text-anchor="middle" fill="#abe87f" font-size="10" font-family="IBM Plex Sans, sans-serif">durable if persistent</text>

  <!-- 4 Web push -->
  <rect x="535" y="270" width="160" height="86" rx="6" fill="#20251a" stroke="#e2b33a"/>
  <text x="615" y="294" text-anchor="middle" fill="#eec854" font-size="12.5" font-weight="700" font-family="IBM Plex Sans, sans-serif">Web push</text>
  <text x="615" y="316" text-anchor="middle" fill="#c7c4ae" font-size="10.5" font-family="IBM Plex Sans, sans-serif">webpush + VAPID</text>
  <text x="615" y="332" text-anchor="middle" fill="#f5da79" font-size="10" font-family="IBM Plex Sans, sans-serif">opt-in, gated twice</text>
  <text x="615" y="348" text-anchor="middle" fill="#a19f89" font-size="10" font-family="IBM Plex Sans, sans-serif">out-of-band</text>

  <!-- Arrows from bus / broadcaster to tiles -->
  <!-- audit from the event bus -->
  <line x1="335" y1="216" x2="130" y2="268" stroke="#56d8c0" stroke-width="1.8" marker-end="url(#fan-arrow)"/>
  <!-- toast from broadcaster -->
  <line x1="350" y1="124" x2="290" y2="268" stroke="#79d44e" stroke-width="1.8" marker-end="url(#fan-arrow)"/>
  <!-- inbox from broadcaster -->
  <line x1="430" y1="124" x2="448" y2="268" stroke="#79d44e" stroke-width="1.8" marker-end="url(#fan-arrow)"/>
  <!-- push from broadcaster -->
  <line x1="470" y1="120" x2="610" y2="268" stroke="#e2b33a" stroke-width="1.8" marker-end="url(#fan-arrow-gold)"/>

  <text x="370" y="404" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">The producer touches only the green box. The four destinations don't know about each other.</text>
  <text x="370" y="424" text-anchor="middle" fill="#757d5e" font-size="10" font-family="IBM Plex Sans, sans-serif">A fault in any one destination can't take down the others.</text>
</svg>
