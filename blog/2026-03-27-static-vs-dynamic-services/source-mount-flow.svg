<svg viewBox="0 0 740 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Source-mount dev loop: Prop repo cloned and bind-mounted into the container, watch process hot-reloads on edits">
  <defs>
    <marker id="sm-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#56d8c0"/>
    </marker>
  </defs>
  <text x="370" y="26" text-anchor="middle" fill="#f3f0e0" font-size="16" font-weight="700" font-family="IBM Plex Sans, sans-serif">Dev mode: fibe.gg/production "false"</text>

  <!-- Prop / repo -->
  <rect x="24" y="60" width="160" height="92" rx="8" fill="#20251a" stroke="#545c42"/>
  <text x="104" y="92" text-anchor="middle" fill="#eec854" font-size="13" font-weight="700" font-family="JetBrains Mono, monospace">Prop</text>
  <text x="104" y="114" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">Git binding</text>
  <text x="104" y="132" text-anchor="middle" fill="#a19f89" font-size="11" font-family="JetBrains Mono, monospace">repo_url + branch</text>

  <line x1="186" y1="106" x2="252" y2="106" stroke="#56d8c0" stroke-width="2" marker-end="url(#sm-arrow)"/>
  <text x="219" y="98" text-anchor="middle" fill="#a19f89" font-size="10" font-family="JetBrains Mono, monospace">clone</text>

  <!-- container -->
  <rect x="258" y="48" width="280" height="200" rx="8" fill="#252a1e" stroke="#5cb43a"/>
  <text x="398" y="72" text-anchor="middle" fill="#92df62" font-size="13" font-weight="700" font-family="JetBrains Mono, monospace">container</text>

  <rect x="278" y="84" width="240" height="48" rx="6" fill="#20251a" stroke="#434a35"/>
  <text x="398" y="104" text-anchor="middle" fill="#abe87f" font-size="11" font-family="JetBrains Mono, monospace">bind-mount &#8594; /app</text>
  <text x="398" y="122" text-anchor="middle" fill="#a19f89" font-size="10" font-family="IBM Plex Sans, sans-serif">fibe.gg/source_mount</text>

  <rect x="278" y="142" width="240" height="44" rx="6" fill="#20251a" stroke="#434a35"/>
  <text x="398" y="162" text-anchor="middle" fill="#56d8c0" font-size="11" font-family="JetBrains Mono, monospace">named volume &#8594; /app/node_modules</text>
  <text x="398" y="178" text-anchor="middle" fill="#a19f89" font-size="10" font-family="IBM Plex Sans, sans-serif">layered on top, stays out of repo</text>

  <rect x="278" y="196" width="240" height="40" rx="6" fill="#20251a" stroke="#434a35"/>
  <text x="398" y="221" text-anchor="middle" fill="#f5da79" font-size="11" font-family="JetBrains Mono, monospace">start_command: npm run dev</text>

  <!-- edit loop -->
  <rect x="566" y="74" width="150" height="100" rx="8" fill="#20251a" stroke="#545c42"/>
  <text x="641" y="104" text-anchor="middle" fill="#f3f0e0" font-size="12" font-weight="700" font-family="IBM Plex Sans, sans-serif">you edit a file</text>
  <text x="641" y="128" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">watcher reacts</text>
  <text x="641" y="148" text-anchor="middle" fill="#92df62" font-size="11" font-family="IBM Plex Sans, sans-serif">hot reload</text>

  <line x1="538" y1="124" x2="562" y2="124" stroke="#56d8c0" stroke-width="2" marker-end="url(#sm-arrow)"/>
  <line x1="641" y1="174" x2="641" y2="210" stroke="#56d8c0" stroke-width="2"/>
  <line x1="641" y1="210" x2="540" y2="210" stroke="#56d8c0" stroke-width="2" marker-end="url(#sm-arrow)"/>
  <text x="588" y="226" text-anchor="middle" fill="#a19f89" font-size="10" font-family="IBM Plex Sans, sans-serif">no rebuild, no restart</text>
</svg>
