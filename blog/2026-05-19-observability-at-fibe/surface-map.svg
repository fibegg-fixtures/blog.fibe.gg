<svg viewBox="0 0 760 432" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Fibe's observability surface: errors via Sentry, a health probe, structured JSON logs, the audit log event trail, and reconciler metrics counters">
  <defs>
    <marker id="sm-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#757d5e"/>
    </marker>
  </defs>

  <text x="380" y="28" text-anchor="middle" fill="#f3f0e0" font-size="18" font-weight="700" font-family="IBM Plex Sans, sans-serif">What Fibe actually instruments</text>
  <text x="380" y="48" text-anchor="middle" fill="#a19f89" font-size="12" font-family="IBM Plex Sans, sans-serif">Five surfaces. No metrics dashboard. Each one is something we act on.</text>

  <!-- The app box -->
  <rect x="280" y="72" width="200" height="58" rx="8" fill="#252a1e" stroke="#545c42"/>
  <text x="380" y="98" text-anchor="middle" fill="#f3f0e0" font-size="14" font-weight="700" font-family="IBM Plex Sans, sans-serif">Rails monolith</text>
  <text x="380" y="117" text-anchor="middle" fill="#a19f89" font-size="11" font-family="JetBrains Mono, monospace">requests &#183; jobs &#183; reconciler</text>

  <!-- Sentry -->
  <line x1="320" y1="130" x2="150" y2="190" stroke="#757d5e" stroke-width="1.5" marker-end="url(#sm-arrow)"/>
  <rect x="40" y="196" width="200" height="78" rx="8" fill="#20251a" stroke="#f08760"/>
  <text x="140" y="222" text-anchor="middle" fill="#f08760" font-size="14" font-weight="700" font-family="IBM Plex Sans, sans-serif">Sentry</text>
  <text x="140" y="242" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">exceptions + traces</text>
  <text x="140" y="260" text-anchor="middle" fill="#a19f89" font-size="10.5" font-family="JetBrains Mono, monospace">prod/staging/beta &#183; PII off</text>

  <!-- Health -->
  <line x1="360" y1="130" x2="345" y2="190" stroke="#757d5e" stroke-width="1.5" marker-end="url(#sm-arrow)"/>
  <rect x="262" y="196" width="200" height="78" rx="8" fill="#20251a" stroke="#92df62"/>
  <text x="362" y="222" text-anchor="middle" fill="#92df62" font-size="14" font-weight="700" font-family="IBM Plex Sans, sans-serif">Health probe</text>
  <text x="362" y="242" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="JetBrains Mono, monospace">GET /up</text>
  <text x="362" y="260" text-anchor="middle" fill="#a19f89" font-size="10.5" font-family="IBM Plex Sans, sans-serif">liveness + build identity</text>

  <!-- Logs -->
  <line x1="430" y1="130" x2="600" y2="190" stroke="#757d5e" stroke-width="1.5" marker-end="url(#sm-arrow)"/>
  <rect x="510" y="196" width="210" height="78" rx="8" fill="#20251a" stroke="#56d8c0"/>
  <text x="615" y="222" text-anchor="middle" fill="#56d8c0" font-size="14" font-weight="700" font-family="IBM Plex Sans, sans-serif">Structured logs</text>
  <text x="615" y="242" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">one JSON object per line</text>
  <text x="615" y="260" text-anchor="middle" fill="#a19f89" font-size="10.5" font-family="JetBrains Mono, monospace">stdout &#183; tagged by request ID</text>

  <!-- Audit log -->
  <line x1="320" y1="125" x2="160" y2="312" stroke="#757d5e" stroke-width="1.5" marker-end="url(#sm-arrow)"/>
  <rect x="40" y="318" width="320" height="78" rx="8" fill="#20251a" stroke="#eec854"/>
  <text x="200" y="344" text-anchor="middle" fill="#eec854" font-size="14" font-weight="700" font-family="IBM Plex Sans, sans-serif">Audit log</text>
  <text x="200" y="364" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">immutable who/what/how event trail</text>
  <text x="200" y="382" text-anchor="middle" fill="#a19f89" font-size="10.5" font-family="JetBrains Mono, monospace">one table &#183; live feed &#183; fans out to webhooks</text>

  <!-- Reconciler metrics -->
  <line x1="440" y1="125" x2="600" y2="312" stroke="#757d5e" stroke-width="1.5" marker-end="url(#sm-arrow)"/>
  <rect x="400" y="318" width="320" height="78" rx="8" fill="#20251a" stroke="#abe87f"/>
  <text x="560" y="344" text-anchor="middle" fill="#abe87f" font-size="14" font-weight="700" font-family="IBM Plex Sans, sans-serif">Playguard metrics</text>
  <text x="560" y="364" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">drift counters, every 60s, per Marquee</text>
  <text x="560" y="382" text-anchor="middle" fill="#a19f89" font-size="10.5" font-family="JetBrains Mono, monospace">evaluated &#183; rolled out &#183; skipped &#183; errors</text>

  <text x="380" y="422" text-anchor="middle" fill="#757d5e" font-size="10.5" font-family="IBM Plex Sans, sans-serif">Webhooks carry the audit trail off-platform &#8212; signed (see next diagram).</text>
</svg>
