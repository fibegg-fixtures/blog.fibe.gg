<svg viewBox="0 0 760 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Traefik routing decision: runtime route, maintenance route, or no route">
  <defs>
    <marker id="rd-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#757d5e"/>
    </marker>
  </defs>

  <text x="380" y="28" text-anchor="middle" fill="#f3f0e0" font-size="17" font-weight="700" font-family="IBM Plex Sans, sans-serif">How a service gets a router (per playground)</text>

  <!-- Q1: exposed services? -->
  <rect x="270" y="48" width="220" height="56" rx="8" fill="#252a1e" stroke="#545c42"/>
  <text x="380" y="72" text-anchor="middle" fill="#f3f0e0" font-size="13" font-family="IBM Plex Sans, sans-serif">Any exposed services?</text>
  <text x="380" y="92" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">headless job / being destroyed &#8594; none</text>

  <!-- no branch to "no route" -->
  <line x1="270" y1="76" x2="150" y2="76" stroke="#757d5e" stroke-width="1.6" marker-end="url(#rd-arrow)"/>
  <line x1="150" y1="76" x2="150" y2="360" stroke="#757d5e" stroke-width="1.6" marker-end="url(#rd-arrow)"/>
  <text x="205" y="68" text-anchor="middle" fill="#f08760" font-size="11" font-family="JetBrains Mono, monospace">no</text>

  <!-- yes down -->
  <line x1="380" y1="104" x2="380" y2="148" stroke="#757d5e" stroke-width="1.6" marker-end="url(#rd-arrow)"/>
  <text x="396" y="128" text-anchor="middle" fill="#92df62" font-size="11" font-family="JetBrains Mono, monospace">yes</text>

  <!-- Q2: maintenance turned on? -->
  <rect x="270" y="150" width="220" height="56" rx="8" fill="#252a1e" stroke="#545c42"/>
  <text x="380" y="174" text-anchor="middle" fill="#f3f0e0" font-size="13" font-family="IBM Plex Sans, sans-serif">Maintenance turned on?</text>
  <text x="380" y="194" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">explicit per-playground flag</text>

  <!-- maintenance yes -> right -->
  <line x1="490" y1="178" x2="610" y2="178" stroke="#757d5e" stroke-width="1.6" marker-end="url(#rd-arrow)"/>
  <line x1="610" y1="178" x2="610" y2="360" stroke="#757d5e" stroke-width="1.6" marker-end="url(#rd-arrow)"/>
  <text x="548" y="170" text-anchor="middle" fill="#eec854" font-size="11" font-family="JetBrains Mono, monospace">yes</text>

  <!-- maintenance no -> down to runtime -->
  <line x1="380" y1="206" x2="380" y2="360" stroke="#757d5e" stroke-width="1.6" marker-end="url(#rd-arrow)"/>
  <text x="396" y="290" text-anchor="middle" fill="#92df62" font-size="11" font-family="JetBrains Mono, monospace">no</text>

  <!-- no route -->
  <rect x="40" y="362" width="220" height="86" rx="8" fill="#20251a" stroke="#545c42"/>
  <text x="150" y="388" text-anchor="middle" fill="#c7c4ae" font-size="15" font-weight="700" font-family="IBM Plex Sans, sans-serif">No route</text>
  <text x="150" y="410" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">no router emitted at all</text>
  <text x="150" y="428" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">Traefik 404s the host</text>

  <!-- runtime route -->
  <rect x="270" y="362" width="220" height="86" rx="8" fill="#20251a" stroke="#5cb43a"/>
  <text x="380" y="388" text-anchor="middle" fill="#92df62" font-size="15" font-weight="700" font-family="IBM Plex Sans, sans-serif">Runtime route</text>
  <text x="380" y="410" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">routes to the live container</text>
  <text x="380" y="428" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">default priority</text>

  <!-- maintenance route -->
  <rect x="500" y="362" width="220" height="86" rx="8" fill="#20251a" stroke="#e2b33a"/>
  <text x="610" y="388" text-anchor="middle" fill="#eec854" font-size="15" font-weight="700" font-family="IBM Plex Sans, sans-serif">Maintenance route</text>
  <text x="610" y="410" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">503 from maintenance page</text>
  <text x="610" y="428" text-anchor="middle" fill="#f5da79" font-size="11" font-family="JetBrains Mono, monospace">priority 1,000,000</text>
</svg>
