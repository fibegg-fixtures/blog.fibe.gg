<svg viewBox="0 0 740 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A Playguard cycle holds a 15-minute token lock and renews it between phases">
  <defs>
    <marker id="tlArrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#757d5e"/>
    </marker>
  </defs>

  <text x="20" y="28" fill="#f3f0e0" font-size="16" font-weight="700" font-family="IBM Plex Sans, sans-serif">One cycle, one lock, many renewals</text>

  <!-- timeline axis -->
  <line x1="40" y1="72" x2="700" y2="72" stroke="#545c42" stroke-width="2" marker-end="url(#tlArrow)"/>
  <text x="40" y="60" fill="#a19f89" font-size="11" font-family="JetBrains Mono, monospace">t0</text>
  <text x="650" y="60" fill="#a19f89" font-size="11" font-family="JetBrains Mono, monospace">time &#8594;</text>

  <!-- acquire -->
  <circle cx="60" cy="72" r="6" fill="#eec854"/>
  <text x="60" y="100" text-anchor="middle" fill="#eec854" font-size="11" font-family="JetBrains Mono, monospace">SET NX EX 15m</text>
  <text x="60" y="116" text-anchor="middle" fill="#a19f89" font-size="10" font-family="IBM Plex Sans, sans-serif">acquire</text>

  <!-- phase boxes -->
  <g font-family="JetBrains Mono, monospace" font-size="10.5">
    <rect x="100" y="150" width="92" height="34" rx="5" fill="#20251a" stroke="#434a35"/>
    <text x="146" y="171" text-anchor="middle" fill="#c7c4ae">git sync</text>

    <rect x="210" y="150" width="92" height="34" rx="5" fill="#20251a" stroke="#434a35"/>
    <text x="256" y="171" text-anchor="middle" fill="#c7c4ae">branches</text>

    <rect x="320" y="150" width="92" height="34" rx="5" fill="#20251a" stroke="#434a35"/>
    <text x="366" y="171" text-anchor="middle" fill="#c7c4ae">images</text>

    <rect x="430" y="150" width="110" height="34" rx="5" fill="#20251a" stroke="#434a35"/>
    <text x="485" y="171" text-anchor="middle" fill="#c7c4ae">playgrounds</text>

    <rect x="558" y="150" width="92" height="34" rx="5" fill="#20251a" stroke="#434a35"/>
    <text x="604" y="171" text-anchor="middle" fill="#c7c4ae">orphans</text>
  </g>

  <!-- renew ticks between phases -->
  <g>
    <line x1="200" y1="72" x2="200" y2="148" stroke="#5cb43a" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="200" cy="72" r="5" fill="#92df62"/>
    <line x1="310" y1="72" x2="310" y2="148" stroke="#5cb43a" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="310" cy="72" r="5" fill="#92df62"/>
    <line x1="420" y1="72" x2="420" y2="148" stroke="#5cb43a" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="420" cy="72" r="5" fill="#92df62"/>
    <line x1="548" y1="72" x2="548" y2="148" stroke="#5cb43a" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="548" cy="72" r="5" fill="#92df62"/>
  </g>
  <text x="374" y="138" text-anchor="middle" fill="#92df62" font-size="11" font-family="JetBrains Mono, monospace">renew the lock (EXPIRE if token matches)</text>

  <!-- release -->
  <circle cx="680" cy="72" r="6" fill="#56d8c0"/>
  <text x="680" y="100" text-anchor="middle" fill="#56d8c0" font-size="11" font-family="JetBrains Mono, monospace">DEL</text>
  <text x="680" y="116" text-anchor="middle" fill="#a19f89" font-size="10" font-family="IBM Plex Sans, sans-serif">release (ensure)</text>

  <!-- TTL band -->
  <rect x="60" y="220" width="620" height="30" rx="5" fill="#252a1e" stroke="#545c42"/>
  <text x="370" y="240" text-anchor="middle" fill="#eec854" font-size="12" font-family="JetBrains Mono, monospace">TTL = 15 minutes &#183; reset on every renew, so the lock never expires mid-cycle</text>

  <!-- legend -->
  <g font-family="IBM Plex Sans, sans-serif" font-size="11">
    <circle cx="80" cy="300" r="5" fill="#eec854"/>
    <text x="92" y="304" fill="#c7c4ae">acquire (token = random UUID)</text>
    <circle cx="300" cy="300" r="5" fill="#92df62"/>
    <text x="312" y="304" fill="#c7c4ae">renew between phases</text>
    <circle cx="480" cy="300" r="5" fill="#56d8c0"/>
    <text x="492" y="304" fill="#c7c4ae">release in cleanup block</text>
  </g>
  <text x="80" y="332" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">A long phase resets the 15-minute clock the moment it finishes &#8212; not before it starts.</text>
</svg>
