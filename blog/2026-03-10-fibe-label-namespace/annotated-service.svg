<svg viewBox="0 0 740 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="An annotated Compose service showing each fibe.gg label and what it controls">
  <rect x="0" y="0" width="740" height="420" fill="#181c12"/>
  <text x="24" y="30" fill="#f3f0e0" font-size="14" font-weight="700" font-family="IBM Plex Sans, sans-serif">One service, annotated</text>

  <!-- code panel -->
  <rect x="24" y="46" width="392" height="350" rx="8" fill="#20251a" stroke="#434a35"/>
  <text x="40" y="74" fill="#a19f89" font-size="12" font-family="JetBrains Mono, monospace">services:</text>
  <text x="56" y="92" fill="#c7c4ae" font-size="12" font-family="JetBrains Mono, monospace">web:</text>
  <text x="72" y="110" fill="#c7c4ae" font-size="12" font-family="JetBrains Mono, monospace">image: ruby:3.3</text>
  <text x="72" y="128" fill="#c7c4ae" font-size="12" font-family="JetBrains Mono, monospace">labels:</text>

  <text x="88" y="148" fill="#eec854" font-size="12" font-family="JetBrains Mono, monospace">fibe.gg/repo_url: &#8230;/app</text>
  <text x="88" y="166" fill="#eec854" font-size="12" font-family="JetBrains Mono, monospace">fibe.gg/branch: main</text>
  <text x="88" y="184" fill="#56d8c0" font-size="12" font-family="JetBrains Mono, monospace">fibe.gg/production: "false"</text>
  <text x="88" y="202" fill="#56d8c0" font-size="12" font-family="JetBrains Mono, monospace">fibe.gg/source_mount: /app</text>
  <text x="88" y="220" fill="#56d8c0" font-size="12" font-family="JetBrains Mono, monospace">fibe.gg/start_command: &#8230;</text>
  <text x="88" y="238" fill="#92df62" font-size="12" font-family="JetBrains Mono, monospace">fibe.gg/port: 3000</text>
  <text x="88" y="256" fill="#92df62" font-size="12" font-family="JetBrains Mono, monospace">fibe.gg/visibility: external</text>
  <text x="88" y="274" fill="#92df62" font-size="12" font-family="JetBrains Mono, monospace">fibe.gg/subdomain: app</text>
  <text x="88" y="292" fill="#a19f89" font-size="12" font-family="JetBrains Mono, monospace">fibe.gg/env_file: .env.example</text>

  <!-- annotation markers -->
  <line x1="416" y1="157" x2="468" y2="120" stroke="#e2b33a" stroke-width="1.5"/>
  <line x1="416" y1="210" x2="468" y2="200" stroke="#56d8c0" stroke-width="1.5"/>
  <line x1="416" y1="265" x2="468" y2="300" stroke="#79d44e" stroke-width="1.5"/>

  <!-- gold note -->
  <rect x="468" y="96" width="248" height="64" rx="6" fill="#252a1e" stroke="#e2b33a"/>
  <text x="482" y="118" fill="#eec854" font-size="11" font-weight="700" font-family="IBM Plex Sans, sans-serif">SOURCE</text>
  <text x="482" y="136" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">Where the code lives. Required</text>
  <text x="482" y="151" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">once you mount or build.</text>

  <!-- teal note -->
  <rect x="468" y="174" width="248" height="64" rx="6" fill="#252a1e" stroke="#56d8c0"/>
  <text x="482" y="196" fill="#56d8c0" font-size="11" font-weight="700" font-family="IBM Plex Sans, sans-serif">LIVE DEV</text>
  <text x="482" y="214" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">production:"false" mounts the</text>
  <text x="482" y="229" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">tree; start_command reloads.</text>

  <!-- green note -->
  <rect x="468" y="276" width="248" height="64" rx="6" fill="#252a1e" stroke="#79d44e"/>
  <text x="482" y="298" fill="#92df62" font-size="11" font-weight="700" font-family="IBM Plex Sans, sans-serif">ROUTING</text>
  <text x="482" y="316" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">port + subdomain &#8594; public URL</text>
  <text x="482" y="331" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">app.&lt;marquee-root-domain&gt;</text>

  <text x="24" y="416" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">Non-fibe labels (traefik.*, com.example.*) pass straight through to Docker.</text>
</svg>
