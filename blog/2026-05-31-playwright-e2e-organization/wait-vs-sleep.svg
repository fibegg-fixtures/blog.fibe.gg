<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Before and after: a fixed sleep versus polling on a real status signal">
  <text x="360" y="26" text-anchor="middle" fill="#f3f0e0" font-size="16" font-weight="700" font-family="IBM Plex Sans, sans-serif">Wait on a signal, not a clock</text>

  <!-- BEFORE -->
  <rect x="24" y="48" width="324" height="228" rx="6" fill="#20251a" stroke="#f08760"/>
  <text x="44" y="74" fill="#f08760" font-size="13" font-weight="700" font-family="JetBrains Mono, monospace">BEFORE &#183; fixed sleep</text>

  <rect x="44" y="88" width="284" height="58" rx="4" fill="#252a1e" stroke="#545c42"/>
  <text x="58" y="110" fill="#c7c4ae" font-size="11" font-family="JetBrains Mono, monospace">launch the Playground</text>
  <text x="58" y="130" fill="#f08760" font-size="11" font-family="JetBrains Mono, monospace">sleep a fixed 45 seconds</text>

  <rect x="44" y="156" width="284" height="40" rx="4" fill="#252a1e" stroke="#545c42"/>
  <text x="186" y="180" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="JetBrains Mono, monospace">assert the badge is visible</text>

  <text x="58" y="222" fill="#f08760" font-size="11" font-family="IBM Plex Sans, sans-serif">&#183; too short &#8594; flake on a slow host</text>
  <text x="58" y="240" fill="#f08760" font-size="11" font-family="IBM Plex Sans, sans-serif">&#183; too long &#8594; every run pays the tax</text>
  <text x="58" y="258" fill="#f08760" font-size="11" font-family="IBM Plex Sans, sans-serif">&#183; on timeout: just &quot;not visible&quot;</text>

  <!-- AFTER -->
  <rect x="372" y="48" width="324" height="228" rx="6" fill="#20251a" stroke="#79d44e"/>
  <text x="392" y="74" fill="#92df62" font-size="13" font-weight="700" font-family="JetBrains Mono, monospace">AFTER &#183; poll the status</text>

  <rect x="392" y="88" width="284" height="58" rx="4" fill="#252a1e" stroke="#545c42"/>
  <text x="406" y="110" fill="#c7c4ae" font-size="11" font-family="JetBrains Mono, monospace">launch the Playground</text>
  <text x="406" y="130" fill="#92df62" font-size="11" font-family="JetBrains Mono, monospace">poll the status until it is</text>
  <text x="406" y="146" fill="#92df62" font-size="11" font-family="JetBrains Mono, monospace">running (or fails fast)</text>

  <rect x="392" y="156" width="284" height="40" rx="4" fill="#252a1e" stroke="#545c42"/>
  <text x="534" y="180" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="JetBrains Mono, monospace">assert the badge reads running</text>

  <text x="406" y="222" fill="#92df62" font-size="11" font-family="IBM Plex Sans, sans-serif">&#183; returns the instant it is ready</text>
  <text x="406" y="240" fill="#92df62" font-size="11" font-family="IBM Plex Sans, sans-serif">&#183; error state &#8594; fail fast, no wait</text>
  <text x="406" y="258" fill="#92df62" font-size="11" font-family="IBM Plex Sans, sans-serif">&#183; on timeout: last payload attached</text>
</svg>
