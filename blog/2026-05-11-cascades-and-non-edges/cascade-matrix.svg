<svg viewBox="0 0 740 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cascade matrix: which deletes ripple, which deliberately do not">
  <defs>
    <marker id="cm-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#79d44e"/>
    </marker>
    <marker id="cm-arrow-block" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#f08760"/>
    </marker>
    <marker id="cm-arrow-none" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#757d5e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="740" height="470" fill="#20251a"/>
  <text x="24" y="34" fill="#f3f0e0" font-size="18" font-weight="700" font-family="IBM Plex Sans, sans-serif">The cascade matrix</text>
  <text x="24" y="54" fill="#a19f89" font-size="12" font-family="IBM Plex Sans, sans-serif">solid = an edge that ripples &#183; dashed = a non-edge we proved is absent</text>

  <!-- column headers -->
  <text x="40" y="86" fill="#c7c4ae" font-size="12" font-weight="700" font-family="JetBrains Mono, monospace">SOURCE EVENT</text>
  <text x="380" y="86" fill="#c7c4ae" font-size="12" font-weight="700" font-family="JetBrains Mono, monospace">EFFECT</text>
  <line x1="24" y1="94" x2="716" y2="94" stroke="#434a35" stroke-width="1"/>

  <!-- rows -->
  <!-- 1 -->
  <text x="40" y="124" fill="#f3f0e0" font-size="12" font-family="IBM Plex Sans, sans-serif">Marquee destroyed</text>
  <line x1="248" y1="120" x2="368" y2="120" stroke="#f08760" stroke-width="2" stroke-dasharray="0" marker-end="url(#cm-arrow-block)"/>
  <text x="380" y="124" fill="#f08760" font-size="12" font-family="IBM Plex Sans, sans-serif">Playgrounds block it (delete refused)</text>

  <!-- 2 -->
  <text x="40" y="154" fill="#f3f0e0" font-size="12" font-family="IBM Plex Sans, sans-serif">Marquee destroyed</text>
  <line x1="248" y1="150" x2="368" y2="150" stroke="#79d44e" stroke-width="2" marker-end="url(#cm-arrow)"/>
  <text x="380" y="154" fill="#92df62" font-size="12" font-family="IBM Plex Sans, sans-serif">AgentChats destroyed (rows cascade)</text>

  <!-- 3 -->
  <text x="40" y="184" fill="#f3f0e0" font-size="12" font-family="IBM Plex Sans, sans-serif">Marquee becomes unavailable</text>
  <line x1="248" y1="180" x2="368" y2="180" stroke="#79d44e" stroke-width="2" marker-end="url(#cm-arrow)"/>
  <text x="380" y="184" fill="#92df62" font-size="12" font-family="IBM Plex Sans, sans-serif">Live chats quiesced &#8594; stopped (volume kept)</text>

  <!-- 4 -->
  <text x="40" y="214" fill="#f3f0e0" font-size="12" font-family="IBM Plex Sans, sans-serif">Agent deleted</text>
  <line x1="248" y1="210" x2="368" y2="210" stroke="#79d44e" stroke-width="2" marker-end="url(#cm-arrow)"/>
  <text x="380" y="214" fill="#92df62" font-size="12" font-family="IBM Plex Sans, sans-serif">Its chats torn down (down -v + volumes)</text>

  <!-- 5 -->
  <text x="40" y="244" fill="#f3f0e0" font-size="12" font-family="IBM Plex Sans, sans-serif">Agent deleted</text>
  <line x1="248" y1="240" x2="368" y2="240" stroke="#56d8c0" stroke-width="2" marker-end="url(#cm-arrow)"/>
  <text x="380" y="244" fill="#56d8c0" font-size="12" font-family="IBM Plex Sans, sans-serif">Playgrounds survive (link detached)</text>

  <!-- 6 -->
  <text x="40" y="274" fill="#f3f0e0" font-size="12" font-family="IBM Plex Sans, sans-serif">API key revoked</text>
  <line x1="248" y1="270" x2="368" y2="270" stroke="#eec854" stroke-width="2" marker-end="url(#cm-arrow)"/>
  <text x="380" y="274" fill="#eec854" font-size="12" font-family="IBM Plex Sans, sans-serif">Runtime keys cleared &#8594; chat redeploys</text>

  <line x1="24" y1="294" x2="716" y2="294" stroke="#434a35" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="40" y="318" fill="#a19f89" font-size="11" font-weight="700" font-family="JetBrains Mono, monospace">NON-EDGES &#183; deliberately absent</text>

  <!-- non-edge 1 -->
  <text x="40" y="348" fill="#c7c4ae" font-size="12" font-family="IBM Plex Sans, sans-serif">Prop disabled</text>
  <line x1="248" y1="344" x2="368" y2="344" stroke="#757d5e" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#cm-arrow-none)"/>
  <text x="380" y="348" fill="#a19f89" font-size="12" font-family="IBM Plex Sans, sans-serif">Running Playgrounds &#183; builds: untouched</text>

  <!-- non-edge 2 -->
  <text x="40" y="378" fill="#c7c4ae" font-size="12" font-family="IBM Plex Sans, sans-serif">Secret vault changed</text>
  <line x1="248" y1="374" x2="368" y2="374" stroke="#757d5e" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#cm-arrow-none)"/>
  <text x="380" y="378" fill="#a19f89" font-size="12" font-family="IBM Plex Sans, sans-serif">Genie does NOT redeploy</text>

  <!-- non-edge 3 -->
  <text x="40" y="408" fill="#c7c4ae" font-size="12" font-family="IBM Plex Sans, sans-serif">Team role revoked</text>
  <line x1="248" y1="404" x2="368" y2="404" stroke="#757d5e" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#cm-arrow-none)"/>
  <text x="380" y="408" fill="#a19f89" font-size="12" font-family="IBM Plex Sans, sans-serif">Live session NOT killed (access is per-request)</text>

  <!-- non-edge 4 -->
  <text x="40" y="438" fill="#c7c4ae" font-size="12" font-family="IBM Plex Sans, sans-serif">API-key scope changed</text>
  <line x1="248" y1="434" x2="368" y2="434" stroke="#757d5e" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#cm-arrow-none)"/>
  <text x="380" y="438" fill="#a19f89" font-size="12" font-family="IBM Plex Sans, sans-serif">No redeploy; applies on next request</text>
</svg>
