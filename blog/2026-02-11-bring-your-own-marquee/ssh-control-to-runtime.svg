<svg viewBox="0 0 740 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="How Fibe drives a bring-your-own host over SSH: the control plane reaches the Docker host, rsyncs a generated compose file to a Fibe-owned directory, runs docker compose up, and Traefik routes traffic">
  <defs>
    <marker id="ctl-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#79d44e"/>
    </marker>
    <marker id="ctl-arrow-gold" markerWidth="10" markerHeight="10" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#eec854"/>
    </marker>
  </defs>

  <text x="370" y="26" text-anchor="middle" fill="#f3f0e0" font-size="16" font-weight="700" font-family="IBM Plex Sans, sans-serif">Control plane &#8594; your host, over SSH</text>

  <!-- Control plane panel -->
  <rect x="20" y="48" width="220" height="360" rx="8" fill="#20251a" stroke="#434a35"/>
  <text x="130" y="72" text-anchor="middle" fill="#eec854" font-size="13" font-weight="700" font-family="IBM Plex Sans, sans-serif">Fibe control plane</text>
  <text x="130" y="88" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">(Rails + Sidekiq)</text>

  <rect x="40" y="104" width="180" height="48" rx="6" fill="#252a1e" stroke="#545c42"/>
  <text x="130" y="124" text-anchor="middle" fill="#c7c4ae" font-size="12" font-family="IBM Plex Sans, sans-serif">Entitlement check</text>
  <text x="130" y="140" text-anchor="middle" fill="#eec854" font-size="11" font-family="IBM Plex Sans, sans-serif">funding gate (402)</text>

  <rect x="40" y="164" width="180" height="48" rx="6" fill="#252a1e" stroke="#545c42"/>
  <text x="130" y="184" text-anchor="middle" fill="#c7c4ae" font-size="12" font-family="IBM Plex Sans, sans-serif">Compose render</text>
  <text x="130" y="200" text-anchor="middle" fill="#56d8c0" font-size="11" font-family="IBM Plex Sans, sans-serif">placeholders resolved</text>

  <rect x="40" y="224" width="180" height="48" rx="6" fill="#252a1e" stroke="#545c42"/>
  <text x="130" y="244" text-anchor="middle" fill="#c7c4ae" font-size="12" font-family="IBM Plex Sans, sans-serif">File sync</text>
  <text x="130" y="260" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">rsync &#183; retries &#183; backoff</text>

  <rect x="40" y="284" width="180" height="48" rx="6" fill="#252a1e" stroke="#545c42"/>
  <text x="130" y="304" text-anchor="middle" fill="#c7c4ae" font-size="12" font-family="IBM Plex Sans, sans-serif">Compose runner</text>
  <text x="130" y="320" text-anchor="middle" fill="#92df62" font-size="11" font-family="JetBrains Mono, monospace">docker compose -p -f up</text>

  <rect x="40" y="344" width="180" height="48" rx="6" fill="#252a1e" stroke="#545c42"/>
  <text x="130" y="364" text-anchor="middle" fill="#c7c4ae" font-size="12" font-family="IBM Plex Sans, sans-serif">Playguard reconciler</text>
  <text x="130" y="380" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">probe &#8594; repair every 60s</text>

  <!-- SSH channel -->
  <line x1="240" y1="228" x2="320" y2="228" stroke="#79d44e" stroke-width="2.5" marker-end="url(#ctl-arrow)"/>
  <text x="280" y="218" text-anchor="middle" fill="#92df62" font-size="11.5" font-weight="700" font-family="JetBrains Mono, monospace">SSH</text>
  <text x="280" y="246" text-anchor="middle" fill="#a19f89" font-size="10" font-family="JetBrains Mono, monospace">ssh://user@host:port</text>

  <!-- Host panel -->
  <rect x="328" y="48" width="392" height="360" rx="8" fill="#20251a" stroke="#56d8c0"/>
  <text x="524" y="72" text-anchor="middle" fill="#56d8c0" font-size="13" font-weight="700" font-family="IBM Plex Sans, sans-serif">Your Docker host (the Marquee)</text>

  <!-- Fibe-owned root -->
  <rect x="348" y="92" width="352" height="156" rx="6" fill="#252a1e" stroke="#545c42"/>
  <text x="364" y="112" fill="#eec854" font-size="12" font-weight="700" font-family="IBM Plex Sans, sans-serif">Fibe-owned root directory</text>
  <text x="364" y="134" fill="#c7c4ae" font-size="11.5" font-family="IBM Plex Sans, sans-serif">per-environment compose file</text>
  <text x="364" y="154" fill="#c7c4ae" font-size="11.5" font-family="IBM Plex Sans, sans-serif">owner-marker file per environment</text>
  <text x="364" y="174" fill="#c7c4ae" font-size="11.5" font-family="IBM Plex Sans, sans-serif">source repos by app and branch</text>
  <text x="364" y="194" fill="#c7c4ae" font-size="11.5" font-family="IBM Plex Sans, sans-serif">per-environment Docker config</text>
  <text x="364" y="214" fill="#c7c4ae" font-size="11.5" font-family="IBM Plex Sans, sans-serif">shared build and agent state</text>
  <text x="364" y="234" fill="#a19f89" font-size="10.5" font-family="IBM Plex Sans, sans-serif">rsync target &#183; owner marker proves it's ours</text>

  <!-- compose project -->
  <rect x="348" y="262" width="180" height="78" rx="6" fill="#252a1e" stroke="#79d44e"/>
  <text x="438" y="284" text-anchor="middle" fill="#92df62" font-size="12" font-weight="700" font-family="IBM Plex Sans, sans-serif">Compose project</text>
  <text x="438" y="304" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">Playground &#183; Trick</text>
  <text x="438" y="322" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">AgentChat sidecar</text>

  <!-- traefik -->
  <rect x="544" y="262" width="156" height="78" rx="6" fill="#252a1e" stroke="#eec854"/>
  <text x="622" y="284" text-anchor="middle" fill="#eec854" font-size="12" font-weight="700" font-family="IBM Plex Sans, sans-serif">Traefik</text>
  <text x="622" y="304" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">wildcard TLS</text>
  <text x="622" y="322" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">routes *.domain</text>

  <line x1="528" y1="301" x2="542" y2="301" stroke="#eec854" stroke-width="2" marker-end="url(#ctl-arrow-gold)"/>

  <!-- public -->
  <rect x="348" y="356" width="352" height="42" rx="6" fill="#252a1e" stroke="#434a35"/>
  <text x="524" y="382" text-anchor="middle" fill="#abe87f" font-size="11.5" font-family="IBM Plex Sans, sans-serif">https://&#171;sub&#187;.your-domain &#8594; Traefik &#8594; container</text>
</svg>
