<svg viewBox="0 0 740 392" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Annotated map of a minimal job-mode template showing the watched test service, an unwatched database helper, and the metadata job_mode flag">
  <rect x="0" y="0" width="740" height="392" fill="#1b1f16"/>
  <text x="370" y="28" text-anchor="middle" fill="#f3f0e0" font-size="16" font-weight="700" font-family="IBM Plex Sans, sans-serif">Where the labels go on a Trick</text>

  <!-- compose root -->
  <text x="34" y="58" fill="#c7c4ae" font-size="13" font-family="JetBrains Mono, monospace">services:</text>

  <!-- watched service -->
  <rect x="48" y="70" width="420" height="146" rx="7" fill="#20251a" stroke="#5cb43a"/>
  <text x="64" y="92" fill="#92df62" font-size="13" font-weight="700" font-family="JetBrains Mono, monospace">test:</text>
  <text x="80" y="113" fill="#c7c4ae" font-size="12" font-family="JetBrains Mono, monospace">image: node:22</text>
  <text x="80" y="132" fill="#c7c4ae" font-size="12" font-family="JetBrains Mono, monospace">labels:</text>
  <text x="96" y="151" fill="#abe87f" font-size="12" font-family="JetBrains Mono, monospace">fibe.gg/source_mount: /app</text>
  <text x="96" y="170" fill="#abe87f" font-size="12" font-family="JetBrains Mono, monospace">fibe.gg/start_command: npm test</text>
  <text x="96" y="189" fill="#eec854" font-size="12" font-weight="700" font-family="JetBrains Mono, monospace">fibe.gg/job_watch: "true"</text>
  <text x="96" y="208" fill="#a19f89" font-size="12" font-family="JetBrains Mono, monospace">fibe.gg/production: "false"</text>

  <rect x="486" y="118" width="236" height="60" rx="6" fill="#252a1e" stroke="#eec854"/>
  <text x="604" y="142" text-anchor="middle" fill="#eec854" font-size="11.5" font-weight="700" font-family="IBM Plex Sans, sans-serif">WATCHED service</text>
  <text x="604" y="162" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">its exit code is the result</text>

  <!-- unwatched helper -->
  <rect x="48" y="226" width="420" height="78" rx="7" fill="#20251a" stroke="#545c42"/>
  <text x="64" y="248" fill="#56d8c0" font-size="13" font-weight="700" font-family="JetBrains Mono, monospace">db:</text>
  <text x="80" y="269" fill="#c7c4ae" font-size="12" font-family="JetBrains Mono, monospace">image: postgres:17</text>
  <text x="80" y="288" fill="#a19f89" font-size="12" font-family="JetBrains Mono, monospace">(no job_watch label)</text>

  <rect x="486" y="240" width="236" height="52" rx="6" fill="#252a1e" stroke="#434a35"/>
  <text x="604" y="262" text-anchor="middle" fill="#56d8c0" font-size="11.5" font-weight="700" font-family="IBM Plex Sans, sans-serif">UNWATCHED helper</text>
  <text x="604" y="280" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">torn down when test exits</text>

  <!-- metadata -->
  <rect x="48" y="316" width="674" height="60" rx="7" fill="#20251a" stroke="#eec854"/>
  <text x="64" y="338" fill="#c7c4ae" font-size="12.5" font-family="JetBrains Mono, monospace">x-fibe.gg:</text>
  <text x="80" y="357" fill="#c7c4ae" font-size="12.5" font-family="JetBrains Mono, monospace">metadata:</text>
  <text x="96" y="357" fill="#c7c4ae" font-size="12.5" font-family="JetBrains Mono, monospace" opacity="0"> </text>
  <text x="200" y="357" fill="#eec854" font-size="12.5" font-weight="700" font-family="JetBrains Mono, monospace">job_mode: true</text>
  <text x="430" y="357" fill="#a19f89" font-size="11.5" font-family="IBM Plex Sans, sans-serif">&#8592; without this, job_watch is ignored</text>
</svg>
