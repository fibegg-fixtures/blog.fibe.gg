<svg viewBox="0 0 740 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The per-service environment merge, later layers winning">
  <defs>
    <marker id="arrENV" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#eec854"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="740" height="420" fill="#20251a"/>
  <text x="24" y="32" fill="#f3f0e0" font-size="17" font-weight="700" font-family="IBM Plex Sans, sans-serif">Env merge &#183; later layers win</text>
  <text x="24" y="52" fill="#a19f89" font-size="12" font-family="IBM Plex Sans, sans-serif">Computed per service, then handed to the compose CLI on the host.</text>

  <!-- layers -->
  <rect x="40" y="70" width="300" height="34" rx="5" fill="#252a1e" stroke="#434a35"/>
  <text x="56" y="92" fill="#c7c4ae" font-size="13" font-family="JetBrains Mono, monospace">defaults</text>
  <text x="318" y="92" text-anchor="end" fill="#757d5e" font-size="11" font-family="IBM Plex Sans, sans-serif">lowest</text>

  <rect x="40" y="110" width="300" height="34" rx="5" fill="#252a1e" stroke="#434a35"/>
  <text x="56" y="132" fill="#c7c4ae" font-size="13" font-family="JetBrains Mono, monospace">global overrides</text>

  <rect x="40" y="150" width="300" height="34" rx="5" fill="#252a1e" stroke="#434a35"/>
  <text x="56" y="172" fill="#c7c4ae" font-size="13" font-family="JetBrains Mono, monospace">job env</text>

  <rect x="40" y="190" width="300" height="34" rx="5" fill="#252a1e" stroke="#434a35"/>
  <text x="56" y="212" fill="#c7c4ae" font-size="13" font-family="JetBrains Mono, monospace">per-service overrides</text>

  <rect x="40" y="230" width="300" height="34" rx="5" fill="#252a1e" stroke="#79d44e"/>
  <text x="56" y="252" fill="#92df62" font-size="13" font-weight="700" font-family="JetBrains Mono, monospace">built-in FIBE_*</text>

  <rect x="40" y="270" width="300" height="34" rx="5" fill="#252a1e" stroke="#545c42"/>
  <text x="56" y="292" fill="#c7c4ae" font-size="13" font-family="JetBrains Mono, monospace">static system env</text>
  <text x="318" y="292" text-anchor="end" fill="#abe87f" font-size="11" font-family="IBM Plex Sans, sans-serif">highest</text>

  <line x1="190" y1="304" x2="190" y2="332" stroke="#79d44e" stroke-width="2"/>
  <rect x="40" y="336" width="300" height="40" rx="6" fill="#20251a" stroke="#5cb43a"/>
  <text x="190" y="361" text-anchor="middle" fill="#abe87f" font-size="13" font-weight="700" font-family="IBM Plex Sans, sans-serif">merged env (deterministic, in Rust)</text>

  <!-- arrow to FIBE_* box -->
  <line x1="346" y1="247" x2="392" y2="247" stroke="#eec854" stroke-width="2" marker-end="url(#arrENV)"/>

  <!-- FIBE_* values -->
  <rect x="398" y="70" width="318" height="306" rx="8" fill="#252a1e" stroke="#545c42"/>
  <text x="414" y="92" fill="#92df62" font-size="13" font-weight="700" font-family="JetBrains Mono, monospace">Built-in FIBE_* (job mode)</text>
  <text x="414" y="120" fill="#f3f0e0" font-size="12" font-family="JetBrains Mono, monospace">FIBE_REPOSITORY_URL</text>
  <text x="414" y="143" fill="#f3f0e0" font-size="12" font-family="JetBrains Mono, monospace">FIBE_REPOSITORY_OWNER</text>
  <text x="414" y="166" fill="#f3f0e0" font-size="12" font-family="JetBrains Mono, monospace">FIBE_REPOSITORY_NAME</text>
  <text x="414" y="189" fill="#f3f0e0" font-size="12" font-family="JetBrains Mono, monospace">FIBE_BRANCH</text>
  <text x="414" y="212" fill="#f3f0e0" font-size="12" font-family="JetBrains Mono, monospace">FIBE_COMMIT_SHA</text>
  <text x="414" y="235" fill="#f3f0e0" font-size="12" font-family="JetBrains Mono, monospace">FIBE_TRIGGER_EVENT</text>
  <text x="414" y="258" fill="#f3f0e0" font-size="12" font-family="JetBrains Mono, monospace">FIBE_PROP_ID</text>
  <text x="414" y="281" fill="#f3f0e0" font-size="12" font-family="JetBrains Mono, monospace">FIBE_PLAYSPEC_ID</text>
  <text x="414" y="304" fill="#f3f0e0" font-size="12" font-family="JetBrains Mono, monospace">FIBE_PLAYGROUND_ID</text>
  <text x="414" y="338" fill="#eec854" font-size="11" font-family="IBM Plex Sans, sans-serif">Secret-scoped values merge only for a</text>
  <text x="414" y="356" fill="#eec854" font-size="11" font-family="IBM Plex Sans, sans-serif">job run that opted in to receiving secrets.</text>
</svg>
