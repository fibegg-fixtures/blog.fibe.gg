<svg viewBox="0 0 760 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Comparison of launch variable, Secret Vault, and Job ENV across scope, reuse, and masking">
  <text x="380" y="26" text-anchor="middle" fill="#f3f0e0" font-size="16" font-weight="700" font-family="IBM Plex Sans, sans-serif">Three homes, side by side</text>

  <!-- column headers -->
  <rect x="200" y="42" width="180" height="40" rx="6" fill="#252a1e" stroke="#545c42"/>
  <rect x="386" y="42" width="180" height="40" rx="6" fill="#252a1e" stroke="#545c42"/>
  <rect x="572" y="42" width="178" height="40" rx="6" fill="#252a1e" stroke="#545c42"/>
  <text x="290" y="67" text-anchor="middle" fill="#92df62" font-size="13" font-weight="700" font-family="JetBrains Mono, monospace">Launch variable</text>
  <text x="476" y="67" text-anchor="middle" fill="#56d8c0" font-size="13" font-weight="700" font-family="JetBrains Mono, monospace">Secret Vault</text>
  <text x="661" y="67" text-anchor="middle" fill="#f5da79" font-size="13" font-weight="700" font-family="JetBrains Mono, monospace">Job ENV</text>

  <!-- row: Scope -->
  <rect x="14" y="90" width="180" height="46" rx="6" fill="#20251a" stroke="#434a35"/>
  <text x="24" y="118" fill="#c7c4ae" font-size="13" font-weight="700" font-family="IBM Plex Sans, sans-serif">Scope</text>
  <text x="290" y="112" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">one launch</text>
  <text x="290" y="127" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">(this Playground)</text>
  <text x="476" y="112" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">Player-scoped</text>
  <text x="476" y="127" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">(account-wide)</text>
  <text x="661" y="112" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">Player or Prop</text>
  <text x="661" y="127" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">(Trick runs only)</text>

  <!-- row: Reuse -->
  <rect x="14" y="142" width="180" height="46" rx="6" fill="#20251a" stroke="#434a35"/>
  <text x="24" y="170" fill="#c7c4ae" font-size="13" font-weight="700" font-family="IBM Plex Sans, sans-serif">Reuse</text>
  <text x="290" y="170" text-anchor="middle" fill="#f08760" font-size="11" font-family="IBM Plex Sans, sans-serif">re-entered each launch</text>
  <text x="476" y="170" text-anchor="middle" fill="#92df62" font-size="11" font-family="IBM Plex Sans, sans-serif">fetched by name, many places</text>
  <text x="661" y="170" text-anchor="middle" fill="#92df62" font-size="11" font-family="IBM Plex Sans, sans-serif">auto-injected, every run</text>

  <!-- row: Encryption -->
  <rect x="14" y="194" width="180" height="46" rx="6" fill="#20251a" stroke="#434a35"/>
  <text x="24" y="216" fill="#c7c4ae" font-size="13" font-weight="700" font-family="IBM Plex Sans, sans-serif">At rest</text>
  <text x="290" y="222" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">stored with the launch</text>
  <text x="476" y="222" text-anchor="middle" fill="#92df62" font-size="11" font-family="IBM Plex Sans, sans-serif">encrypted, 2FA to reveal</text>
  <text x="661" y="222" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">stored as env entries</text>

  <!-- row: Masking -->
  <rect x="14" y="246" width="180" height="46" rx="6" fill="#20251a" stroke="#434a35"/>
  <text x="24" y="268" fill="#c7c4ae" font-size="13" font-weight="700" font-family="IBM Plex Sans, sans-serif">Masking</text>
  <text x="290" y="262" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="JetBrains Mono, monospace">secret: / sensitive:</text>
  <text x="290" y="277" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">UI hints in launcher</text>
  <text x="476" y="269" text-anchor="middle" fill="#92df62" font-size="11" font-family="IBM Plex Sans, sans-serif">never shown, metadata only</text>
  <text x="661" y="262" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">scrubbed from logs;</text>
  <text x="661" y="277" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">withheld from PR runs</text>

  <!-- row: Best for -->
  <rect x="14" y="298" width="180" height="46" rx="6" fill="#20251a" stroke="#434a35"/>
  <text x="24" y="320" fill="#eec854" font-size="13" font-weight="700" font-family="IBM Plex Sans, sans-serif">Best for</text>
  <text x="290" y="320" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">launch config + master keys</text>
  <text x="290" y="335" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">+ random-generated DB pw</text>
  <text x="476" y="328" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">external API tokens you rotate</text>
  <text x="661" y="328" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">CI / cron / backup creds</text>
</svg>
