<svg viewBox="0 0 740 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The eight-step Playground creation pipeline: start the router, clone the source, set up registry auth, build the image, run pre-start teardown, generate the compose file, start the agent, and bring the stack up, each announcing its current step, with failure routing to error or back to pending">
  <defs>
    <marker id="cp-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5cb43a"/>
    </marker>
    <marker id="cp-fail" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#f08760"/>
    </marker>
    <marker id="cp-requeue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#eec854"/>
    </marker>
  </defs>

  <text x="24" y="30" fill="#f3f0e0" font-size="17" font-weight="700" font-family="IBM Plex Sans, sans-serif">The creation job claims a pending row &#183; each step announces itself</text>

  <!-- claim box -->
  <rect x="200" y="48" width="280" height="42" rx="6" fill="#252a1e" stroke="#757d5e"/>
  <text x="340" y="68" text-anchor="middle" fill="#f3f0e0" font-size="13" font-family="JetBrains Mono, monospace">pending &#8594; in progress</text>
  <text x="340" y="84" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">row lock + reload, then flip the status</text>
  <line x1="340" y1="90" x2="340" y2="110" stroke="#5cb43a" stroke-width="2" marker-end="url(#cp-arrow)"/>

  <!-- steps -->
  <!-- step template: y for each row -->
  <!-- 1 -->
  <rect x="60" y="112" width="560" height="56" rx="6" fill="#20251a" stroke="#434a35"/>
  <circle cx="92" cy="140" r="15" fill="#1a1f14" stroke="#5cb43a"/>
  <text x="92" y="145" text-anchor="middle" fill="#92df62" font-size="14" font-weight="700" font-family="JetBrains Mono, monospace">1</text>
  <text x="120" y="135" fill="#92df62" font-size="14" font-weight="700" font-family="IBM Plex Sans, sans-serif">Start the front door</text>
  <text x="120" y="155" fill="#c7c4ae" font-size="11.5" font-family="IBM Plex Sans, sans-serif">ensure the router is up &#183; skipped in job mode</text>

  <!-- 2 -->
  <rect x="60" y="184" width="560" height="56" rx="6" fill="#20251a" stroke="#434a35"/>
  <circle cx="92" cy="212" r="15" fill="#1a1f14" stroke="#5cb43a"/>
  <text x="92" y="217" text-anchor="middle" fill="#92df62" font-size="14" font-weight="700" font-family="JetBrains Mono, monospace">2</text>
  <text x="120" y="207" fill="#92df62" font-size="14" font-weight="700" font-family="IBM Plex Sans, sans-serif">Clone the source</text>
  <text x="120" y="227" fill="#c7c4ae" font-size="11.5" font-family="IBM Plex Sans, sans-serif">sync prop source to the host &#183; clone failure is a user error</text>

  <!-- 3 -->
  <rect x="60" y="256" width="560" height="56" rx="6" fill="#20251a" stroke="#434a35"/>
  <circle cx="92" cy="284" r="15" fill="#1a1f14" stroke="#5cb43a"/>
  <text x="92" y="289" text-anchor="middle" fill="#92df62" font-size="14" font-weight="700" font-family="JetBrains Mono, monospace">3</text>
  <text x="120" y="279" fill="#92df62" font-size="14" font-weight="700" font-family="IBM Plex Sans, sans-serif">Set up registry auth</text>
  <text x="120" y="299" fill="#c7c4ae" font-size="11.5" font-family="IBM Plex Sans, sans-serif">merge Marquee + Playspec creds into a Docker config file</text>

  <!-- 4 -->
  <rect x="60" y="328" width="560" height="56" rx="6" fill="#20251a" stroke="#434a35"/>
  <circle cx="92" cy="356" r="15" fill="#1a1f14" stroke="#5cb43a"/>
  <text x="92" y="361" text-anchor="middle" fill="#92df62" font-size="14" font-weight="700" font-family="JetBrains Mono, monospace">4</text>
  <text x="120" y="351" fill="#92df62" font-size="14" font-weight="700" font-family="IBM Plex Sans, sans-serif">Build the image</text>
  <text x="120" y="371" fill="#c7c4ae" font-size="11.5" font-family="IBM Plex Sans, sans-serif">build or reuse a valid image &#183; live rollouts preserve runtime</text>

  <!-- 5 -->
  <rect x="60" y="400" width="560" height="56" rx="6" fill="#20251a" stroke="#434a35"/>
  <circle cx="92" cy="428" r="15" fill="#1a1f14" stroke="#5cb43a"/>
  <text x="92" y="433" text-anchor="middle" fill="#92df62" font-size="14" font-weight="700" font-family="JetBrains Mono, monospace">5</text>
  <text x="120" y="423" fill="#92df62" font-size="14" font-weight="700" font-family="IBM Plex Sans, sans-serif">Run pre-start teardown</text>
  <text x="120" y="443" fill="#c7c4ae" font-size="11.5" font-family="IBM Plex Sans, sans-serif">apply any declared teardown before the new stack starts</text>

  <!-- 6 -->
  <rect x="60" y="472" width="560" height="56" rx="6" fill="#20251a" stroke="#434a35"/>
  <circle cx="92" cy="500" r="15" fill="#1a1f14" stroke="#5cb43a"/>
  <text x="92" y="505" text-anchor="middle" fill="#92df62" font-size="14" font-weight="700" font-family="JetBrains Mono, monospace">6</text>
  <text x="120" y="495" fill="#92df62" font-size="14" font-weight="700" font-family="IBM Plex Sans, sans-serif">Generate the compose file</text>
  <text x="120" y="515" fill="#c7c4ae" font-size="11.5" font-family="IBM Plex Sans, sans-serif">render compose &#183; unresolved ${...} fails here</text>

  <!-- 7 -->
  <rect x="60" y="544" width="560" height="56" rx="6" fill="#20251a" stroke="#434a35"/>
  <circle cx="92" cy="572" r="15" fill="#1a1f14" stroke="#5cb43a"/>
  <text x="92" y="577" text-anchor="middle" fill="#92df62" font-size="14" font-weight="700" font-family="JetBrains Mono, monospace">7</text>
  <text x="120" y="567" fill="#92df62" font-size="14" font-weight="700" font-family="IBM Plex Sans, sans-serif">Start the agent</text>
  <text x="120" y="587" fill="#c7c4ae" font-size="11.5" font-family="IBM Plex Sans, sans-serif">only when an agent is attached and not job mode</text>

  <!-- 8 -->
  <rect x="60" y="616" width="560" height="56" rx="6" fill="#1c241a" stroke="#5cb43a" stroke-width="2"/>
  <circle cx="92" cy="644" r="15" fill="#1a1f14" stroke="#92df62"/>
  <text x="92" y="649" text-anchor="middle" fill="#abe87f" font-size="14" font-weight="700" font-family="JetBrains Mono, monospace">8</text>
  <text x="120" y="639" fill="#abe87f" font-size="14" font-weight="700" font-family="IBM Plex Sans, sans-serif">Bring the stack up</text>
  <text x="120" y="659" fill="#c7c4ae" font-size="11.5" font-family="IBM Plex Sans, sans-serif">docker compose up over SSH &#8594; mark running + reconcile</text>

  <!-- connecting arrows between steps -->
  <line x1="340" y1="168" x2="340" y2="183" stroke="#5cb43a" stroke-width="2" marker-end="url(#cp-arrow)"/>
  <line x1="340" y1="240" x2="340" y2="255" stroke="#5cb43a" stroke-width="2" marker-end="url(#cp-arrow)"/>
  <line x1="340" y1="312" x2="340" y2="327" stroke="#5cb43a" stroke-width="2" marker-end="url(#cp-arrow)"/>
  <line x1="340" y1="384" x2="340" y2="399" stroke="#5cb43a" stroke-width="2" marker-end="url(#cp-arrow)"/>
  <line x1="340" y1="456" x2="340" y2="471" stroke="#5cb43a" stroke-width="2" marker-end="url(#cp-arrow)"/>
  <line x1="340" y1="528" x2="340" y2="543" stroke="#5cb43a" stroke-width="2" marker-end="url(#cp-arrow)"/>
  <line x1="340" y1="600" x2="340" y2="615" stroke="#5cb43a" stroke-width="2" marker-end="url(#cp-arrow)"/>

  <!-- failure rail (right) -->
  <line x1="628" y1="140" x2="690" y2="140" stroke="#f08760" stroke-width="1.5" marker-end="url(#cp-fail)"/>
  <line x1="690" y1="140" x2="690" y2="644" stroke="#f08760" stroke-width="1.5"/>
  <line x1="628" y1="644" x2="690" y2="644" stroke="#f08760" stroke-width="1.5"/>
  <text x="700" y="380" fill="#f08760" font-size="12" font-weight="700" font-family="IBM Plex Sans, sans-serif" transform="rotate(90 700 380)">user / fatal error &#8594; error</text>

  <!-- requeue rail (left) -->
  <line x1="52" y1="284" x2="28" y2="284" stroke="#eec854" stroke-width="1.5"/>
  <line x1="28" y1="284" x2="28" y2="69" stroke="#eec854" stroke-width="1.5"/>
  <line x1="28" y1="69" x2="198" y2="69" stroke="#eec854" stroke-width="1.5" marker-end="url(#cp-requeue)"/>
  <text x="20" y="180" fill="#eec854" font-size="12" font-weight="700" font-family="IBM Plex Sans, sans-serif" transform="rotate(-90 20 180)">temporary infra &#8594; requeue to pending</text>
</svg>
