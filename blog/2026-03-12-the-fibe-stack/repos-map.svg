<svg viewBox="0 0 740 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Map of Fibe repositories and how they depend on one another">
  <defs>
    <marker id="repoArrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#757d5e"/>
    </marker>
  </defs>
  <text x="370" y="28" text-anchor="middle" fill="#f3f0e0" font-size="17" font-weight="700" font-family="IBM Plex Sans, sans-serif">Six repos, one platform</text>

  <!-- fibe (center) -->
  <rect x="270" y="170" width="200" height="86" rx="8" fill="#252a1e" stroke="#79d44e" stroke-width="1.8"/>
  <text x="370" y="200" text-anchor="middle" fill="#92df62" font-size="15" font-weight="700" font-family="JetBrains Mono, monospace">fibe</text>
  <text x="370" y="222" text-anchor="middle" fill="#c7c4ae" font-size="12" font-family="IBM Plex Sans, sans-serif">Rails control plane</text>
  <text x="370" y="242" text-anchor="middle" fill="#a19f89" font-size="11" font-family="JetBrains Mono, monospace">vendors fibe-core-rs</text>

  <!-- sdk top-left -->
  <rect x="48" y="60" width="178" height="74" rx="8" fill="#20251a" stroke="#56d8c0"/>
  <text x="137" y="88" text-anchor="middle" fill="#56d8c0" font-size="13.5" font-weight="700" font-family="JetBrains Mono, monospace">sdk</text>
  <text x="137" y="108" text-anchor="middle" fill="#c7c4ae" font-size="11.5" font-family="IBM Plex Sans, sans-serif">Go CLI / MCP</text>
  <text x="137" y="125" text-anchor="middle" fill="#a19f89" font-size="10.5" font-family="JetBrains Mono, monospace">brew release</text>

  <!-- fibe-agent top-right -->
  <rect x="514" y="60" width="178" height="74" rx="8" fill="#20251a" stroke="#56d8c0"/>
  <text x="603" y="88" text-anchor="middle" fill="#56d8c0" font-size="13.5" font-weight="700" font-family="JetBrains Mono, monospace">fibe-agent</text>
  <text x="603" y="108" text-anchor="middle" fill="#c7c4ae" font-size="11.5" font-family="IBM Plex Sans, sans-serif">NestJS Genie</text>
  <text x="603" y="125" text-anchor="middle" fill="#a19f89" font-size="10.5" font-family="JetBrains Mono, monospace">runs as sidecar</text>

  <!-- infra bottom-left -->
  <rect x="48" y="300" width="178" height="74" rx="8" fill="#20251a" stroke="#f08760"/>
  <text x="137" y="328" text-anchor="middle" fill="#f08760" font-size="13.5" font-weight="700" font-family="JetBrains Mono, monospace">infra</text>
  <text x="137" y="348" text-anchor="middle" fill="#c7c4ae" font-size="11.5" font-family="IBM Plex Sans, sans-serif">Terraform / K8s</text>
  <text x="137" y="365" text-anchor="middle" fill="#a19f89" font-size="10.5" font-family="JetBrains Mono, monospace">Scaleway</text>

  <!-- tutorial bottom-center -->
  <rect x="281" y="320" width="178" height="74" rx="8" fill="#20251a" stroke="#f08760"/>
  <text x="370" y="348" text-anchor="middle" fill="#f08760" font-size="13.5" font-weight="700" font-family="JetBrains Mono, monospace">tutorial</text>
  <text x="370" y="368" text-anchor="middle" fill="#c7c4ae" font-size="11.5" font-family="IBM Plex Sans, sans-serif">Actions + Terraform</text>
  <text x="370" y="385" text-anchor="middle" fill="#a19f89" font-size="10.5" font-family="JetBrains Mono, monospace">managed VMs</text>

  <!-- playwright bottom-right -->
  <rect x="514" y="300" width="178" height="74" rx="8" fill="#20251a" stroke="#757d5e"/>
  <text x="603" y="328" text-anchor="middle" fill="#abe87f" font-size="13.5" font-weight="700" font-family="JetBrains Mono, monospace">e2e-tests</text>
  <text x="603" y="348" text-anchor="middle" fill="#c7c4ae" font-size="11.5" font-family="IBM Plex Sans, sans-serif">Playwright</text>
  <text x="603" y="365" text-anchor="middle" fill="#a19f89" font-size="10.5" font-family="JetBrains Mono, monospace">drives the whole UI</text>

  <!-- arrows: everything relates to fibe -->
  <line x1="226" y1="110" x2="285" y2="172" stroke="#757d5e" stroke-width="1.5" marker-end="url(#repoArrow)"/>
  <text x="232" y="150" fill="#a19f89" font-size="10" font-family="JetBrains Mono, monospace">calls API</text>

  <line x1="514" y1="110" x2="456" y2="172" stroke="#757d5e" stroke-width="1.5" marker-end="url(#repoArrow)"/>
  <text x="470" y="150" fill="#a19f89" font-size="10" font-family="JetBrains Mono, monospace">deployed by</text>

  <line x1="226" y1="320" x2="290" y2="252" stroke="#757d5e" stroke-width="1.5" marker-end="url(#repoArrow)"/>
  <text x="200" y="290" fill="#a19f89" font-size="10" font-family="JetBrains Mono, monospace">hosts</text>

  <line x1="370" y1="320" x2="370" y2="258" stroke="#757d5e" stroke-width="1.5" marker-end="url(#repoArrow)"/>
  <text x="378" y="295" fill="#a19f89" font-size="10" font-family="JetBrains Mono, monospace">provisions for</text>

  <line x1="514" y1="320" x2="452" y2="252" stroke="#757d5e" stroke-width="1.5" marker-end="url(#repoArrow)"/>
  <text x="500" y="290" fill="#a19f89" font-size="10" font-family="JetBrains Mono, monospace">tests</text>
</svg>
