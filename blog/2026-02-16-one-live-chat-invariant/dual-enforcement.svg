<svg viewBox="0 0 720 392" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Dual enforcement of the one-live-chat invariant: application logic reuses the row, the database unique index is the last line of defense">
  <defs>
    <marker id="de-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#757d5e"/>
    </marker>
    <marker id="de-arrow-green" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#5cb43a"/>
    </marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" fill="#f3f0e0" font-size="17" font-weight="700" font-family="IBM Plex Sans, sans-serif">One live chat per (agent, marquee) &#183; enforced twice</text>

  <!-- start request -->
  <rect x="276" y="48" width="168" height="46" rx="6" fill="#252a1e" stroke="#545c42"/>
  <text x="360" y="68" text-anchor="middle" fill="#f3f0e0" font-size="13" font-family="IBM Plex Sans, sans-serif">start (agent, marquee)</text>
  <text x="360" y="85" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">idempotent entry point</text>

  <!-- Layer 1: application -->
  <rect x="40" y="124" width="296" height="158" rx="8" fill="#20251a" stroke="#434a35"/>
  <text x="60" y="148" fill="#92df62" font-size="13" font-weight="700" font-family="IBM Plex Sans, sans-serif">1 &#183; Application logic (convenient)</text>

  <rect x="60" y="160" width="256" height="44" rx="5" fill="#252a1e" stroke="#434a35"/>
  <text x="188" y="178" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">look up a running or pending</text>
  <text x="188" y="194" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">chat for this agent</text>

  <rect x="60" y="214" width="256" height="44" rx="5" fill="#252a1e" stroke="#434a35"/>
  <text x="188" y="232" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">find-or-initialize on the exact</text>
  <text x="188" y="248" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">(agent, marquee) pair</text>

  <text x="188" y="274" text-anchor="middle" fill="#abe87f" font-size="11" font-family="IBM Plex Sans, sans-serif">found a live chat &#8594; reuse &amp; return it</text>

  <!-- Layer 2: database -->
  <rect x="384" y="124" width="296" height="158" rx="8" fill="#20251a" stroke="#434a35"/>
  <text x="404" y="148" fill="#eec854" font-size="13" font-weight="700" font-family="IBM Plex Sans, sans-serif">2 &#183; Database (last line of defense)</text>

  <rect x="404" y="160" width="256" height="34" rx="5" fill="#252a1e" stroke="#545c42"/>
  <text x="532" y="181" text-anchor="middle" fill="#f5da79" font-size="11" font-family="IBM Plex Sans, sans-serif">UNIQUE (agent, marquee)</text>

  <rect x="404" y="200" width="256" height="34" rx="5" fill="#252a1e" stroke="#545c42"/>
  <text x="532" y="221" text-anchor="middle" fill="#f5da79" font-size="11" font-family="IBM Plex Sans, sans-serif">UNIQUE (marquee, Docker project)</text>

  <rect x="404" y="240" width="256" height="34" rx="5" fill="#252a1e" stroke="#545c42"/>
  <text x="532" y="261" text-anchor="middle" fill="#f5da79" font-size="11" font-family="IBM Plex Sans, sans-serif">UNIQUE (marquee, name slot)</text>

  <!-- arrows from the start request to layers -->
  <line x1="320" y1="94" x2="200" y2="120" stroke="#757d5e" stroke-width="1.5" marker-end="url(#de-arrow)"/>
  <line x1="400" y1="94" x2="520" y2="120" stroke="#757d5e" stroke-width="1.5" marker-end="url(#de-arrow)"/>

  <!-- arrow application -> database (race fallthrough) -->
  <line x1="336" y1="236" x2="382" y2="236" stroke="#5cb43a" stroke-width="1.5" marker-end="url(#de-arrow-green)"/>

  <text x="360" y="306" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">If two starts race past the read, the DB rejects the loser with a unique-constraint violation.</text>
  <text x="360" y="324" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">Code is the happy path; the constraint is the guarantee.</text>

  <text x="360" y="362" text-anchor="middle" fill="#757d5e" font-size="10.5" font-family="IBM Plex Sans, sans-serif">Application layer &#183; data model &#183; unique-index migration</text>
</svg>
