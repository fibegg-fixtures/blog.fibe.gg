<svg viewBox="0 0 740 446" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The bin/check-full pipeline: many checks run in parallel, then a sequential chain that stops on first failure">
  <defs>
    <marker id="pf-arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#757d5e"/>
    </marker>
    <marker id="pf-arrow-green" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#5cb43a"/>
    </marker>
  </defs>

  <text x="370" y="26" text-anchor="middle" fill="#f3f0e0" font-size="17" font-weight="700" font-family="IBM Plex Sans, sans-serif">bin/check-full</text>
  <text x="370" y="44" text-anchor="middle" fill="#a19f89" font-size="12" font-family="IBM Plex Sans, sans-serif">one command &#183; one exit code</text>

  <!-- entry -->
  <rect x="300" y="58" width="140" height="34" rx="6" fill="#252a1e" stroke="#545c42"/>
  <text x="370" y="80" text-anchor="middle" fill="#f5da79" font-size="13" font-family="JetBrains Mono, monospace">bin/check-full</text>

  <!-- PARALLEL band -->
  <rect x="18" y="108" width="704" height="186" rx="8" fill="#20251a" stroke="#434a35"/>
  <text x="34" y="128" fill="#92df62" font-size="13" font-weight="700" font-family="IBM Plex Sans, sans-serif">parallel tier</text>
  <text x="138" y="128" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">fast, independent checks &#183; all run at once</text>

  <line x1="370" y1="92" x2="370" y2="108" stroke="#757d5e" stroke-width="1.5" marker-end="url(#pf-arrow)"/>

  <!-- parallel tiles, 5 columns x 3 rows -->
  <!-- row 1 -->
  <rect x="34"  y="140" width="128" height="30" rx="5" fill="#252a1e" stroke="#434a35"/><text x="98"  y="160" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="JetBrains Mono, monospace">rubocop</text>
  <rect x="170" y="140" width="128" height="30" rx="5" fill="#252a1e" stroke="#434a35"/><text x="234" y="160" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="JetBrains Mono, monospace">reek</text>
  <rect x="306" y="140" width="128" height="30" rx="5" fill="#252a1e" stroke="#434a35"/><text x="370" y="160" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="JetBrains Mono, monospace">flay</text>
  <rect x="442" y="140" width="128" height="30" rx="5" fill="#252a1e" stroke="#434a35"/><text x="506" y="160" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="JetBrains Mono, monospace">flog</text>
  <rect x="578" y="140" width="128" height="30" rx="5" fill="#252a1e" stroke="#434a35"/><text x="642" y="160" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="JetBrains Mono, monospace">sorbet</text>
  <!-- row 2 -->
  <rect x="34"  y="178" width="128" height="30" rx="5" fill="#252a1e" stroke="#434a35"/><text x="98"  y="198" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="JetBrains Mono, monospace">packwerk</text>
  <rect x="170" y="178" width="128" height="30" rx="5" fill="#252a1e" stroke="#434a35"/><text x="234" y="198" text-anchor="middle" fill="#c7c4ae" font-size="10" font-family="JetBrains Mono, monospace">architecture guard</text>
  <rect x="306" y="178" width="128" height="30" rx="5" fill="#252a1e" stroke="#434a35"/><text x="370" y="198" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="JetBrains Mono, monospace">brakeman</text>
  <rect x="442" y="178" width="128" height="30" rx="5" fill="#252a1e" stroke="#434a35"/><text x="506" y="198" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="JetBrains Mono, monospace">bundler-audit</text>
  <rect x="578" y="178" width="128" height="30" rx="5" fill="#252a1e" stroke="#434a35"/><text x="642" y="198" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="JetBrains Mono, monospace">env guard</text>
  <!-- row 3 -->
  <rect x="34"  y="216" width="128" height="30" rx="5" fill="#252a1e" stroke="#434a35"/><text x="98"  y="236" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="JetBrains Mono, monospace">silenced types</text>
  <rect x="170" y="216" width="128" height="30" rx="5" fill="#252a1e" stroke="#434a35"/><text x="234" y="236" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="JetBrains Mono, monospace">i18n-tasks</text>
  <rect x="306" y="216" width="128" height="30" rx="5" fill="#252a1e" stroke="#434a35"/><text x="370" y="236" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="JetBrains Mono, monospace">production boot</text>
  <rect x="442" y="216" width="128" height="30" rx="5" fill="#252a1e" stroke="#434a35"/><text x="506" y="236" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="JetBrains Mono, monospace">runtime env</text>
  <rect x="578" y="216" width="128" height="30" rx="5" fill="#252a1e" stroke="#434a35"/><text x="642" y="236" text-anchor="middle" fill="#56d8c0" font-size="11" font-family="JetBrains Mono, monospace">alloy*</text>

  <text x="34" y="270" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">&#183; plus Flog, the local-dev sanity checks &#8230; every parallel check reports its own ✅ / ❌</text>
  <text x="34" y="286" fill="#757d5e" font-size="10.5" font-family="IBM Plex Sans, sans-serif">* Alloy runs only when its CLI is installed</text>

  <line x1="370" y1="294" x2="370" y2="318" stroke="#757d5e" stroke-width="1.5" marker-end="url(#pf-arrow)"/>

  <!-- SEQUENTIAL band -->
  <rect x="18" y="318" width="704" height="78" rx="8" fill="#20251a" stroke="#434a35"/>
  <text x="34" y="338" fill="#eec854" font-size="13" font-weight="700" font-family="IBM Plex Sans, sans-serif">sequential tier</text>
  <text x="138" y="338" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">ordered chain &#183; stops on the first failure</text>

  <rect x="34"  y="350" width="118" height="34" rx="5" fill="#252a1e" stroke="#545c42"/><text x="93"  y="371" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="JetBrains Mono, monospace">Rust core</text>
  <rect x="172" y="350" width="118" height="34" rx="5" fill="#252a1e" stroke="#545c42"/><text x="231" y="365" text-anchor="middle" fill="#c7c4ae" font-size="10.5" font-family="JetBrains Mono, monospace">RSpec</text><text x="231" y="378" text-anchor="middle" fill="#c7c4ae" font-size="10.5" font-family="JetBrains Mono, monospace">full suite</text>
  <rect x="310" y="350" width="118" height="34" rx="5" fill="#252a1e" stroke="#545c42"/><text x="369" y="365" text-anchor="middle" fill="#c7c4ae" font-size="10.5" font-family="JetBrains Mono, monospace">N+1</text><text x="369" y="378" text-anchor="middle" fill="#c7c4ae" font-size="10.5" font-family="JetBrains Mono, monospace">analysis</text>
  <rect x="448" y="350" width="130" height="34" rx="5" fill="#252a1e" stroke="#545c42"/><text x="513" y="371" text-anchor="middle" fill="#c7c4ae" font-size="10.5" font-family="JetBrains Mono, monospace">merge coverage</text>
  <rect x="596" y="350" width="110" height="34" rx="5" fill="#252a1e" stroke="#545c42"/><text x="651" y="365" text-anchor="middle" fill="#c7c4ae" font-size="10.5" font-family="JetBrains Mono, monospace">skunk</text><text x="651" y="378" text-anchor="middle" fill="#c7c4ae" font-size="10.5" font-family="JetBrains Mono, monospace">+ coverage</text>

  <line x1="152" y1="367" x2="172" y2="367" stroke="#5cb43a" stroke-width="1.5" marker-end="url(#pf-arrow-green)"/>
  <line x1="290" y1="367" x2="310" y2="367" stroke="#5cb43a" stroke-width="1.5" marker-end="url(#pf-arrow-green)"/>
  <line x1="428" y1="367" x2="448" y2="367" stroke="#5cb43a" stroke-width="1.5" marker-end="url(#pf-arrow-green)"/>
  <line x1="578" y1="367" x2="596" y2="367" stroke="#5cb43a" stroke-width="1.5" marker-end="url(#pf-arrow-green)"/>

  <text x="370" y="424" text-anchor="middle" fill="#a19f89" font-size="11.5" font-family="IBM Plex Sans, sans-serif">any ❌ anywhere &#8594; the whole command exits non-zero</text>
</svg>
