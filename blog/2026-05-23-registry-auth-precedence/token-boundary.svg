<svg viewBox="0 0 720 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A boundary separating Fibe platform and mirror-job tokens from the player credentials used to pull GHCR images">
  <defs>
    <marker id="tb-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#92df62"/>
    </marker>
    <marker id="tb-block" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#f08760"/>
    </marker>
  </defs>

  <text x="360" y="26" text-anchor="middle" fill="#f3f0e0" font-size="17" font-weight="700" font-family="IBM Plex Sans, sans-serif">Platform tokens never touch your image pulls</text>

  <!-- platform side -->
  <rect x="24" y="54" width="260" height="170" rx="8" fill="#20251a" stroke="#545c42"/>
  <text x="154" y="78" text-anchor="middle" fill="#eec854" font-size="13" font-weight="700" font-family="IBM Plex Sans, sans-serif">Fibe platform identity</text>
  <rect x="44" y="92" width="220" height="34" rx="5" fill="#252a1e" stroke="#434a35"/>
  <text x="154" y="114" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">platform service tokens</text>
  <rect x="44" y="132" width="220" height="34" rx="5" fill="#252a1e" stroke="#434a35"/>
  <text x="154" y="154" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">mirror-job tokens</text>
  <rect x="44" y="172" width="220" height="34" rx="5" fill="#252a1e" stroke="#434a35"/>
  <text x="154" y="194" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">system mirror Prop</text>

  <!-- the wall -->
  <line x1="360" y1="48" x2="360" y2="288" stroke="#f08760" stroke-width="2.5" stroke-dasharray="7 6"/>
  <text x="360" y="44" text-anchor="middle" fill="#f08760" font-size="11" font-weight="700" font-family="IBM Plex Sans, sans-serif">hard boundary</text>

  <!-- blocked arrow -->
  <line x1="284" y1="139" x2="345" y2="139" stroke="#f08760" stroke-width="2" marker-end="url(#tb-block)"/>
  <line x1="352" y1="124" x2="368" y2="154" stroke="#f08760" stroke-width="2.5"/>
  <line x1="368" y1="124" x2="352" y2="154" stroke="#f08760" stroke-width="2.5"/>

  <!-- player side -->
  <rect x="436" y="54" width="260" height="170" rx="8" fill="#20251a" stroke="#79d44e"/>
  <text x="566" y="78" text-anchor="middle" fill="#92df62" font-size="13" font-weight="700" font-family="IBM Plex Sans, sans-serif">Your credentials only</text>
  <rect x="456" y="92" width="220" height="34" rx="5" fill="#252a1e" stroke="#434a35"/>
  <text x="566" y="114" text-anchor="middle" fill="#abe87f" font-size="11" font-family="IBM Plex Sans, sans-serif">Prop PAT</text>
  <rect x="456" y="132" width="220" height="34" rx="5" fill="#252a1e" stroke="#434a35"/>
  <text x="566" y="154" text-anchor="middle" fill="#abe87f" font-size="11" font-family="IBM Plex Sans, sans-serif">your GitHub OAuth token</text>
  <rect x="456" y="172" width="220" height="34" rx="5" fill="#252a1e" stroke="#434a35"/>
  <text x="566" y="194" text-anchor="middle" fill="#abe87f" font-size="11" font-family="IBM Plex Sans, sans-serif">App install token (your repo)</text>

  <!-- allowed arrow to pull -->
  <line x1="566" y1="224" x2="566" y2="252" stroke="#92df62" stroke-width="1.8" marker-end="url(#tb-arrow)"/>
  <rect x="436" y="254" width="260" height="44" rx="8" fill="#252a1e" stroke="#56d8c0"/>
  <text x="566" y="276" text-anchor="middle" fill="#56d8c0" font-size="12" font-weight="700" font-family="JetBrains Mono, monospace">docker pull ghcr.io/you/img</text>
  <text x="566" y="292" text-anchor="middle" fill="#a19f89" font-size="10" font-family="IBM Plex Sans, sans-serif">scoped to what your creds can reach</text>

  <text x="360" y="320" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">Blast radius of a leaked pull = one player's GitHub scope, never the fleet's.</text>
</svg>
