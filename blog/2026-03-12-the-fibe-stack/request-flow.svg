<svg viewBox="0 0 740 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Request flow: an agent deploys a Playground and each language handles its slice of the work">
  <defs>
    <marker id="flowArrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#757d5e"/>
    </marker>
  </defs>
  <text x="370" y="26" text-anchor="middle" fill="#f3f0e0" font-size="16" font-weight="700" font-family="IBM Plex Sans, sans-serif">"Deploy a Playground" &#8212; who does what</text>

  <!-- 1 SDK -->
  <rect x="30" y="56" width="156" height="74" rx="7" fill="#20251a" stroke="#56d8c0"/>
  <text x="108" y="80" text-anchor="middle" fill="#56d8c0" font-size="12.5" font-weight="700" font-family="JetBrains Mono, monospace">Go SDK / MCP</text>
  <text x="108" y="100" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">agent calls a tool,</text>
  <text x="108" y="116" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">sends HTTP to the API</text>

  <!-- 2 Rails -->
  <rect x="216" y="46" width="180" height="94" rx="7" fill="#252a1e" stroke="#79d44e" stroke-width="1.6"/>
  <text x="306" y="72" text-anchor="middle" fill="#92df62" font-size="12.5" font-weight="700" font-family="JetBrains Mono, monospace">Rails</text>
  <text x="306" y="92" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">authz, billing gate,</text>
  <text x="306" y="108" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">DB writes, orchestration,</text>
  <text x="306" y="124" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">SSH to the Marquee</text>

  <!-- 3 Rust -->
  <rect x="426" y="56" width="156" height="74" rx="7" fill="#20251a" stroke="#eec854"/>
  <text x="504" y="80" text-anchor="middle" fill="#eec854" font-size="12.5" font-weight="700" font-family="JetBrains Mono, monospace">Rust core</text>
  <text x="504" y="100" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">compile template &#8594;</text>
  <text x="504" y="116" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">compose + Traefik labels</text>

  <!-- arrows row 1 -->
  <line x1="186" y1="93" x2="214" y2="93" stroke="#757d5e" stroke-width="1.6" marker-end="url(#flowArrow)"/>
  <line x1="396" y1="93" x2="424" y2="93" stroke="#757d5e" stroke-width="1.6" marker-end="url(#flowArrow)"/>
  <text x="504" y="146" text-anchor="middle" fill="#a19f89" font-size="10" font-family="JetBrains Mono, monospace">pure JSON in / JSON out</text>

  <!-- Rust returns -->
  <line x1="490" y1="130" x2="340" y2="150" stroke="#757d5e" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#flowArrow)"/>

  <!-- 4 Marquee -->
  <rect x="216" y="172" width="308" height="64" rx="7" fill="#20251a" stroke="#545c42"/>
  <text x="370" y="198" text-anchor="middle" fill="#abe87f" font-size="12.5" font-weight="700" font-family="JetBrains Mono, monospace">Marquee (Docker host)</text>
  <text x="370" y="220" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">docker compose up &#183; Traefik routes wildcard TLS</text>
  <line x1="306" y1="140" x2="330" y2="170" stroke="#757d5e" stroke-width="1.6" marker-end="url(#flowArrow)"/>

  <!-- 5 Genie sidecar -->
  <rect x="216" y="268" width="308" height="64" rx="7" fill="#20251a" stroke="#56d8c0"/>
  <text x="370" y="294" text-anchor="middle" fill="#56d8c0" font-size="12.5" font-weight="700" font-family="JetBrains Mono, monospace">NestJS Genie (sidecar, if AgentChat)</text>
  <text x="370" y="316" text-anchor="middle" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">WebSocket: 19 actions in, 35 events out, live to the browser</text>
  <line x1="370" y1="236" x2="370" y2="266" stroke="#757d5e" stroke-width="1.6" marker-end="url(#flowArrow)"/>

  <!-- Playguard note -->
  <rect x="556" y="172" width="156" height="64" rx="7" fill="#20251a" stroke="#79d44e"/>
  <text x="634" y="196" text-anchor="middle" fill="#92df62" font-size="11.5" font-weight="700" font-family="JetBrains Mono, monospace">Playguard</text>
  <text x="634" y="214" text-anchor="middle" fill="#c7c4ae" font-size="10.5" font-family="IBM Plex Sans, sans-serif">reconciles every 60s</text>
  <text x="634" y="229" text-anchor="middle" fill="#a19f89" font-size="10" font-family="JetBrains Mono, monospace">(Rails + Rust drift)</text>
  <line x1="556" y1="204" x2="526" y2="204" stroke="#757d5e" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#flowArrow)"/>
</svg>
