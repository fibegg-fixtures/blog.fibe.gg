<svg viewBox="0 0 740 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Timeline comparing a transient blip, which is ignored, against a sustained outage, which crosses the two-minute grace line and triggers a redeploy">
  <text x="370" y="26" text-anchor="middle" fill="#f3f0e0" font-size="16" font-weight="700" font-family="IBM Plex Sans, sans-serif">Blip vs outage: same first probe, different ending</text>

  <!-- BLIP timeline -->
  <text x="40" y="68" fill="#56d8c0" font-size="12.5" font-weight="700" font-family="JetBrains Mono, monospace">BLIP</text>
  <line x1="40" y1="92" x2="700" y2="92" stroke="#434a35" stroke-width="2"/>
  <!-- probes -->
  <circle cx="120" cy="92" r="7" fill="#5cb43a"/>
  <circle cx="260" cy="92" r="7" fill="#f08760"/>
  <circle cx="400" cy="92" r="7" fill="#5cb43a"/>
  <circle cx="540" cy="92" r="7" fill="#5cb43a"/>
  <circle cx="660" cy="92" r="7" fill="#5cb43a"/>
  <text x="120" y="118" text-anchor="middle" fill="#a19f89" font-size="10" font-family="IBM Plex Sans, sans-serif">pass</text>
  <text x="260" y="118" text-anchor="middle" fill="#f08760" font-size="10" font-family="IBM Plex Sans, sans-serif">refused</text>
  <text x="400" y="118" text-anchor="middle" fill="#a19f89" font-size="10" font-family="IBM Plex Sans, sans-serif">pass</text>
  <text x="540" y="118" text-anchor="middle" fill="#a19f89" font-size="10" font-family="IBM Plex Sans, sans-serif">pass</text>
  <text x="660" y="118" text-anchor="middle" fill="#a19f89" font-size="10" font-family="IBM Plex Sans, sans-serif">pass</text>
  <!-- annotation -->
  <rect x="206" y="130" width="190" height="34" rx="5" fill="#20251a" stroke="#56d8c0"/>
  <text x="301" y="151" text-anchor="middle" fill="#56d8c0" font-size="11" font-family="IBM Plex Sans, sans-serif">one bad probe &#8594; ignored, recovers</text>

  <!-- divider -->
  <line x1="40" y1="184" x2="700" y2="184" stroke="#2c3222" stroke-width="1"/>

  <!-- OUTAGE timeline -->
  <text x="40" y="212" fill="#f08760" font-size="12.5" font-weight="700" font-family="JetBrains Mono, monospace">OUTAGE</text>
  <line x1="40" y1="236" x2="700" y2="236" stroke="#434a35" stroke-width="2"/>
  <!-- grace line -->
  <line x1="430" y1="208" x2="430" y2="284" stroke="#eec854" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="430" y="302" text-anchor="middle" fill="#eec854" font-size="10" font-family="IBM Plex Sans, sans-serif">running + 2 min</text>

  <circle cx="120" cy="236" r="7" fill="#5cb43a"/>
  <circle cx="260" cy="236" r="7" fill="#f08760"/>
  <circle cx="370" cy="236" r="7" fill="#f08760"/>
  <circle cx="490" cy="236" r="7" fill="#f08760"/>
  <circle cx="600" cy="236" r="9" fill="#f08760" stroke="#f5da79" stroke-width="2"/>
  <text x="120" y="262" text-anchor="middle" fill="#a19f89" font-size="10" font-family="IBM Plex Sans, sans-serif">pass</text>
  <text x="260" y="262" text-anchor="middle" fill="#f08760" font-size="10" font-family="IBM Plex Sans, sans-serif">down</text>
  <text x="370" y="262" text-anchor="middle" fill="#f08760" font-size="10" font-family="IBM Plex Sans, sans-serif">down</text>
  <text x="490" y="262" text-anchor="middle" fill="#f08760" font-size="10" font-family="IBM Plex Sans, sans-serif">down</text>
  <text x="600" y="220" text-anchor="middle" fill="#f5da79" font-size="10" font-weight="700" font-family="JetBrains Mono, monospace">REDEPLOY</text>

  <!-- before grace: ignored -->
  <text x="345" y="290" text-anchor="middle" fill="#a19f89" font-size="10" font-family="IBM Plex Sans, sans-serif">before grace: ignored</text>
</svg>
