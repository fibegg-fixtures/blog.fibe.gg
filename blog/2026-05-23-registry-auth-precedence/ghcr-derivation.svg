<svg viewBox="0 0 720 296" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GHCR credential derivation order: Prop stored PAT, then player GitHub OAuth token, then GitHub App installation token">
  <defs>
    <marker id="gd-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#757d5e"/>
    </marker>
  </defs>

  <text x="360" y="26" text-anchor="middle" fill="#f3f0e0" font-size="17" font-weight="700" font-family="IBM Plex Sans, sans-serif">GHCR credential: derived only from the player's Prop</text>
  <text x="360" y="46" text-anchor="middle" fill="#a19f89" font-size="11.5" font-family="IBM Plex Sans, sans-serif">checked in order &#183; first secret present wins</text>

  <!-- step 1 -->
  <rect x="30" y="70" width="200" height="92" rx="8" fill="#20251a" stroke="#79d44e"/>
  <text x="130" y="94" text-anchor="middle" fill="#92df62" font-size="13" font-weight="700" font-family="IBM Plex Sans, sans-serif">1 &#183; Prop credentials</text>
  <text x="130" y="116" text-anchor="middle" fill="#c7c4ae" font-size="10.5" font-family="IBM Plex Sans, sans-serif">a PAT saved on the Prop</text>
  <text x="130" y="135" text-anchor="middle" fill="#a19f89" font-size="10" font-family="IBM Plex Sans, sans-serif">stored, encrypted</text>
  <text x="130" y="151" text-anchor="middle" fill="#a19f89" font-size="10" font-family="IBM Plex Sans, sans-serif">secret on the Prop</text>

  <line x1="230" y1="116" x2="262" y2="116" stroke="#757d5e" stroke-width="1.5" marker-end="url(#gd-arrow)"/>
  <text x="246" y="108" text-anchor="middle" fill="#a19f89" font-size="9.5" font-family="IBM Plex Sans, sans-serif">blank?</text>

  <!-- step 2 -->
  <rect x="264" y="70" width="200" height="92" rx="8" fill="#20251a" stroke="#545c42"/>
  <text x="364" y="94" text-anchor="middle" fill="#abe87f" font-size="13" font-weight="700" font-family="IBM Plex Sans, sans-serif">2 &#183; Player OAuth</text>
  <text x="364" y="116" text-anchor="middle" fill="#c7c4ae" font-size="10.5" font-family="IBM Plex Sans, sans-serif">the player's GitHub token</text>
  <text x="364" y="135" text-anchor="middle" fill="#a19f89" font-size="10" font-family="IBM Plex Sans, sans-serif">the player's own</text>
  <text x="364" y="151" text-anchor="middle" fill="#a19f89" font-size="10" font-family="IBM Plex Sans, sans-serif">GitHub OAuth grant</text>

  <line x1="464" y1="116" x2="496" y2="116" stroke="#757d5e" stroke-width="1.5" marker-end="url(#gd-arrow)"/>
  <text x="480" y="108" text-anchor="middle" fill="#a19f89" font-size="9.5" font-family="IBM Plex Sans, sans-serif">blank?</text>

  <!-- step 3 -->
  <rect x="498" y="70" width="200" height="92" rx="8" fill="#20251a" stroke="#545c42"/>
  <text x="598" y="94" text-anchor="middle" fill="#abe87f" font-size="13" font-weight="700" font-family="IBM Plex Sans, sans-serif">3 &#183; App install token</text>
  <text x="598" y="116" text-anchor="middle" fill="#c7c4ae" font-size="10.5" font-family="IBM Plex Sans, sans-serif">a GitHub App token</text>
  <text x="598" y="135" text-anchor="middle" fill="#a19f89" font-size="10" font-family="IBM Plex Sans, sans-serif">GitHub App install</text>
  <text x="598" y="151" text-anchor="middle" fill="#a19f89" font-size="10" font-family="IBM Plex Sans, sans-serif">scoped to the repo</text>

  <!-- result -->
  <line x1="364" y1="162" x2="364" y2="196" stroke="#757d5e" stroke-width="1.5" marker-end="url(#gd-arrow)"/>
  <rect x="180" y="198" width="360" height="44" rx="8" fill="#252a1e" stroke="#56d8c0"/>
  <text x="360" y="220" text-anchor="middle" fill="#56d8c0" font-size="12.5" font-weight="700" font-family="JetBrains Mono, monospace">ghcr.io &#8594; user : secret</text>
  <text x="360" y="236" text-anchor="middle" fill="#a19f89" font-size="10" font-family="IBM Plex Sans, sans-serif">added to the Playspec "auths" for ghcr.io/* images</text>

  <!-- guard -->
  <rect x="120" y="258" width="480" height="30" rx="6" fill="#20251a" stroke="#f08760"/>
  <text x="360" y="277" text-anchor="middle" fill="#f08760" font-size="11.5" font-weight="700" font-family="IBM Plex Sans, sans-serif">No Prop secret &#8594; no GHCR auth. Never a platform token.</text>
</svg>
