<svg viewBox="0 0 740 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The AgentChat state machine with four statuses: pending, running, error, stopped, and the key transitions between them">
  <defs>
    <marker id="arrowSM" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#757d5e"/>
    </marker>
    <marker id="arrowSMg" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#5cb43a"/>
    </marker>
    <marker id="arrowSMe" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#f08760"/>
    </marker>
  </defs>

  <text x="20" y="28" fill="#f3f0e0" font-size="16" font-weight="700" font-family="IBM Plex Sans, sans-serif">AgentChat status &#8212; a plain string column, no state-machine library</text>

  <!-- pending -->
  <rect x="60" y="70" width="170" height="58" rx="8" fill="#252a1e" stroke="#eec854"/>
  <text x="145" y="98" text-anchor="middle" fill="#eec854" font-size="16" font-weight="700" font-family="JetBrains Mono, monospace">pending</text>
  <text x="145" y="118" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">deploying / queued</text>

  <!-- running -->
  <rect x="500" y="70" width="170" height="58" rx="8" fill="#252a1e" stroke="#92df62"/>
  <text x="585" y="98" text-anchor="middle" fill="#92df62" font-size="16" font-weight="700" font-family="JetBrains Mono, monospace">running</text>
  <text x="585" y="118" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">reachable &#183; iframe live</text>

  <!-- error -->
  <rect x="500" y="300" width="170" height="58" rx="8" fill="#252a1e" stroke="#f08760"/>
  <text x="585" y="328" text-anchor="middle" fill="#f08760" font-size="16" font-weight="700" font-family="JetBrains Mono, monospace">error</text>
  <text x="585" y="348" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">non-retryable / billing</text>

  <!-- stopped -->
  <rect x="60" y="300" width="170" height="58" rx="8" fill="#252a1e" stroke="#757d5e"/>
  <text x="145" y="328" text-anchor="middle" fill="#c7c4ae" font-size="16" font-weight="700" font-family="JetBrains Mono, monospace">stopped</text>
  <text x="145" y="348" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">volume kept (unless purged)</text>

  <!-- pending -> running -->
  <line x1="230" y1="92" x2="497" y2="92" stroke="#5cb43a" stroke-width="2" marker-end="url(#arrowSMg)"/>
  <text x="363" y="84" text-anchor="middle" fill="#92df62" font-size="11" font-family="IBM Plex Sans, sans-serif">deploy ok + reachable</text>

  <!-- pending -> pending (self, retryable) -->
  <path d="M 95 70 C 70 30, 220 30, 195 70" fill="none" stroke="#757d5e" stroke-width="1.6" marker-end="url(#arrowSM)"/>
  <text x="145" y="34" text-anchor="middle" fill="#a19f89" font-size="10.5" font-family="IBM Plex Sans, sans-serif">retryable &#183; requeue</text>

  <!-- pending -> error -->
  <line x1="230" y1="120" x2="500" y2="318" stroke="#f08760" stroke-width="1.8" marker-end="url(#arrowSMe)"/>
  <text x="350" y="232" text-anchor="middle" fill="#f08760" font-size="10.5" font-family="IBM Plex Sans, sans-serif" transform="rotate(36 350 232)">non-retryable / 402</text>

  <!-- running -> pending (drift / sustained unreachable) -->
  <path d="M 500 110 C 380 150, 250 130, 232 110" fill="none" stroke="#757d5e" stroke-width="1.6" marker-end="url(#arrowSM)"/>
  <text x="363" y="148" text-anchor="middle" fill="#a19f89" font-size="10.5" font-family="IBM Plex Sans, sans-serif">sustained unreachable / drift &#8594; redeploy</text>

  <!-- error -> running (self-heal) -->
  <line x1="585" y1="300" x2="585" y2="130" stroke="#5cb43a" stroke-width="2" marker-end="url(#arrowSMg)"/>
  <text x="595" y="218" fill="#92df62" font-size="10.5" font-family="IBM Plex Sans, sans-serif">probe healthy &#8594; promote</text>

  <!-- error -> pending -->
  <line x1="500" y1="320" x2="232" y2="120" stroke="#757d5e" stroke-width="1.6" marker-end="url(#arrowSM)"/>
  <text x="360" y="206" text-anchor="middle" fill="#a19f89" font-size="10.5" font-family="IBM Plex Sans, sans-serif" transform="rotate(-36 360 206)">retryable + can launch &#8594; recover</text>

  <!-- running -> stopped -->
  <line x1="500" y1="120" x2="232" y2="312" stroke="#757d5e" stroke-width="1.6" marker-end="url(#arrowSM)"/>
  <text x="372" y="226" text-anchor="middle" fill="#a19f89" font-size="10.5" font-family="IBM Plex Sans, sans-serif" transform="rotate(-36 372 226)">stop / quiesce / host gone</text>

  <!-- error -> stopped -->
  <line x1="500" y1="330" x2="232" y2="330" stroke="#757d5e" stroke-width="1.6" marker-end="url(#arrowSM)"/>
  <text x="365" y="324" text-anchor="middle" fill="#a19f89" font-size="10.5" font-family="IBM Plex Sans, sans-serif">stop / purge</text>

  <!-- stopped -> pending -->
  <line x1="145" y1="300" x2="145" y2="130" stroke="#757d5e" stroke-width="1.6" marker-end="url(#arrowSM)"/>
  <text x="40" y="218" fill="#a19f89" font-size="10.5" font-family="IBM Plex Sans, sans-serif" transform="rotate(-90 40 218)" text-anchor="middle">restart (re-entitled)</text>

  <!-- stopped self purge -->
  <path d="M 95 358 C 70 400, 220 400, 195 358" fill="none" stroke="#757d5e" stroke-width="1.6" marker-end="url(#arrowSM)"/>
  <text x="145" y="416" text-anchor="middle" fill="#a19f89" font-size="10.5" font-family="IBM Plex Sans, sans-serif">purge &#8594; volumes removed (still stopped)</text>
</svg>
