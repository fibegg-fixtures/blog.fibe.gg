<svg viewBox="0 0 720 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Target architecture: web service exposed through Traefik on a subdomain, with internal Postgres, Redis, Sidekiq worker and a one-shot setup service; Postgres and Redis backed by named volumes">
  <defs>
    <marker id="arrTA" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#757d5e"/>
    </marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" fill="#f3f0e0" font-size="17" font-weight="700" font-family="IBM Plex Sans, sans-serif">Target architecture on a Marquee</text>

  <!-- Internet / browser -->
  <rect x="40" y="56" width="150" height="50" rx="6" fill="#20251a" stroke="#545c42"/>
  <text x="115" y="80" text-anchor="middle" fill="#c7c4ae" font-size="13" font-family="IBM Plex Sans, sans-serif">Browser</text>
  <text x="115" y="97" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">the public internet</text>

  <!-- Traefik edge -->
  <rect x="250" y="52" width="200" height="58" rx="6" fill="#252a1e" stroke="#eec854"/>
  <text x="350" y="76" text-anchor="middle" fill="#eec854" font-size="13" font-weight="700" font-family="JetBrains Mono, monospace">Traefik</text>
  <text x="350" y="95" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">wildcard TLS &#183; app.&lt;root-domain&gt;</text>

  <line x1="190" y1="81" x2="248" y2="81" stroke="#757d5e" stroke-width="1.5" marker-end="url(#arrTA)"/>

  <!-- The Marquee box -->
  <rect x="40" y="132" width="640" height="288" rx="8" fill="none" stroke="#434a35" stroke-dasharray="5 4"/>
  <text x="56" y="152" fill="#a19f89" font-size="11" font-family="JetBrains Mono, monospace">Marquee (Docker host) &#183; Compose network</text>

  <!-- web (public) -->
  <rect x="262" y="120" width="176" height="56" rx="6" fill="#20251a" stroke="#79d44e" stroke-width="2"/>
  <text x="350" y="143" text-anchor="middle" fill="#92df62" font-size="14" font-weight="700" font-family="JetBrains Mono, monospace">web</text>
  <text x="350" y="161" text-anchor="middle" fill="#a19f89" font-size="10.5" font-family="JetBrains Mono, monospace">fibe.gg/port: 3000 &#183; external</text>

  <line x1="350" y1="110" x2="350" y2="118" stroke="#79d44e" stroke-width="2" marker-end="url(#arrTA)"/>

  <!-- setup (one-shot) -->
  <rect x="70" y="200" width="170" height="56" rx="6" fill="#252a1e" stroke="#eec854"/>
  <text x="155" y="223" text-anchor="middle" fill="#eec854" font-size="14" font-weight="700" font-family="JetBrains Mono, monospace">setup</text>
  <text x="155" y="241" text-anchor="middle" fill="#a19f89" font-size="10.5" font-family="JetBrains Mono, monospace">one-shot &#183; db:prepare</text>

  <!-- jobs (worker, private) -->
  <rect x="475" y="200" width="170" height="56" rx="6" fill="#20251a" stroke="#545c42"/>
  <text x="560" y="223" text-anchor="middle" fill="#c7c4ae" font-size="14" font-weight="700" font-family="JetBrains Mono, monospace">jobs</text>
  <text x="560" y="241" text-anchor="middle" fill="#a19f89" font-size="10.5" font-family="JetBrains Mono, monospace">sidekiq &#183; no port (private)</text>

  <!-- postgres -->
  <rect x="160" y="312" width="180" height="60" rx="6" fill="#20251a" stroke="#56d8c0"/>
  <text x="250" y="336" text-anchor="middle" fill="#56d8c0" font-size="14" font-weight="700" font-family="JetBrains Mono, monospace">postgres</text>
  <text x="250" y="354" text-anchor="middle" fill="#a19f89" font-size="10.5" font-family="JetBrains Mono, monospace">internal &#183; pg_isready</text>

  <!-- redis -->
  <rect x="400" y="312" width="160" height="60" rx="6" fill="#20251a" stroke="#56d8c0"/>
  <text x="480" y="336" text-anchor="middle" fill="#56d8c0" font-size="14" font-weight="700" font-family="JetBrains Mono, monospace">redis</text>
  <text x="480" y="354" text-anchor="middle" fill="#a19f89" font-size="10.5" font-family="JetBrains Mono, monospace">internal &#183; redis-cli ping</text>

  <!-- volumes -->
  <rect x="190" y="388" width="120" height="26" rx="13" fill="#252a1e" stroke="#757d5e"/>
  <text x="250" y="405" text-anchor="middle" fill="#c7c4ae" font-size="10.5" font-family="JetBrains Mono, monospace">vol: pg_data</text>
  <rect x="420" y="388" width="120" height="26" rx="13" fill="#252a1e" stroke="#757d5e"/>
  <text x="480" y="405" text-anchor="middle" fill="#c7c4ae" font-size="10.5" font-family="JetBrains Mono, monospace">vol: redis_data</text>

  <!-- edges: web -> postgres / redis -->
  <line x1="320" y1="176" x2="270" y2="310" stroke="#757d5e" stroke-width="1.5" marker-end="url(#arrTA)"/>
  <line x1="380" y1="176" x2="460" y2="310" stroke="#757d5e" stroke-width="1.5" marker-end="url(#arrTA)"/>
  <!-- jobs -> postgres / redis -->
  <line x1="540" y1="256" x2="320" y2="318" stroke="#757d5e" stroke-width="1.2" marker-end="url(#arrTA)"/>
  <line x1="560" y1="256" x2="490" y2="310" stroke="#757d5e" stroke-width="1.2" marker-end="url(#arrTA)"/>
  <!-- setup -> postgres -->
  <line x1="165" y1="256" x2="210" y2="310" stroke="#eec854" stroke-width="1.2" marker-end="url(#arrTA)"/>
  <!-- postgres/redis -> volume -->
  <line x1="250" y1="372" x2="250" y2="386" stroke="#757d5e" stroke-width="1.2" marker-end="url(#arrTA)"/>
  <line x1="480" y1="372" x2="480" y2="386" stroke="#757d5e" stroke-width="1.2" marker-end="url(#arrTA)"/>
</svg>
