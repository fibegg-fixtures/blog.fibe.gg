<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Deploy pipeline: a push to main triggers GitHub Actions to build the image and push it to the Scaleway registry, then the deploy rolls the web pods which gate on the /up health probe before old pods drain">
  <defs>
    <marker id="dp-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#757d5e"/>
    </marker>
  </defs>

  <text x="20" y="28" fill="#f3f0e0" font-size="16" font-weight="700" font-family="IBM Plex Sans, sans-serif">From push to live</text>

  <!-- step 1 -->
  <circle cx="60" cy="100" r="14" fill="#252a1e" stroke="#79d44e"/>
  <text x="60" y="105" text-anchor="middle" fill="#92df62" font-size="13" font-weight="700" font-family="JetBrains Mono, monospace">1</text>
  <rect x="84" y="78" width="150" height="76" rx="6" fill="#20251a" stroke="#545c42"/>
  <text x="159" y="104" text-anchor="middle" fill="#f3f0e0" font-size="13" font-family="IBM Plex Sans, sans-serif">Push to main</text>
  <text x="159" y="124" text-anchor="middle" fill="#a19f89" font-size="10" font-family="IBM Plex Sans, sans-serif">GitHub Actions</text>
  <text x="159" y="140" text-anchor="middle" fill="#a19f89" font-size="10" font-family="IBM Plex Sans, sans-serif">workflow fires</text>

  <!-- step 2 -->
  <circle cx="262" cy="100" r="14" fill="#252a1e" stroke="#79d44e"/>
  <text x="262" y="105" text-anchor="middle" fill="#92df62" font-size="13" font-weight="700" font-family="JetBrains Mono, monospace">2</text>
  <rect x="286" y="78" width="150" height="76" rx="6" fill="#20251a" stroke="#545c42"/>
  <text x="361" y="104" text-anchor="middle" fill="#f3f0e0" font-size="13" font-family="IBM Plex Sans, sans-serif">Build image</text>
  <text x="361" y="124" text-anchor="middle" fill="#a19f89" font-size="10" font-family="IBM Plex Sans, sans-serif">stamp commit SHA</text>
  <text x="361" y="140" text-anchor="middle" fill="#a19f89" font-size="10" font-family="IBM Plex Sans, sans-serif">push to registry</text>

  <!-- step 3 -->
  <circle cx="464" cy="100" r="14" fill="#252a1e" stroke="#79d44e"/>
  <text x="464" y="105" text-anchor="middle" fill="#92df62" font-size="13" font-weight="700" font-family="JetBrains Mono, monospace">3</text>
  <rect x="488" y="78" width="150" height="76" rx="6" fill="#20251a" stroke="#545c42"/>
  <text x="563" y="104" text-anchor="middle" fill="#f3f0e0" font-size="13" font-family="IBM Plex Sans, sans-serif">Roll the pods</text>
  <text x="563" y="124" text-anchor="middle" fill="#a19f89" font-size="10" font-family="IBM Plex Sans, sans-serif">set new image</text>
  <text x="563" y="140" text-anchor="middle" fill="#a19f89" font-size="10" font-family="IBM Plex Sans, sans-serif">maxUnavailable 0</text>

  <line x1="240" y1="116" x2="282" y2="116" stroke="#757d5e" stroke-width="1.5" marker-end="url(#dp-arrow)"/>
  <line x1="442" y1="116" x2="484" y2="116" stroke="#757d5e" stroke-width="1.5" marker-end="url(#dp-arrow)"/>

  <!-- health gate band -->
  <rect x="84" y="186" width="554" height="86" rx="6" fill="#20251a" stroke="#434a35"/>
  <text x="100" y="210" fill="#eec854" font-size="13" font-weight="700" font-family="IBM Plex Sans, sans-serif">The gate that makes it safe</text>
  <text x="100" y="232" fill="#c7c4ae" font-size="11" font-family="IBM Plex Sans, sans-serif">New pod must pass the /up readiness probe before any old pod is sent SIGTERM.</text>
  <text x="100" y="250" fill="#a19f89" font-size="11" font-family="JetBrains Mono, monospace">/up verifies build identity: reported commit == source commit, or it fails red.</text>
  <text x="100" y="266" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">A broken build never becomes the only pod serving traffic.</text>
</svg>
