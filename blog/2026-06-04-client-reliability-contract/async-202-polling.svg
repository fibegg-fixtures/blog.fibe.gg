<svg viewBox="0 0 720 392" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Async 202 polling sequence: a client sends a mutation, the API answers 202 with a request_id and optional status_url, the client polls the status path every second until the status becomes success or error, then returns the payload or an APIError">
  <defs>
    <marker id="async-arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#79d44e"/>
    </marker>
    <marker id="async-arrow-gold" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#eec854"/>
    </marker>
  </defs>

  <text x="160" y="28" text-anchor="middle" fill="#f3f0e0" font-size="14" font-weight="700" font-family="JetBrains Mono, monospace">Client (SDK / CLI / MCP)</text>
  <text x="560" y="28" text-anchor="middle" fill="#f3f0e0" font-size="14" font-weight="700" font-family="JetBrains Mono, monospace">Fibe API</text>

  <line x1="160" y1="40" x2="160" y2="368" stroke="#434a35" stroke-width="2"/>
  <line x1="560" y1="40" x2="560" y2="368" stroke="#434a35" stroke-width="2"/>

  <!-- request -->
  <line x1="160" y1="70" x2="556" y2="70" stroke="#79d44e" stroke-width="2" marker-end="url(#async-arrow)"/>
  <text x="358" y="62" text-anchor="middle" fill="#c7c4ae" font-size="12" font-family="JetBrains Mono, monospace">POST /api/playgrounds  (Idempotency-Key)</text>

  <!-- 202 -->
  <line x1="560" y1="104" x2="164" y2="104" stroke="#eec854" stroke-width="2" marker-end="url(#async-arrow-gold)"/>
  <text x="358" y="96" text-anchor="middle" fill="#eec854" font-size="12" font-family="JetBrains Mono, monospace">202 Accepted  { request_id, status_url? }</text>

  <!-- poll loop box -->
  <rect x="120" y="124" width="480" height="168" rx="6" fill="none" stroke="#545c42" stroke-dasharray="4 4"/>
  <text x="138" y="142" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">poll loop &#183; every 1s &#183; up to 5m</text>

  <line x1="160" y1="166" x2="556" y2="166" stroke="#79d44e" stroke-width="2" marker-end="url(#async-arrow)"/>
  <text x="358" y="158" text-anchor="middle" fill="#c7c4ae" font-size="12" font-family="JetBrains Mono, monospace">GET status_url (or /api/async_requests/&lt;id&gt;)</text>

  <line x1="560" y1="198" x2="164" y2="198" stroke="#eec854" stroke-width="2" marker-end="url(#async-arrow-gold)"/>
  <text x="358" y="190" text-anchor="middle" fill="#eec854" font-size="12" font-family="JetBrains Mono, monospace">{ status: "queued" }</text>

  <line x1="160" y1="230" x2="556" y2="230" stroke="#79d44e" stroke-width="2" marker-end="url(#async-arrow)"/>
  <text x="358" y="222" text-anchor="middle" fill="#c7c4ae" font-size="12" font-family="JetBrains Mono, monospace">GET status_url</text>

  <line x1="560" y1="262" x2="164" y2="262" stroke="#eec854" stroke-width="2" marker-end="url(#async-arrow-gold)"/>
  <text x="358" y="254" text-anchor="middle" fill="#eec854" font-size="12" font-family="JetBrains Mono, monospace">{ status: "running" }</text>

  <!-- terminal -->
  <line x1="560" y1="330" x2="164" y2="330" stroke="#92df62" stroke-width="2.5" marker-end="url(#async-arrow-gold)"/>
  <text x="358" y="322" text-anchor="middle" fill="#92df62" font-size="12" font-weight="700" font-family="JetBrains Mono, monospace">{ status: "success", payload }  &#8226;  or "error" &#8594; APIError</text>

  <text x="160" y="360" text-anchor="middle" fill="#a19f89" font-size="11" font-family="IBM Plex Sans, sans-serif">caller sees one synchronous-looking call</text>
</svg>
